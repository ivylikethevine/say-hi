# OpenSSF Scorecard maintainer annotations (.github/workflows/scorecard.yml);
# https://github.com/ossf/scorecard/blob/main/config/README.md. Display only -
# they never change the score - so a finding this repo will not fix reads as
# decided rather than unnoticed. The prose version of the pinned-dependencies
# entry is docs/TESTING.md, "What is pinned, and what deliberately is not".
#
# code-review is deliberately not annotated: the 0/9 finding is accurate (no
# second reviewer) and no reason code says so truthfully; docs/ROADMAP.md's
# Scorecard ceiling note covers it.
annotations:
  - checks:
      - pinned-dependencies
    reasons:
      - reason: test-data
        # All under tests/dockerfiles/, never in a release: eight `FROM ${BASE}`
        # lines name images the suite builds locally (no upstream digest to
        # pin), and the three `curl | sh` framework installers pin a release
        # but not a hash, the only state Scorecard's downloadThenRun probe sees.

  - checks:
      - fuzzing
    reasons:
      - reason: not-applicable
        # bash. Scorecard detects OSS-Fuzz, ClusterFuzzLite, Go native fuzzing,
        # cargo-fuzz and OneFuzz; none has a shell target.

  - checks:
      - contributors
    reasons:
      - reason: not-applicable
        # Wants >=2 contributing organizations. Single maintainer.
