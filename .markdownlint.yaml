# SPDX-License-Identifier: MIT
# markdownlint rules for every tracked .md; CI runs markdownlint-cli2 with them.
default: true

# MD049 "consistent" would infer the emphasis style per file; naming it makes
# the answer the same everywhere. Underscore is what the docs already use;
# **bold** is MD050's business and stays asterisks.
MD049:
  style: underscore

# MD013/line-length: off. Prose is hand-wrapped, and tables and code can't wrap.
MD013: false

# MD025/single-h1: only the `# H1` counts as a page's title, never a front
# matter `title:`. No page here carries front matter, so this only keeps one
# that slips in from counting as a second H1.
MD025:
  front_matter_title: ""
