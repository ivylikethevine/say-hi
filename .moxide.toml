# markdown-oxide (LSP) settings for this repo. The linter of record for the
# docs is markdownlint (.markdownlint.yaml); this file only keeps oxide from
# disagreeing with it.
#
# oxide resolves `[text](path)` against the vault root, never the containing
# file, and matches `#fragments` by lowercasing the heading and swapping
# spaces for dashes - punctuation kept (src/vault/mod.rs, heading_to_slug).
# Neither is configurable. GitHub and markdownlint's MD051 strip punctuation
# (`## HI.33 derived tree location` -> `#hi33-derived-tree-location`) and
# resolve paths relative to the file, so every `../README.md` from docs/ and
# every GLOSSARY anchor is "unresolved" to oxide while being correct
# everywhere else. Those diagnostics are noise here, so they are off; jump-to
# and completion keep working for the links oxide can see.
unresolved_diagnostics = false

# dist/ holds the packaging stage (a second copy of README.md and settings/),
# which would make every README heading ambiguous.
excluded_folders = ["dist"]

# Completions write links the way the docs already spell them: with the .md
# extension, and headings as slugs rather than raw text.
include_md_extension_md_link = true
include_md_extension_wikilink = true
heading_slug = true
