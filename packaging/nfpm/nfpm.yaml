# nfpm turns this one file into .deb/.rpm/.apk - the "PPA answer": users install
# a file they downloaded from a GitHub Release rather than subscribing to a
# repository. Driven by packaging/mkpkg.sh, which stages the tree first.
#
# Note what is NOT here: any list of what say-hi consists of. mkpkg.sh runs
# `scripts/install.sh --prefix /usr/share` with $DESTDIR pointed at dist/staging
# first, so install_tree stays the single decider of a packaged install's
# contents and this file only says where that staged tree lands. The packaging
# suite fails if the paths below stop matching what install_tree produces.
#
# ${HI_VERSION} is expanded by nfpm from the environment; mkpkg.sh defaults it
# to a real release's own PKGBUILD (bump.sh already rewrote it by then), or
# else this checkout's newest tag - packaging/aur/say-hi/PKGBUILD on main is a
# permanent 0.0.0 template, never the version of record outside a release.

name: say-hi
arch: all
platform: linux
version: ${HI_VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: Ivy Duggan <ivylikethevine@gmail.com>
vendor: Ivy Duggan
homepage: https://github.com/ivylikethevine/say-hi
license: MIT
description: |
  sshrc supercharged - your shell config, on every host you say hi to.
  Copies your shell configuration to ssh hosts, docker/podman containers,
  nomad allocations and kubernetes pods, and takes it back out on exit.

# Debian names, which the apk shares; only the rpm override renames. No
# base64 dependency needed: hi armors the ssh bootstrap with `base64`, which
# every base system already carries (coreutils on deb/rpm, busybox on apk).
depends:
  - bash
  - openssh-client
overrides:
  rpm:
    depends:
      - bash
      - openssh-clients

# The apk is signed when mkpkg.sh exports HI_APK_KEY (CI does, from the
# APK_SIGNING_KEY secret on the release environment); with it unset nfpm builds the same apk
# unsigned, so local builds keep working keyless. key_name is the filename
# users drop into /etc/apk/keys/ - it is not env-expanded by nfpm, and it is
# public information anyway, so it is spelled out.
apk:
  signature:
    key_file: ${HI_APK_KEY}
    key_name: say-hi.rsa.pub

# The rpm the same way, with the GPG key the package repository is signed by
# (mkrepo.sh): HI_GPG_KEY is an armored, passphrase-free secret key, exported
# by release.yml's build from the GPG_SIGNING_KEY repository secret and unset
# everywhere else, where the rpm builds unsigned. `dnf gpgcheck=1` verifies
# this signature; the repository's own is over repomd.xml.
rpm:
  signature:
    key_file: ${HI_GPG_KEY}

contents:
  - src: ./dist/staging/usr/share/say-hi
    dst: /usr/share/say-hi
    type: tree

  # Deliberately no staging prefix in src: this is the link target on the
  # *installed* system, and dist/staging is not there at runtime - the same
  # reason install_tree leaves $DESTDIR off its own ln.
  - src: /usr/share/say-hi/hi.sh
    dst: /usr/bin/hi
    type: symlink

  # The one thing a package can do that a package cannot ask the user to do:
  # every login shell needs _HI_HOME=/usr/share before it sources anything, and
  # the package must not rewrite anyone's rc files to say so.
  - src: ./dist/staging/etc/profile.d/say-hi.sh
    dst: /etc/profile.d/say-hi.sh

  - src: ./dist/staging/usr/share/man/man1/hi.1.gz
    dst: /usr/share/man/man1/hi.1.gz
