# SPDX-License-Identifier: MIT
# Advisories against .github/package-lock.json accepted as not applicable,
# each with its reason. Two readers: OpenSSF Scorecard's Vulnerabilities check
# (osv-scanner looks for this file beside the lockfile) and advisories.yml,
# where a repo has one, which leaves these ids out of its tracking issue.
#
# Only for an advisory with no patched release to move to. Each entry expires,
# so one that is never fixed still comes back for review, and advisories.yml
# flags an entry the audit no longer reports; it comes out then.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-07
reason = "braces: every release through 3.0.3 (the latest) is affected, via markdownlint-cli2 > micromatch. The stack exhaustion needs a hostile, deeply nested brace pattern, and the only patterns this dev-only lint tool expands are the repository's own globs."
