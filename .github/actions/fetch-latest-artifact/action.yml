name: Fetch latest artifact
# pages.yml's lookup of the newest successful run of a workflow and one or
# more named artifacts from it - CI's totals and package sizes, coverage's
# and coverage-v2's pct, demos' GIFs. A caller with two artifacts from the
# same run (pages.yml's two pairs, release.yml's badge figures,
# coverage.yml's PR comment) names both in one call rather than paying for
# the same run lookup twice; each then lands under its own name inside
# dest-subdir instead of flat, exactly as actions/download-artifact's own
# `pattern` does for more than one match.
description: Find the newest successful run of a workflow and download one or more artifacts from it

inputs:
  workflow:
    description: workflow filename to query, e.g. ci.yml
    required: true
  artifact-name:
    description: name of the artifact to download, or a brace pattern naming several from the same run (e.g. "{a,b}")
    required: true
  dest-subdir:
    description: destination directory under runner.temp
    required: true
  found-message:
    description: logged as "<found-message> <run_id>" when a run is found
    required: true
  missing-message:
    description: logged when no successful run exists
    required: true
  warn-on-missing:
    description: "'true' to log the missing case as a ::warning instead of a plain echo"
    required: false
    default: "false"
  head-sha:
    description: "a commit sha: find the newest successful run *of that commit* rather than of main (release.yml's tag figures)"
    required: false
    default: ""
  branch:
    description: "branch to scope the search to; empty means any ref - for a producer whose runs never land on main (demos.yml is tag-only, so its head_branch is the tag)"
    required: false
    default: "main"

runs:
  using: composite
  steps:
    # By query rather than off a workflow_run payload, so one code path serves
    # every trigger. With head-sha the query is pinned to one
    # commit instead - a workflow_run-triggered run (coverage) carries the
    # triggering push's sha, so the same shape finds every producer. With
    # branch empty instead, the query carries no ref filter at all - what a
    # tag-only producer needs, since a tag push's head_branch is the tag, never
    # branch=main.
    - id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ inputs.workflow }}
        FOUND_MESSAGE: ${{ inputs.found-message }}
        MISSING_MESSAGE: ${{ inputs.missing-message }}
        WARN_ON_MISSING: ${{ inputs.warn-on-missing }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        if [ -n "$HEAD_SHA" ]; then
          scope="head_sha=$HEAD_SHA"
        elif [ -n "$BRANCH" ]; then
          scope="branch=$BRANCH"
        else
          scope=""
        fi
        run_id="$(gh api \
          "repos/$REPO/actions/workflows/$WORKFLOW/runs?${scope:+$scope&}status=success&per_page=1" \
          --jq '.workflow_runs[0].id // empty')"
        echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
        if [ -n "$run_id" ]; then
          echo "$FOUND_MESSAGE $run_id"
        elif [ "$WARN_ON_MISSING" = true ]; then
          echo "::warning::$MISSING_MESSAGE"
        else
          echo "$MISSING_MESSAGE"
        fi

    # continue-on-error, not a gate: an expired or missing artifact is a grey
    # badge or an absent render, not a failed site deploy. `pattern`, not
    # `name`: a single bare name is still an exact match and lands flat in
    # dest-subdir exactly as `name` would, but it is also what lets a caller
    # pass "{a,b}" and get both from the one lookup above.
    - if: steps.find.outputs.run_id != ''
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.dest-subdir }}
        run-id: ${{ steps.find.outputs.run_id }}
        github-token: ${{ github.token }}
