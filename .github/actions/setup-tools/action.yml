name: Setup tools
# Pinned CI tools from ../setup-tool/tools.txt: resolved, cached, downloaded,
# sha256-verified, installed. The roster lives in tools.txt rather than in
# per-tool actions or `run:` lines, so .github/scripts/check_tool_versions.sh
# reads the same rows and no pin goes undrift-checked. One actions/cache round
# trip covers every tool named; editing one tool's row redownloads the others
# in the same call, which is cheap since rows move rarely.
description: Install pinned CI tools from ../setup-tool/tools.txt, sha256-verified, with one shared cache round trip

inputs:
  tools:
    description: space-separated tool names - each the first column of a ../setup-tool/tools.txt row
    required: true

runs:
  using: composite
  steps:
    # one row lookup per tool (no network), so the key hashes every row
    # together; an unknown tool or an unsupported platform fails here
    - name: Resolve every pin in ${{ inputs.tools }}
      id: resolve
      shell: bash
      env:
        CI_TOOLS: ${{ inputs.tools }}
      run: '"$GITHUB_ACTION_PATH/resolve.sh"'

    - name: Cache ${{ inputs.tools }}
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.paths }}
        key: setup-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.key }}

    - name: Install whatever missed the cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CI_TOOLS: ${{ inputs.tools }}
      run: '"$GITHUB_ACTION_PATH/install-missing.sh"'
