name: Advisory note
# The tail every advisory (never-blocking) check ends with: a ::warning
# annotation plus a $GITHUB_STEP_SUMMARY section. The call site keeps the
# tool-specific `if:` and any ANSI-stripping or truncation of the report.
# This step never fails the job - a missing report is noted, not fatal.
description: Emit a ::warning annotation and a step-summary section for a non-blocking finding

inputs:
  title:
    description: the ::warning title=... value
    required: true
  warning-body:
    description: the ::warning message body
    required: true
  heading:
    description: the step-summary '### ...' heading, without the '### '
    required: true
  body:
    description: the explanatory sentence(s) under the heading
    required: true
  report-file:
    description: optional path to a file cat'd into a fenced code block after body
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TITLE: ${{ inputs.title }}
        WARNING_BODY: ${{ inputs.warning-body }}
        HEADING: ${{ inputs.heading }}
        BODY: ${{ inputs.body }}
        REPORT_FILE: ${{ inputs.report-file }}
      run: |
        set -euo pipefail

        # Workflow-command escaping: a raw newline would end the annotation
        # and let the rest of the text run as a command of its own. Property
        # values (title) also escape the ':' and ',' that delimit them.
        esc_data() {
          local s="${1//"%"/%25}"
          s="${s//$'\r'/%0D}"
          printf '%s' "${s//$'\n'/%0A}"
        }
        esc_prop() {
          local s
          s="$(esc_data "$1")"
          s="${s//:/%3A}"
          printf '%s' "${s//,/%2C}"
        }
        echo "::warning title=$(esc_prop "$TITLE")::$(esc_data "$WARNING_BODY")"

        {
          echo "### $HEADING"
          echo
          printf '%s\n' "$BODY"
          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            # a fence longer than any backtick run in the report, so a
            # report quoting ``` cannot close the block early
            longest="$(grep -o '`\+' "$REPORT_FILE" | awk '{ if (length($0) > m) m = length($0) } END { print m + 0 }')"
            fence='```'
            while [ "${#fence}" -le "$longest" ]; do fence="$fence\`"; done
            echo
            echo "$fence"
            cat "$REPORT_FILE"
            # a report without a trailing newline would glue the fence to it
            [ -z "$(tail -c1 "$REPORT_FILE")" ] || echo
            echo "$fence"
          elif [ -n "$REPORT_FILE" ]; then
            echo
            echo "_(report file \`$REPORT_FILE\` was not written)_"
          fi
        } >>"$GITHUB_STEP_SUMMARY"
