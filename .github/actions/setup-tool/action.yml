name: Setup tool
# One action for every pinned CI tool. The roster - version, download URL,
# archive shape, verify flag - lives in ./tools.txt, and
# .github/scripts/check_tool_versions.sh reads the same rows, so a pin cannot
# go undrift-checked.
description: Install one of the pinned CI tools listed in ./tools.txt, with caching

inputs:
  tool:
    description: which tool to install - the first column of a ./tools.txt row
    required: true
  version:
    description: override that row's pin (normally left empty)
    required: false
    default: ""

outputs:
  version:
    description: the version that was installed
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    # actions/cache needs the version as an expression and the pin lives in
    # tools.txt, so a prior step resolves it and hands it back as an output.
    - name: Resolve the pin for ${{ inputs.tool }}
      id: resolve
      shell: bash
      env:
        HI_TOOL: ${{ inputs.tool }}
        HI_TOOL_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/install.sh" resolve'

    # runner.os/runner.arch on every tool, not only shellcheck (the one
    # installed on macOS): one key shape beats a per-tool column.
    - name: Cache ${{ inputs.tool }}
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/bin/${{ inputs.tool }}
        key: ${{ inputs.tool }}-${{ steps.resolve.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install ${{ inputs.tool }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        HI_TOOL: ${{ inputs.tool }}
        HI_TOOL_VERSION: ${{ steps.resolve.outputs.version }}
      run: '"$GITHUB_ACTION_PATH/install.sh" install'
