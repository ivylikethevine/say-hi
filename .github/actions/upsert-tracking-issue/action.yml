name: Upsert tracking issue
# One labeled, reused issue per standing finding - opened when actionable,
# rewritten on every later run while it stays so, closed the run it clears.
# Callers compose the report body and decide `resolved`; the "Found by"
# footer, the close comment's run link, and the step summary are added here,
# so every tracking issue says them the same way - callers must not add
# their own.
#
# Polarity: `resolved: true` means "nothing to report" (close). A caller
# thinking "actionable" writes the opposite expression.
#
# GH_REPO is set, so no checkout is needed. Needs `issues: write`.
description: Create, update, or close one labeled GitHub issue tracking a standing finding

inputs:
  label:
    description: the issue label (also the tracking key - one open issue per label)
    required: true
  label-color:
    description: hex color (no '#') for `gh label create`
    required: true
  label-description:
    description: description for `gh label create`
    required: true
  title:
    description: issue title, used on both create and edit
    required: true
  resolved:
    description: "'true' when this run found nothing actionable - closes any open issue instead of upserting"
    required: true
  close-comment:
    description: comment left on the issue when it's closed; a "[Latest run](...)" link is appended
    required: true
  resolved-when:
    description: completes the body footer "Closed automatically once <resolved-when>." on a non-resolved upsert; empty skips the footer
    required: false
    default: ""
  body-file:
    description: path to the fully-composed markdown issue body; required unless resolved is 'true'
    required: false
    default: ""
  write-summary-on-resolved:
    description: "'true' if body-file should still be cat'd to $GITHUB_STEP_SUMMARY when resolved is 'true'"
    required: false
    default: "false"
  warning-title:
    description: optional ::warning title=... emitted after a non-resolved upsert
    required: false
    default: ""
  warning-body:
    description: the ::warning message body, only used when warning-title is set
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        LABEL: ${{ inputs.label }}
        LABEL_COLOR: ${{ inputs.label-color }}
        LABEL_DESCRIPTION: ${{ inputs.label-description }}
        TITLE: ${{ inputs.title }}
        RESOLVED: ${{ inputs.resolved }}
        CLOSE_COMMENT: ${{ inputs.close-comment }}
        RESOLVED_WHEN: ${{ inputs.resolved-when }}
        BODY_FILE: ${{ inputs.body-file }}
        WRITE_SUMMARY_ON_RESOLVED: ${{ inputs.write-summary-on-resolved }}
        WARNING_TITLE: ${{ inputs.warning-title }}
        WARNING_BODY: ${{ inputs.warning-body }}
      run: |
        set -euo pipefail
        run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

        # checked before any API call, so a caller bug fails with this
        # message instead of an issue edited to an empty body
        if [ "$RESOLVED" != true ] && { [ -z "$BODY_FILE" ] || [ ! -f "$BODY_FILE" ]; }; then
          echo "::error title=upsert-tracking-issue::resolved is '$RESOLVED' but body-file '${BODY_FILE}' does not exist - write the report before this step"
          exit 1
        fi

        # --force is create-or-update, so a deleted label heals itself rather
        # than turning every later `issue create` into a hard failure
        gh label create "$LABEL" --force --color "$LABEL_COLOR" \
          --description "$LABEL_DESCRIPTION" >/dev/null

        # one issue, reused: the finding is a standing state, not an event
        open="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')"

        if [ "$RESOLVED" = true ]; then
          if [ "$WRITE_SUMMARY_ON_RESOLVED" = true ] && [ -n "$BODY_FILE" ] && [ -f "$BODY_FILE" ]; then
            cat "$BODY_FILE" >>"$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "$CLOSE_COMMENT [Latest run]($run_url)."
          fi
          echo "nothing actionable"
          exit 0
        fi

        # a copy, so the caller's file is not changed under it
        body="$(mktemp "${RUNNER_TEMP:-/tmp}/tracking-issue.XXXXXX")"
        cat "$BODY_FILE" >"$body"
        if [ -n "$RESOLVED_WHEN" ]; then
          # shellcheck disable=SC2016 # the backticks are a markdown code span
          printf '\nFound by [`%s`](%s). Closed automatically once %s.\n' \
            "$LABEL" "$run_url" "$RESOLVED_WHEN" >>"$body"
        fi

        # --body-file, not --body: markdown with blank lines and backticks
        # survives a file, not a YAML-indented shell string
        cat "$body" >>"$GITHUB_STEP_SUMMARY"

        if [ -n "$open" ]; then
          gh issue edit "$open" --title "$TITLE" --body-file "$body"
          echo "updated #$open"
        else
          gh issue create --label "$LABEL" --title "$TITLE" --body-file "$body"
        fi

        if [ -n "$WARNING_TITLE" ]; then
          # workflow-command escaping, as in ../advisory-note
          esc_data() {
            local s="${1//"%"/%25}"
            s="${s//$'\r'/%0D}"
            printf '%s' "${s//$'\n'/%0A}"
          }
          title="$(esc_data "$WARNING_TITLE")"
          title="${title//:/%3A}"
          echo "::warning title=${title//,/%2C}::$(esc_data "$WARNING_BODY")"
        fi
