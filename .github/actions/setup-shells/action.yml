name: Setup shells
# The zsh/fish every fast/lint/bench job needs for say-hi's non-bash dialects,
# once, so a package-list change or an apt mitigation is one edit.
description: Install zsh and fish for the suites' non-bash dialect checks, plus any extra apt packages

inputs:
  extra-packages:
    description: additional apt packages to install alongside zsh and fish (Linux only)
    required: false
    default: ""

runs:
  using: composite
  steps:
    # setup-backends' cached install: roughly a dozen jobs a push (test, lint,
    # bench, every coverage shard) each pay their own apt-get otherwise
    - if: runner.os == 'Linux'
      uses: ./.github/actions/setup-backends
      with:
        backends: none
        extra-packages: zsh fish ${{ inputs.extra-packages }}

    # macOS ships zsh; fish comes from brew, without brew updating itself first
    - if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew install fish
