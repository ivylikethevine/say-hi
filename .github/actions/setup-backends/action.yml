name: Setup backends
# The podman/nomad/kind install that ci.yml's e2e-backends job and demos.yml's
# publish job both need. The HashiCorp keyring fetch is the one
# security-relevant download in either job, so it lives here once: a key or
# URL change, or a fix to the gpg pipeline, is one edit. Neither caller may
# assume the other ran on the machine, and apt is idempotent when it has.
#
# The downloaded .debs are cached under $RUNNER_TEMP rather than apt's own
# /var/cache/apt/archives: that directory is root-owned, and actions/cache
# restores as the unprivileged runner user, so a hit there would fail to
# write. podman/nomad aren't pinned like tools.txt's rows - they float with
# apt/HashiCorp's latest - so the key is rounded to the week rather than held
# forever: a hit skips the re-download, and the key rolls over on its own
# before the packages can go stale for long.
description: Install the backends the e2e suites and demo renders drive (podman, nomad, kind), plus any extra apt packages

inputs:
  extra-packages:
    description: additional apt packages to install alongside podman and nomad
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: This week, for the cache key
      id: week
      shell: bash
      run: printf 'week=%s\n' "$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"

    - name: Cache podman/nomad's downloaded .debs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-archives
        key: setup-backends-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ inputs.extra-packages }}

    # the shell lives in ./install.sh, where the lint gate's shellcheck and
    # shfmt sweep it; the input arrives unquoted on purpose - a word list,
    # one apt name each
    - name: Install podman and nomad
      shell: bash
      env:
        HI_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        HI_APT_CACHE: ${{ runner.temp }}/apt-archives
      run: '"$GITHUB_ACTION_PATH/install.sh" $HI_EXTRA_PACKAGES'

    - name: Install kind
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      with:
        install_only: true
