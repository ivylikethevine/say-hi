# zizmor configuration. Ignores are rule-level here or inline
# (`# zizmor: ignore[<rule>]` on the flagged line), never by line number: a
# line-numbered entry silently detaches the moment its file is edited.
rules:
  # self-repository wants every local `uses: ./.github/...` rewritten to
  # GitHub's `$/` syntax, but OpenSSF Scorecard's Pinned-Dependencies check
  # only recognises `./` as a local action and reads each `$/` reference as an
  # unpinned third-party action. Revisit when Scorecard understands `$/`.
  self-repository:
    disable: true

  # unpinned-tools is not listed: every scanner installs a sha256-pinned
  # binary, never a floating download.

  # dangerous-triggers is not listed: each workflow_run trigger carries an
  # inline `# zizmor: ignore[dangerous-triggers]` on its own `workflow_run:`
  # line, the one zizmor flags, with the justification in that file's header.
  # On `on:` it matches only some zizmor versions (1.31.0 misses it), so
  # lint_workflows.sh rejects an ignore there.
