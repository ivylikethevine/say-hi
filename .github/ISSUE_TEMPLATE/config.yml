blank_issues_enabled: true
contact_links:
  - name: Report a vulnerability
    url: https://github.com/ivylikethevine/say-hi/security/advisories/new
    about: >-
      Anything exploitable goes here privately, never in a public issue.
  - name: Security policy
    url: https://github.com/ivylikethevine/say-hi/blob/main/docs/SECURITY.md
    about: >-
      What's in scope, what's out of scope, and how reports are handled -
      worth reading before deciding something is a bug.
  - name: Ask a question
    url: https://github.com/ivylikethevine/say-hi/discussions
    about: >-
      Questions, setup help, and ideas that aren't a bug report or a concrete
      feature request.
  - name: Getting help
    url: https://github.com/ivylikethevine/say-hi/blob/main/docs/SUPPORT.md
    about: >-
      Where to ask, what to include (`hi --doctor --json` output), and what to expect
      from a one-maintainer project.
  - name: Supported targets, OSes and shells
    url: https://github.com/ivylikethevine/say-hi/blob/main/docs/COMPATIBILITY.md
    about: >-
      Every one hi supports, and every one answered no with the reason -
      check here before asking for a new one.
