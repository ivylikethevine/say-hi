# Keeps the SHA-pinned `uses:` in the workflows, the setup-tool action AND the
# digest-pinned base images in tests/dockerfiles moving via PRs instead of
# memory. What this does not cover: the curl-installed tool versions in
# .github/actions/setup-tool/tools.txt (shellcheck, shfmt, checkbashisms,
# actionlint, zizmor, nfpm, minisign, kcov) - those move by editing that file's
# version column, and dependabot has no ecosystem for them; the tool-versions
# workflow watches that drift instead.
#
# Renovate was weighed as a replacement for both, and the answer is no - written
# here so the question stops being reopened. It would genuinely cover all three
# classes: `customManagers` match arbitrary files by regex, so tools.txt's
# version column and the plain image tags in shell (tests/lib/backend.sh,
# docs/tapes/fixtures.sh, ci.yml) would become managed dependencies that get
# *bumped* rather than merely guarded by lint_image_tags. What it costs is worse
# than what it buys at this size: a second bot app on the repo, a renovate.json
# that is its own dialect to learn, and - the deciding one - tool-versions.yml
# fails loudly with ::warning annotations in a run where Renovate opens pull
# requests. For ten curl-installed pins, trading an annotation for a PR stream
# is a downgrade in signal. Revisit if that roster grows several times over.
#
# The other question that keeps coming back: can dependabot open a PR only when
# the bump reduces the number of known vulnerabilities? No. That is a separate
# feature - dependabot *security* updates, driven by alerts against the GitHub
# Advisory Database and toggled in repo settings rather than configured here.
# Nothing in this file gates version updates on severity; `applies-to:
# security-updates` groups security PRs, it does not create them.
#
# The nearest lever is `open-pull-requests-limit: 0`, which disables version
# updates for one ecosystem while leaving security updates untouched - and it is
# the wrong answer for both blocks below, for different reasons. github-actions
# would freeze between the rare published action advisory, when what the
# cooldown below guards is release freshness rather than advisories. docker
# would go silent outright: it is version-updates-only, because GHSA has no
# container ecosystem for an alert to come from, so there is no security-update
# half to fall back on. The severity question for the base images is answered by
# image-scan.yml instead, which measures it with trivy rather than asking for it
# here.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # let a new action release age before a bump PR shows up - a freshly
    # compromised release's window is its first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7

  # The three upstream base images the test fixtures build on, pinned by digest
  # in tests/dockerfiles/*.Dockerfile. A digest never moves, which is the point
  # and also the hazard: without this, `alpine:3.24` would keep meaning whatever
  # it meant the day it was pinned, security fixes included, and nothing would
  # say so. The `docker` ecosystem reads Dockerfiles specifically - the same
  # images named in shell (tests/test_lib.sh, docs/tapes/fixtures.sh) are out of
  # its reach, which is why those stay on tags.
  - package-ecosystem: docker
    directory: "/tests/dockerfiles"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # bash:3.2 is a constant, not a version to keep current. That image is the
    # bash 3.2 floor - the version macOS still ships and the one every bash 4
    # builtin hi might reach for is missing from (sshd-bash32.Dockerfile says
    # so) - and a bump to bash:5 would leave the suite green while testing
    # nothing it exists to test. Only the semver update-types are ignored, so
    # digest refreshes within 3.2 still arrive: the tag stays put, the layers
    # underneath it stay current.
    ignore:
      - dependency-name: "bash"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
