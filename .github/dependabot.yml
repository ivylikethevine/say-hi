# Names what dependabot could move: the SHA-pinned `uses:` in the workflows
# and composite actions, the Markdown tools' npm lock, and the digest-pinned
# base images in tests/dockerfiles.
#
# What this file cannot cover, and what covers it instead:
#
#   * The CI tools in .github/actions/setup-tool/tools.txt and the inline pins
#     in .github/scripts/check_tool_versions.local.sh (bashcov, vhs, the
#     just-the-docs theme): tool-versions.yml reports their drift in the same
#     tracking issue, with the same 7-day cooldown.
#   * The same base images run outside a Dockerfile (packaging/mkrepo.sh,
#     ci.yml's packaging smoke): check_tool_versions.local.sh reports them
#     parting from the tests/dockerfiles digests, and tests/lint/drift_test.sh
#     keeps every plain image tag one of those pins.
#   * Whether an image bump fixes anything: the docker ecosystem is
#     version-updates-only (GHSA has no container ecosystem), and a digest is
#     just a digest. image-scan.yml measures that with trivy.
#
# Renovate was weighed and declined: it would cover tools.txt, but costs a
# second bot, its own config dialect, and a PR stream where tool-versions.yml
# keeps one tracking issue.
#
# Each entry sets `open-pull-requests-limit: 0`, so no version-update pull
# request opens: tool-versions.yml reports the same drift in one tracking
# issue, and every bump is a hand edit made from it. Deleting the limits turns
# the pull requests back on, with the schedule, cooldown and ignores they
# need. Dependabot security updates, if enabled in the repository settings,
# are not bound by the limit and still open their own pull requests.
version: 2

updates:
  # the composite actions under .github/actions/ pin their own `uses:`
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    # let a release age before its bump: a compromised release's window is its
    # first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7

  # .github/package.json -> package-lock.json (markdownlint-cli2, prettier)
  - package-ecosystem: npm
    directory: /.github
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  # the fixtures' digest-pinned base images, tests/dockerfiles/*.Dockerfile
  - package-ecosystem: docker
    directory: /tests/dockerfiles
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    # Each ignore protects a shell floor or ceiling a fixture exists to pin
    # (docs/COMPATIBILITY.md); check_tool_versions.local.sh reports an ignore
    # that no longer matches a fixture pin. Only semver update-types are
    # ignored, so a digest refresh would still arrive.
    ignore:
      # zshusers/zsh:5.5.1 is the zsh floor (zsh55.Dockerfile)
      - dependency-name: zshusers/zsh
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # bash:3.2 is the bash floor, what macOS ships (sshd-bash32.Dockerfile)
      - dependency-name: bash
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # ohmyfish/fish:3.4.1 is the fish floor (fish34.Dockerfile)
      - dependency-name: ohmyfish/fish
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # ubuntu 26.04 is the fish ceiling (fish4.Dockerfile) and 24.04 the apt
      # client CI's runners match (apt-client.Dockerfile); one ignore cannot
      # tell them apart, so both stay put and moving either is a hand edit
      - dependency-name: ubuntu
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
