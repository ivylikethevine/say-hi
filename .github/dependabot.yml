# Keeps the SHA-pinned `uses:` in the workflows and the setup-tool action, and
# the digest-pinned base images in tests/dockerfiles, moving via PRs. Not
# covered: the curl-installed tool versions in
# .github/actions/setup-tool/tools.txt - dependabot has no ecosystem for them;
# tool-versions.yml watches that drift.
#
# Renovate was weighed as a replacement and declined: it would cover tools.txt
# and the plain image tags in shell via customManagers, but costs a second bot
# app, its own config dialect, and a PR stream where tool-versions.yml keeps
# one tracking issue current. For ten curl-installed pins that is a downgrade
# in signal; revisit if the roster grows several times over.
#
# Dependabot cannot open a PR only when a bump reduces known vulnerabilities:
# that is dependabot *security* updates, toggled in repo settings, and
# `applies-to: security-updates` only groups those PRs. The nearest lever,
# `open-pull-requests-limit: 0`, is wrong for both blocks below: github-actions
# would freeze between rare action advisories when the cooldown guards release
# freshness, and docker would go silent outright (GHSA has no container
# ecosystem, so there is no security-update half). Base-image severity is
# image-scan.yml's job, measured with trivy.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # let a release age before its bump PR - a freshly compromised release's
    # window is its first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7
    # Two groups, not one PR per action: first-party actions/* release
    # together often enough that five identical bumps a week added nothing;
    # the third-party rest stay together for the same one-review reason.
    groups:
      actions:
        patterns:
          - "actions/*"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"

  # The upstream base images the fixtures build on, digest-pinned in
  # tests/dockerfiles/*.Dockerfile. A digest never moves, security fixes
  # included, and nothing would say so without this. The docker ecosystem
  # reads Dockerfiles only; the same images named in shell (tests/test_lib.sh,
  # docs/tapes/fixtures.sh) are out of its reach, so those stay on tags.
  - package-ecosystem: docker
    directory: "/tests/dockerfiles"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One PR per digest refresh round: all fixture bases, reviewed together.
    groups:
      fixtures:
        patterns:
          - "*"
    # bash:3.2 is the floor (what macOS ships), not a version to keep current:
    # a bump to bash:5 would leave the suite green while testing nothing it
    # exists to test. Only semver update-types are ignored, so digest refreshes
    # within 3.2 still arrive.
    #
    # ubuntu is pinned twice here - 24.04 the fish floor (fish37.Dockerfile),
    # 26.04 the fish ceiling (fish4.Dockerfile) - and a dependency-name ignore
    # cannot tell them apart, so this covers both: a major/minor bump against
    # either would move it off the fish major it exists to pin (24.04->26.04
    # swapped 3.7 for 4.x in PR #53). Digest refreshes within each major.minor
    # still arrive; moving either file to a new release stays a hand edit.
    #
    # zshusers/zsh:5.8 is the zsh floor (zsh58.Dockerfile), the same shape as
    # bash:3.2: a bump to 5.9 would leave the check green while it stopped
    # being a floor. Upstream retags rarely, so digest refreshes are moot, but
    # the semver ignore is what stops the bump PR.
    ignore:
      - dependency-name: "zshusers/zsh"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "bash"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
