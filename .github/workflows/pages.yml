name: Pages

# The repo's markdown as a site - README.md as the index, docs/ (minus
# docs/tldr.md, a byte-for-byte upstream draft _config.yml excludes) - plus
# badges/*.json, the shields endpoint README's badges read. Runs after every
# green CI run on main, or on dispatch. Needs Settings -> Pages -> Source set
# to GitHub Actions, so deploy-pages has somewhere to put the site.
#
# With that setting off the build still passes and only the deploy has nothing
# to write to; the README badge then renders `inaccessible`, which is the
# symptom to recognise. Publishing the badge figure rather than committing it
# into README.md keeps every push free of a bot commit on top of the author's,
# which is what lets main take branch protection.
#
# zizmor flags workflow_run because the usual mistake is a privileged run
# checking out the head SHA of whatever triggered it. This one checks out the
# default ref, takes the count from an API query for the newest green CI run on
# `main` rather than the triggering run's artifact, and `build`'s `if` takes
# only pushes - a fork PR on a branch named `main` cannot reach it.
#
# `workflow_run` off CI is the automatic trigger: ci.yml runs on every push to
# main with no path filter, so a `push` trigger on the markdown paths would add
# only a duplicate build and deploy, and would publish docs from a commit whose
# tests failed. The cost is latency - the site lands when CI goes green.
#
# Release is not a workflow_run trigger here, on purpose: this filters
# branches: [main], and a tag push's head_branch is the tag - which never
# matches, so naming Release above would claim a trigger that can never fire.
# A green tag run means a new package-repo.tar.gz to serve (below), so
# release.yml's publish job asks for a redeploy itself instead
# (`gh workflow run pages.yml`), which is what workflow_dispatch is for here.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys are not cancellable half-done: a superseded run finishes rather
# than leaving the site mid-swap (unlike ci.yml, where cancelling is right).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (jekyll)
    # jekyll-build-pages is a container action whose root-owned output gets
    # chown'd below, so this job has no `Reclaim the workspace` step and could
    # never run on a self-hosted runner.
    runs-on: ubuntu-latest
    # a red CI must not publish, and neither may a fork's PR run - `event`
    # pins it to a push to `main`. The other two triggers have no run to judge.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    timeout-minutes: 10
    # actions: read is for the cross-workflow artifact read below - the site
    # build itself still needs nothing but contents
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # the github-pages gem: the same Jekyll and plugin set github.com runs
      # itself - _config.yml says which of them the site leans on
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      # The badge files are written straight into _site after Jekyll has run,
      # so they need no front matter and no _config.yml exclusion. Each lookup
      # is by query rather than off the workflow_run payload: the newest green
      # run on main *is* the triggering run for that event, so one code path
      # serves push and dispatch. The lookup-then-download pair is
      # ./.github/actions/fetch-latest-artifact; totals and package sizes both
      # come from ci.yml's newest run and look it up twice to keep all five
      # steps the same shape.
      - name: Fetch CI's totals
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: ci.yml
          artifact-name: tests
          dest-subdir: totals
          found-message: counting from CI run
          missing-message: no successful CI run on main to read a count from
          warn-on-missing: "true"

      # separate artifacts from the same run: the count comes from `test`, the
      # sizes from `packaging-smoke`
      - name: Fetch CI's package sizes
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: ci.yml
          artifact-name: package-install-sizes
          dest-subdir: sizes
          found-message: sizing from CI run
          missing-message: no successful CI run on main to read package sizes from
          warn-on-missing: "true"

      # Coverage is its own lookup: coverage.yml is slow and chained off the
      # same CI event as this deploy, so a badge shows the last figure anyone
      # measured - at most one push behind. warn-on-missing stays off here
      # and below - a workflow with no successful run yet is a normal state.
      #
      # Both figures come from the same workflow (a two-job matrix, kcov and
      # bashcov) but are looked up separately by artifact name: each job
      # carries continue-on-error, so one tool failing does not fail the
      # run's overall status and grey out the other's badge too - see
      # coverage.yml's header comment for the trade that buys.
      - name: Fetch the last coverage run's kcov figure
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: coverage-pct
          dest-subdir: cov
          found-message: kcov figure from coverage run
          missing-message: no successful coverage run on main - the kcov badge stays grey

      - name: Fetch the last coverage run's bashcov figure
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: coverage-v2-pct
          dest-subdir: cov2
          found-message: bashcov figure from coverage run
          missing-message: no successful coverage run on main - the bashcov badge stays grey

      # The autogenerated demos, on the coverage pattern: demos.yml's render is
      # slow and not per-push, so the site carries the last GIFs anyone made.
      # None is committed, so this is their only source and README.md links
      # their published URLs; until a render lands those links 404, per
      # docs/PACKAGING.md's _Regenerating the demo GIFs_. docs/tapes/demo.gif
      # is not in the artifact - it is the hand-rendered, committed one, and
      # docs/tapes/ is excluded from the Jekyll build (_config.yml), so the
      # copy step below carries it into _site beside the rendered ones.
      - name: Fetch the last demo render's GIFs
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: demos.yml
          artifact-name: demo-gifs
          dest-subdir: demos
          found-message: demo GIFs from run
          missing-message: no successful demos run on main - the rendered GIFs are missing

      - name: Write the shields endpoint
        env:
          TOTALS: ${{ runner.temp }}/totals/totals
          SIZES: ${{ runner.temp }}/sizes/sizes
          COVPCT: ${{ runner.temp }}/cov/pct
          COVPCT2: ${{ runner.temp }}/cov2/pct
        run: |
          set -euo pipefail
          # jekyll-build-pages is a *container* action - it runs as root inside
          # docker, so _site comes back root-owned while this step runs as the
          # runner user, and a plain mkdir under it is denied. Same ownership
          # seam the workspace-reclaim step above exists for, reached a
          # different way, so it gets the same one-line answer.
          sudo chown -R "$(id -u):$(id -g)" _site
          # Every GIF is served from _site/docs/tapes/: the committed demo.gif
          # first (Jekyll excludes docs/tapes/, so nothing else puts it there),
          # then the rendered ones beside it, at the very path README.md's and
          # docs/SETTINGS.md's published URLs resolve to - so a fresh render
          # reaches the site with no link anywhere having to change.
          mkdir -p _site/docs/tapes
          cp docs/tapes/demo.gif _site/docs/tapes/
          if [ -d "$RUNNER_TEMP/demos" ]; then
            cp "$RUNNER_TEMP/demos"/*.gif _site/docs/tapes/ 2>/dev/null || true
            echo "published $(find "$RUNNER_TEMP/demos" -name '*.gif' | wc -l) rendered demo(s)"
          fi
          mkdir -p _site/badges
          # badge <file> <label> <color> <message> - one shields endpoint object.
          # The schema string was written out six times, once per branch of the
          # three badges below; what actually varies is the message and colour.
          badge() {
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s","cacheSeconds":300}\n' \
              "$2" "$4" "$3" >"_site/badges/$1"
          }

          passed=""
          # four fields: passed failed skipped selected (tests/test_runner.sh).
          # Redirect rather than pipe - `read` in a pipeline reads into a
          # subshell and the value never comes back.
          # `|| true`, or set -e takes the missing-file case out with it
          [ -f "$TOTALS" ] && read -r passed _ _ _ <"$TOTALS" || true
          if [ -n "$passed" ]; then
            badge tests.json tests 4c1 "$passed passed"
            echo "tests badge: $passed passed"
          else
            badge tests.json tests inactive unknown
            echo "::warning::no tests artifact to read - tests badge published as unknown"
          fi

          # README's package badge. Two figures in one message on purpose: the
          # deb is the download, the staging tree is what lands on disk, and a
          # badge showing only the smaller one would read as the whole cost.
          deb="" installed=""
          [ -f "$SIZES" ] && read -r deb installed <"$SIZES" || true
          if [ -n "$deb" ] && [ -n "$installed" ]; then
            badge package.json package 4c1 \
              "$(((deb + 512) / 1024)) KB deb / $(((installed + 512) / 1024)) KB installed"
            echo "package badge: $deb B deb, $installed B installed"
          else
            badge package.json package inactive unknown
            echo "::warning::no package-install-sizes to read - package badge published as unknown"
          fi

          # The kcov endpoint. Labelled by its measurer, not "coverage": the
          # two tools still skew a few points in opposite directions
          # (docs/TESTING.md's Coverage and profiling section), so each badge
          # names its tool and the agreeing pair is the claim. Informational
          # blue rather than pass/fail green - no threshold gates on these.
          # No warning on the empty branch: no successful coverage run yet is
          # a normal state, not something to flag.
          pct=""
          [ -f "$COVPCT" ] && read -r pct <"$COVPCT" || true
          if [ -n "$pct" ]; then
            badge coverage.json kcov informational "$pct%"
            echo "kcov badge: $pct%"
          else
            badge coverage.json kcov inactive "not measured"
            echo "kcov badge: no figure published yet"
          fi

          # The bashcov endpoint. Same treatment as the kcov one above: named
          # by its tool, informational blue. bashcov reads xtrace rather than
          # a DEBUG trap, and its residual skew runs the other way from
          # kcov's - heredoc bodies count as covered whether or not they ran,
          # while `env -i` children and in-container lines drop out - which
          # is exactly why both badges ship: the two cannot err in the same
          # direction, so their agreement is the claim.
          # No warning on the empty branch: no successful run yet is a normal
          # state, not something to flag.
          pct2=""
          [ -f "$COVPCT2" ] && read -r pct2 <"$COVPCT2" || true
          if [ -n "$pct2" ]; then
            badge coverage-v2.json bashcov informational "$pct2%"
            echo "bashcov badge: $pct2%"
          else
            badge coverage-v2.json bashcov inactive "not measured"
            echo "bashcov badge: no figure published yet"
          fi

      # The package repository, out of the newest non-prerelease release's
      # package-repo.tar.gz (docs/PACKAGING.md's _Package repository_) - a
      # release asset rather than a run artifact, so it outlives the 90-day
      # artifact expiry and every docs-only rebuild, and a candidate never
      # reaches a subscriber. Only the latest release is served; older packages
      # stay on their release pages. No release yet, or one shipped without the
      # asset (no GPG_SIGNING_KEY), is the normal state before v1: the site
      # goes out without the apt/, rpm/ and apk/ directories.
      - name: Unpack the package repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "no release yet - no package repository to serve"
            exit 0
          fi
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern package-repo.tar.gz --dir "$RUNNER_TEMP/repo" 2>/dev/null; then
            echo "::warning title=package repository::release $tag carries no package-repo.tar.gz - the repository is not served"
            exit 0
          fi
          tar -xzf "$RUNNER_TEMP/repo/package-repo.tar.gz" -C _site
          echo "package repository from $tag: $(find _site/apt _site/rpm _site/apk -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # split from the build so the write scopes live on the one job that needs
  # them, and the build stays read-only like every other job here
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
