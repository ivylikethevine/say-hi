name: Pages

# The repo's markdown as a site - README.md as the index, docs/ (minus
# docs/tldr.md, a byte-for-byte upstream draft _config.yml excludes) - plus
# badges/*.json, the shields endpoint README's badges read. Runs once per green
# push to main, when Coverage finishes, or on dispatch. Needs Settings -> Pages
# -> Source set to GitHub Actions, so deploy-pages has somewhere to put the site.
#
# With that setting off the build still passes and only the deploy has nothing
# to write to; the README badge then renders `inaccessible`, which is the
# symptom to recognise. Publishing the badge figure rather than committing it
# into README.md keeps every push free of a bot commit on top of the author's,
# which is what lets main take branch protection.
#
# zizmor flags workflow_run because the usual mistake is a privileged run
# checking out the head SHA of whatever triggered it. This one checks out the
# default ref, reads every figure through an API query for the newest green run
# on `main` rather than the triggering run's artifacts, and `build`'s `if`
# refuses a pull_request run - a fork PR on a branch named `main` cannot reach
# it.
#
# Coverage is the only automatic trigger. coverage.yml is chained off every CI
# run on main and is the last producer to finish, so deploying off CI as well
# built the site twice per push, the first time with the previous push's
# coverage figures. After a red CI every Coverage job skips, and that run never
# concludes success (the coverage lookups below lean on the same fact), so docs
# from a commit whose tests failed are still never published. A `push` trigger
# on the markdown paths would only add a duplicate deploy. The cost is latency -
# the site lands when the coverage sweep does.
#
# Release is not a workflow_run trigger here, on purpose: this filters
# branches: [main], and a tag push's head_branch is the tag - which never
# matches, so naming Release above would claim a trigger that can never fire.
# A green tag run means a new package-repo.tar.gz to serve (below), so
# release.yml's publish job asks for a redeploy itself instead
# (`gh workflow run pages.yml`), which is what workflow_dispatch is for here.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Coverage]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys are not cancellable half-done: a superseded run finishes rather
# than leaving the site mid-swap (unlike ci.yml, where cancelling is right).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (jekyll)
    runs-on: ubuntu-latest
    # A Coverage run's own event is workflow_run (following CI on main) or a
    # maintainer's dispatch; a pull_request one never publishes - a fork's
    # `main` would pass the branch filter. The dispatch trigger has no run to
    # judge.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    timeout-minutes: 10
    # actions: read is for the cross-workflow artifact read below - the site
    # build itself still needs nothing but contents
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # the github-pages gem: the same Jekyll and plugin set github.com runs
      # itself - _config.yml says which of them the site leans on
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      # The badge files are written straight into _site after Jekyll has run,
      # so they need no front matter and no _config.yml exclusion. Each
      # lookup is fetch-latest-artifact's query, which serves the Coverage
      # trigger and dispatch alike.
      # one lookup, both artifacts: the count comes from `test`, the sizes
      # from `packaging-smoke`, same run either way
      - name: Fetch CI's totals and package sizes
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: ci.yml
          artifact-name: "{tests,package-install-sizes}"
          dest-subdir: ci
          found-message: totals and sizes from CI run
          missing-message: no successful CI run on main to read totals or package sizes from
          warn-on-missing: "true"

      # The Coverage run that triggered this deploy is the newest successful
      # one, so this finds the figures it just wrote - both from one lookup,
      # so the pair can never come from two different runs. warn-on-missing
      # stays off - no successful run yet is a normal state.
      - name: Fetch the last coverage run's figures
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: "{coverage-pct,coverage-v2-pct}"
          dest-subdir: cov
          found-message: coverage figures from coverage run
          missing-message: no successful coverage run on main - both badges stay grey

      # The autogenerated demos, on the coverage pattern: demos.yml's render is
      # slow and tag-only, so the site carries the last GIFs anyone made. None
      # is committed, so this is their only source and README.md links their
      # published URLs; until a render lands those links 404, per
      # docs/PACKAGING.md's _Regenerating the demo GIFs_. docs/tapes/demo.gif
      # is not in the artifact - it is the hand-rendered, committed one, and
      # docs/tapes/ is excluded from the Jekyll build (_config.yml), so the
      # copy step below carries it into _site beside the rendered ones.
      #
      # branch: "" because demos.yml runs off a tag (or the cron/dispatch,
      # both of which do land on main) - a tag push's head_branch is the tag
      # itself, never main, so the default branch=main scope would find
      # nothing after the first tag-triggered render.
      - name: Fetch the last demo render's GIFs
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: demos.yml
          artifact-name: demo-gifs
          dest-subdir: demos
          branch: ""
          found-message: demo GIFs from run
          missing-message: no successful demos run - the rendered GIFs are missing

      - name: Write the shields endpoint
        env:
          TOTALS: ${{ runner.temp }}/ci/tests/totals
          SIZES: ${{ runner.temp }}/ci/package-install-sizes/sizes
          COVPCT: ${{ runner.temp }}/cov/coverage-pct/pct
          COVPCT2: ${{ runner.temp }}/cov/coverage-v2-pct/pct
        run: |
          set -euo pipefail
          # jekyll-build-pages is a *container* action - it runs as root inside
          # docker, so _site comes back root-owned while this step runs as the
          # runner user, and a plain mkdir under it is denied.
          sudo chown -R "$(id -u):$(id -g)" _site
          # Every GIF is served from _site/docs/tapes/: the committed demo.gif
          # first (Jekyll excludes docs/tapes/, so nothing else puts it there),
          # then the rendered ones beside it, at the very path README.md's and
          # docs/SETTINGS.md's published URLs resolve to - so a fresh render
          # reaches the site with no link anywhere having to change.
          mkdir -p _site/docs/tapes
          cp docs/tapes/demo.gif _site/docs/tapes/
          if [ -d "$RUNNER_TEMP/demos" ]; then
            cp "$RUNNER_TEMP/demos"/*.gif _site/docs/tapes/ 2>/dev/null || true
            echo "published $(find "$RUNNER_TEMP/demos" -name '*.gif' | wc -l) rendered demo(s)"
          fi
          mkdir -p _site/badges
          # badge <file> <label> <color> <message> - one shields endpoint object
          badge() {
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s","cacheSeconds":300}\n' \
              "$2" "$4" "$3" >"_site/badges/$1"
          }

          passed=""
          # four fields: passed failed skipped selected (tests/test_runner.sh).
          # Redirect rather than pipe - `read` in a pipeline reads into a
          # subshell and the value never comes back.
          # `|| true`, or set -e takes the missing-file case out with it
          [ -f "$TOTALS" ] && read -r passed _ _ _ <"$TOTALS" || true
          if [ -n "$passed" ]; then
            badge tests.json tests 4c1 "$passed passed"
            echo "tests badge: $passed passed"
          else
            badge tests.json tests inactive unknown
            echo "::warning::no tests artifact to read - tests badge published as unknown"
          fi

          # README's package badge. Two figures in one message on purpose: the
          # deb is the download, the staging tree is what lands on disk, and a
          # badge showing only the smaller one would read as the whole cost.
          deb="" installed=""
          [ -f "$SIZES" ] && read -r deb installed <"$SIZES" || true
          if [ -n "$deb" ] && [ -n "$installed" ]; then
            badge package.json package 4c1 \
              "$(((deb + 512) / 1024)) KB deb / $(((installed + 512) / 1024)) KB installed"
            echo "package badge: $deb B deb, $installed B installed"
          else
            badge package.json package inactive unknown
            echo "::warning::no package-install-sizes to read - package badge published as unknown"
          fi

          # cov <file> <tool> <pct file> - a coverage endpoint, labelled by its
          # measurer: the two skew a few points in opposite directions
          # (docs/TESTING.md's Coverage and profiling section), so the
          # agreeing pair is the claim. Informational blue - nothing gates on
          # these - and no warning when empty: no successful run yet is a
          # normal state. pct_ok (.github/scripts/pct_ok.sh, shared with
          # release.yml's freeze step and coverage.yml's PR comment) is what
          # refuses an all-zero figure - kcov's checkout-less merge, not a
          # measurement - the same way here as everywhere else one is shown.
          # shellcheck source=.github/scripts/pct_ok.sh
          source .github/scripts/pct_ok.sh
          cov() {
            local pct=""
            [ -f "$3" ] && read -r pct <"$3" || true
            if ! pct_ok "$pct"; then
              badge "$1" "$2" inactive "not measured"
              echo "$2 badge: no figure published yet${pct:+ ($pct is not a measurement)}"
            else
              badge "$1" "$2" informational "$pct%"
              echo "$2 badge: $pct%"
            fi
          }
          cov coverage.json kcov "$COVPCT"
          cov coverage-v2.json bashcov "$COVPCT2"

      # The package repository, out of the newest non-prerelease release's
      # package-repo.tar.gz (docs/PACKAGING.md's _Package repository_) - a
      # release asset rather than a run artifact, so it outlives the 90-day
      # artifact expiry and every docs-only rebuild, and a candidate never
      # reaches a subscriber. Only the latest release is served; older packages
      # stay on their release pages. No release yet, or one shipped without the
      # asset (no GPG_SIGNING_KEY), is the normal state before v1: the site
      # goes out without the apt/, rpm/, and apk/ directories.
      - name: Unpack the package repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "no release yet - no package repository to serve"
            exit 0
          fi
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern package-repo.tar.gz --dir "$RUNNER_TEMP/repo" 2>/dev/null; then
            echo "::warning title=package repository::release $tag carries no package-repo.tar.gz - the repository is not served"
            exit 0
          fi
          tar -xzf "$RUNNER_TEMP/repo/package-repo.tar.gz" -C _site
          echo "package repository from $tag: $(find _site/apt _site/rpm _site/apk -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # split from the build so the write scopes live on the one job that needs
  # them, and the build stays read-only like every other job here
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
