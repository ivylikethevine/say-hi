name: Pages

# The repo's markdown as a site: README.md as the index (it carries the demos,
# the comparison, the architecture, packaging and Windows material inline),
# plus what is left in docs/ - CONFIGURATION, TESTING, GLOSSARY, SECURITY, PACKAGING,
# ROADMAP, FUTURE and tldr - which interlink with relative links link-check.yml
# keeps honest.
#
# It also carries files Jekyll never sees: badges/*.json, the shields
# endpoint README's tests badge reads. Publishing the figure here rather than
# sed'ing it into README.md and committing it back keeps the number generated
# and keeps every push free of a bot commit on top of the author's - which is
# also what lets main take branch protection.
#
# Publishing is live: Settings -> Pages -> Source is set to GitHub Actions, so
# deploy-pages has somewhere to put the site and the badge endpoint answers. If
# that setting is ever turned off the build half here still passes and only the
# deploy has nothing to write to - at which point the README badge goes back to
# rendering `inaccessible`, which is the symptom to recognise.
#
# zizmor flags workflow_run as a dangerous trigger, and it is right about the
# usual shape of the mistake: a privileged run that checks out the head SHA of
# whatever it was triggered by. This one does not. It checks out the default
# ref, the count comes from an API query for the newest green CI run on `main`
# rather than from the triggering run's own artifact, and the `if` on `build`
# takes only pushes - a fork PR whose branch happens to be named `main` cannot
# reach it. Nothing here reads a single attacker-controlled byte.
#
# After CI, and only after CI - `workflow_run` is the single trigger, on
# purpose. A `push` trigger on the markdown paths would let prose publish
# without waiting out the suite, but ci.yml runs on *every* push to main with
# no path filter, so `workflow_run` already covers every commit such a trigger
# would catch; all it adds is a duplicate build and deploy on any push touching
# a .md, which is most of them. The cost is latency - the site lands when CI
# goes green rather than a couple of minutes in - and the gain is that it never
# publishes docs from a commit whose tests failed.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys are not cancellable half-done: a superseded run finishes rather
# than leaving the site mid-swap. (Note the difference from ci.yml, where
# cancelling a superseded PR run is exactly right.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (jekyll)
    # This job runs jekyll-build-pages, which is a container action, and then
    # has to chown its root-owned output - which is why it carries no
    # `Reclaim the workspace` step, unlike every other checkout in this repo.
    # It could never fire on a self-hosted runner (docs/SELFHOSTED-RUNNERS.md).
    runs-on: ubuntu-latest
    # a red CI must not publish, and neither may a fork's PR run - `event`
    # pins it to a push to `main`. The other two triggers have no run to judge.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    timeout-minutes: 10
    # actions: read is for the cross-workflow artifact read below - the site
    # build itself still needs nothing but contents
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # the github-pages gem, i.e. the same Jekyll and the same plugin set
      # github.com would run itself - see _config.yml for which of them the
      # site actually leans on
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      # The tests badge, in three steps, all of them after Jekyll has run: the
      # file is written straight into _site, so it needs no front matter and no
      # _config.yml exclusion to survive the build untouched.
      #
      # Each lookup below is by query rather than off the workflow_run payload
      # on purpose - the newest green run on main *is* the triggering run when
      # that is the event, so one code path serves push and dispatch too. The
      # lookup-then-download pair is ./.github/actions/fetch-latest-artifact;
      # totals and package sizes both come from ci.yml's newest run, so they
      # look it up twice rather than sharing a step - a second `gh api` call
      # is cheap and keeps every one of the five below the same shape.
      - name: Fetch CI's totals
        uses: ./.github/actions/fetch-latest-artifact
        with:
          workflow: ci.yml
          artifact-name: fast-totals
          dest-subdir: totals
          found-message: counting from CI run
          missing-message: no successful CI run on main to read a count from
          warn-on-missing: "true"

      # the same run totals came from - separate artifacts because they come
      # from different jobs: the count from `test`, the sizes from
      # `packaging-smoke`.
      - name: Fetch CI's package sizes
        uses: ./.github/actions/fetch-latest-artifact
        with:
          workflow: ci.yml
          artifact-name: package-sizes
          dest-subdir: sizes
          found-message: sizing from CI run
          missing-message: no successful CI run on main to read package sizes from
          warn-on-missing: "true"

      # Coverage is its own lookup, not the CI run above: coverage.yml is
      # dispatch-only and slow, so its newest successful run is almost never
      # the run that triggered this deploy. The badge therefore shows the last
      # figure anyone measured and keeps showing it until somebody measures
      # again - which is the honest behaviour for a number nobody runs weekly.
      # warn-on-missing stays off here (and below): a dispatch-only workflow
      # with no run yet is the normal state, not something to flag.
      - name: Fetch the last coverage run's kcov figure
        uses: ./.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: coverage-pct
          dest-subdir: cov
          found-message: kcov figure from coverage run
          missing-message: no successful coverage run on main - the kcov badge stays grey

      # The bashcov figure, looked up exactly as the kcov one above is and for
      # the same reason: coverage-v2.yml is dispatch-only, so its newest
      # successful run is almost never the run that triggered this deploy.
      - name: Fetch the last coverage-v2 run's bashcov figure
        uses: ./.github/actions/fetch-latest-artifact
        with:
          workflow: coverage-v2.yml
          artifact-name: coverage-v2-pct
          dest-subdir: cov2
          found-message: bashcov figure from coverage-v2 run
          missing-message: no successful coverage-v2 run on main - the bashcov badge stays grey

      # The autogenerated demos, on the coverage badge's pattern rather than the
      # tests badge's: demos.yml's render is slow and does not run on every
      # push, so its newest successful run is almost never the run that
      # triggered this deploy. The site therefore carries the last GIFs anyone
      # rendered and keeps carrying them until somebody renders again.
      #
      # None of them is committed any more, so this is the only place they come
      # from and README.md links them at their published URLs. Until a render
      # has landed there is nothing to serve and those links 404 - deliberate,
      # per docs/ROADMAP.md's Demos entry.
      #
      # docs/demos/demo.gif is deliberately not in that artifact - it is the
      # hand-rendered one, still committed, and Jekyll has already copied it
      # into _site, which is exactly where it should come from.
      - name: Fetch the last demo render's GIFs
        uses: ./.github/actions/fetch-latest-artifact
        with:
          workflow: demos.yml
          artifact-name: demo-gifs
          dest-subdir: demos
          found-message: demo GIFs from run
          missing-message: no successful demos run on main - the rendered GIFs are missing

      - name: Write the shields endpoint
        env:
          TOTALS: ${{ runner.temp }}/totals/totals
          SIZES: ${{ runner.temp }}/sizes/sizes
          COVPCT: ${{ runner.temp }}/cov/pct
          COVPCT2: ${{ runner.temp }}/cov2/pct
        run: |
          set -euo pipefail
          # jekyll-build-pages is a *container* action - it runs as root inside
          # docker, so _site comes back root-owned while this step runs as the
          # runner user, and a plain mkdir under it is denied. Same ownership
          # seam the workspace-reclaim step above exists for, reached a
          # different way, so it gets the same one-line answer.
          sudo chown -R "$(id -u):$(id -g)" _site
          # The rendered GIFs land beside the one committed GIF Jekyll copied,
          # at the very path README.md's and docs/CONFIGURATION.md's published
          # URLs resolve to - so a fresh render reaches the site with no link
          # anywhere having to change.
          if [ -d "$RUNNER_TEMP/demos" ]; then
            mkdir -p _site/docs/demos
            cp "$RUNNER_TEMP/demos"/*.gif _site/docs/demos/ 2>/dev/null || true
            echo "published $(find "$RUNNER_TEMP/demos" -name '*.gif' | wc -l) rendered demo(s)"
          fi
          mkdir -p _site/badges
          # badge <file> <label> <color> <message> - one shields endpoint object.
          # The schema string was written out six times, once per branch of the
          # three badges below; what actually varies is the message and colour.
          badge() {
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s","cacheSeconds":300}\n' \
              "$2" "$4" "$3" >"_site/badges/$1"
          }

          passed=""
          # four fields: passed failed skipped selected (tests/test_runner.sh).
          # Redirect rather than pipe - `read` in a pipeline reads into a
          # subshell and the value never comes back.
          # `|| true`, or set -e takes the missing-file case out with it
          [ -f "$TOTALS" ] && read -r passed _ _ _ <"$TOTALS" || true
          if [ -n "$passed" ]; then
            badge tests.json tests 4c1 "$passed passed"
            echo "tests badge: $passed passed"
          else
            badge tests.json tests inactive unknown
            echo "::warning::no fast-totals to read - tests badge published as unknown"
          fi

          # README's package badge. Two figures in one message on purpose: the
          # deb is the download, the staging tree is what lands on disk, and a
          # badge showing only the smaller one would read as the whole cost.
          deb="" installed=""
          [ -f "$SIZES" ] && read -r deb installed <"$SIZES" || true
          if [ -n "$deb" ] && [ -n "$installed" ]; then
            badge package.json package 4c1 \
              "$(((deb + 512) / 1024)) KB deb / $(((installed + 512) / 1024)) KB installed"
            echo "package badge: $deb B deb, $installed B installed"
          else
            badge package.json package inactive unknown
            echo "::warning::no package-sizes to read - package badge published as unknown"
          fi

          # The kcov endpoint. Published for anyone who wants it, but not in
          # README - README.md's Coverage and Profiling section says why not.
          # Grey and labelled "load-time", never green and
          # never "coverage": tests/coverage.sh's header explains at length that
          # kcov loses its DEBUG trap once the harness is sourced, so this
          # figure is the share of lines that ran while things were loading and
          # understates real coverage by a wide, uneven margin
          # (common/git_prompt.sh reads 2.56% with seventeen cases passing
          # against it). A green "coverage: 60%" here would be a false claim on
          # the front page, so the badge is written to be unmistakable instead.
          # No warning on the empty branch: no coverage run yet is the normal
          # state for a dispatch-only workflow, not something to flag.
          pct=""
          [ -f "$COVPCT" ] && read -r pct <"$COVPCT" || true
          if [ -n "$pct" ]; then
            badge coverage.json kcov inactive "$pct% load-time"
            echo "kcov badge: $pct% load-time"
          else
            badge coverage.json kcov inactive "not measured"
            echo "kcov badge: no figure published yet"
          fi

          # The bashcov endpoint. Same deal as the kcov one above - published,
          # not in README. Grey and labelled "heredoc-inflated" for the
          # mirror-image reason kcov's says "load-time": bashcov reads xtrace
          # rather than a DEBUG trap, so it does not lose the suites (
          # common/git_prompt.sh reads 92.68% here against kcov's 2.56%), but it
          # counts every line of a heredoc *body* as covered - and hi.sh, which
          # generates the whole remote script that way, reports 100% for two
          # connect functions --group fast never calls. An over-count where
          # kcov's is an under-count, so it gets the same unmistakable
          # treatment rather than a green percentage.
          # No warning on the empty branch: no run yet is the normal state for a
          # dispatch-only workflow, not something to flag.
          pct2=""
          [ -f "$COVPCT2" ] && read -r pct2 <"$COVPCT2" || true
          if [ -n "$pct2" ]; then
            badge coverage-v2.json bashcov inactive "$pct2% heredoc-inflated"
            echo "bashcov badge: $pct2% heredoc-inflated"
          else
            badge coverage-v2.json bashcov inactive "not measured"
            echo "bashcov badge: no figure published yet"
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # split from the build so the write scopes live on the one job that needs
  # them, and the build stays read-only like every other job here
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
