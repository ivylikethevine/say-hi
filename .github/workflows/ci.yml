name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so the parts of e2e that track upstream are re-tested without a
  # push: the three deliberately unpinned `curl | sh` framework installers
  # (tests/dockerfiles/frameworks/{atuin,mise,starship}.sh) and the kind and
  # nomad binaries e2e-backends installs. Dependabot's digest bumps exercise
  # the same jobs, but only when a base image moved. Wednesday, after the
  # Monday dependabot/tool-versions and Tuesday codeql/scorecard crons, so a
  # red run here follows a fresh dependency sweep rather than preceding one.
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

# superseded PR pushes cancel their in-flight run; main never cancels
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # One place decides which runner the rest of *this file* gets, instead of the
  # same expression copy-pasted into every job here. It is not repo-wide:
  # codeql, scorecard, coverage, image-scan, link-check, tool-versions, pages
  # and release.yml each still derive `vars.RUNNER_LABEL || 'ubuntu-latest'` on
  # their own, because none of them needs the fork guard below.
  #
  # A pull request from a fork is code nobody has read yet and vars.RUNNER_LABEL
  # is somebody's actual machine, so that case gets the hosted runner whatever
  # the variable says - a structural stop, not a reviewer remembering. See
  # docs/PACKAGING.md for the variable.
  runner:
    name: pick the runner
    runs-on: ubuntu-latest # never vars.RUNNER_LABEL: this job is the guard
    timeout-minutes: 2
    outputs:
      ubuntu: ${{ steps.pick.outputs.ubuntu }}
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      # through env: rather than ${{ }} inline in run: - zizmor gates this repo
      # and a template expanded straight into a shell line is what it catches
      - id: pick
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          UBUNTU: ${{ vars.RUNNER_LABEL }}
          MACOS: ${{ vars.MACOS_RUNNER_LABEL }}
        run: |
          set -euo pipefail
          if [ "$FORK" = true ]; then
            echo "ubuntu=ubuntu-latest" >>"$GITHUB_OUTPUT"
            echo "macos=macos-latest" >>"$GITHUB_OUTPUT"
            echo "::notice title=runner::fork PR - GitHub-hosted only, ignoring RUNNER_LABEL"
          else
            echo "ubuntu=${UBUNTU:-ubuntu-latest}" >>"$GITHUB_OUTPUT"
            echo "macos=${MACOS:-macos-latest}" >>"$GITHUB_OUTPUT"
          fi

  test:
    name: fast suites (ubuntu-latest)
    runs-on: ${{ needs.runner.outputs.ubuntu }}
    needs: runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - uses: ./.github/actions/setup-tool
        with:
          tool: shellcheck

      # the lint suite's shfmt/checkbashisms halves skip yellow when the tools
      # are absent - these pinned installs are what make them enforce here
      - uses: ./.github/actions/setup-tool
        with:
          tool: shfmt

      - uses: ./.github/actions/setup-tool
        with:
          tool: checkbashisms

      - uses: ./.github/actions/setup-tool
        with:
          tool: mandoc

      - uses: ./.github/actions/setup-tool
        with:
          tool: typos

      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --host-report --group fast --totals-file ${{ runner.temp }}/totals"

      # The lint group, once, here: linting text does not depend on the
      # userland underneath it, so the macOS, Windows and FreeBSD jobs run
      # `--group fast` alone and this step - against the pinned tools above -
      # is where the gate is enforced.
      - name: Run the lint group
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --group lint --require-run"

      # The tests badge's number, published rather than committed: pages.yml
      # picks this artifact up and writes it into the site as a shields
      # endpoint, so the figure stays generated without a bot commit landing on
      # main ahead of the author's. Generated rather than gated because a
      # hand-maintained number goes stale, and failing the run over it told
      # contributors their change was wrong when the only wrong thing was a
      # README line. The ubuntu count on purpose: macOS legitimately skips a
      # handful of cases and lints fewer files, so there is no single figure
      # both jobs could carry.
      #
      # 14 days rather than 1: Pages normally consumes this minutes later, but
      # a workflow_dispatch of pages.yml has to still find a run's totals.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-totals
          path: ${{ runner.temp }}/totals
          retention-days: 14

  # The same suites on macOS: /bin/bash 3.2, BSD userland. The %e/width/sort
  # fixes in common/ came out of this job, so it gates for real now. The lint
  # group is not run here: it is the ubuntu job's separate step, against
  # pinned tools, on a runner billed at a tenth of this one's rate.
  test-macos:
    name: fast suites (macos-latest)
    runs-on: ${{ needs.runner.outputs.macos }}
    needs: runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish
        run: brew install fish

      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --host-report --group fast"

  # bad `needs`, invalid contexts, shellcheck over every run: block - the
  # workflows and composite actions are code too, so they get a linter
  actionlint:
    name: actionlint
    # Pinned hosted, not needs.runner: this job installs no apt packages and
    # never touches the Docker socket, so it has nothing to gain from a
    # self-hosted box - and staying off it keeps one less thing contending
    # for that runner's workspace. See docs/PACKAGING.md for the list that
    # does need it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint shells out to shellcheck for run: blocks when it is on
      # PATH - pin it so both jobs lint shell with the same version
      - uses: ./.github/actions/setup-tool
        with:
          tool: shellcheck

      - uses: ./.github/actions/setup-tool
        with:
          tool: actionlint

      - name: Lint the workflows
        run: actionlint -color

  # GitHub Actions security audit. Promoted to CI once the SHA pinning made it
  # quiet, per the roadmap's condition; the one deliberate exception (the
  # credentialed release checkout) is suppressed inline where it happens.
  zizmor:
    name: zizmor
    # Pinned hosted, not needs.runner: this job installs no apt packages and
    # never touches the Docker socket, so it has nothing to gain from a
    # self-hosted box - and staying off it keeps one less thing contending
    # for that runner's workspace. See docs/PACKAGING.md for the list that
    # does need it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tool
        with:
          tool: zizmor

      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/

  # Advisory, not a gate. A heading level or a stray hard tab in a doc is worth
  # seeing and has never shipped a bug, so this job reports and does not block:
  # the lint step keeps its exit code (`continue-on-error` on the *step*, so the
  # findings still annotate the diff), and the job then restates them as a
  # warning in the run summary. Note the difference from `continue-on-error` on
  # the job, which would paint the job green and hide the result entirely.
  #
  # The corollary, now that branch protection is on (see docs/ROADMAP.md): its
  # required checks are still unset, and this job must stay off that list when
  # they go on - it is designed to be ignorable.
  markdownlint:
    name: markdownlint (advisory)
    # Pinned hosted, not needs.runner: this job installs no apt packages and
    # never touches the Docker socket, so it has nothing to gain from a
    # self-hosted box - and staying off it keeps one less thing contending
    # for that runner's workspace. See docs/PACKAGING.md for the list that
    # does need it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lint
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          # .claude/ is an agent scratch directory - plans and notes an
          # assistant writes while working here. It is gitignored, so CI never
          # sees it and this negation changes nothing about a run; it is here so
          # the command the summary below tells you to run locally reports the
          # same findings CI did, instead of thirty from files that are not the
          # project's.
          globs: |
            **/*.md
            !.claude/**
          config: ".markdownlint.yaml"

      - name: Say so, without failing
        if: steps.lint.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning title=markdownlint::Markdown lint findings above - advisory, not blocking"
          {
            echo "### markdownlint found something"
            echo
            echo "Advisory only: this job never blocks a merge. See the step above for the findings,"
            echo "or run \`markdownlint-cli2 '**/*.md' '!.claude/**'\` locally."
          } >>"$GITHUB_STEP_SUMMARY"

  # The fixture Dockerfiles, which nothing linted before. Advisory for
  # the same reason markdownlint is: what is left after .hadolint.yaml's ignores
  # is DL3009 and DL3015 - apt lists and --no-install-recommends, both image
  # size on a fixture built once and thrown away. Worth seeing, never worth
  # reddening somebody's PR over.
  #
  # The one finding worth a hard failure is fixed in the fixtures rather than
  # ignored here: DL4006, a framework fixture piping curl into sh with no
  # pipefail, where a 404 builds a green image with the framework missing.
  hadolint:
    name: hadolint (advisory)
    # Pinned hosted, not needs.runner: this job installs no apt packages and
    # never touches the Docker socket, so it has nothing to gain from a
    # self-hosted box - and staying off it keeps one less thing contending
    # for that runner's workspace. See docs/PACKAGING.md for the list that
    # does need it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tool
        with:
          tool: hadolint

      # `|| true` on the loop and the verdict re-read afterwards, rather than
      # continue-on-error: hadolint exits non-zero per file, and this has to
      # lint every one before deciding, not stop at the first.
      - id: lint
        name: Lint the fixture Dockerfiles
        run: |
          set -uo pipefail
          : >"$RUNNER_TEMP/hadolint.out"
          for f in tests/dockerfiles/*.Dockerfile; do
            hadolint --no-color --config .hadolint.yaml "$f" >>"$RUNNER_TEMP/hadolint.out" 2>&1 || true
          done
          if [ -s "$RUNNER_TEMP/hadolint.out" ]; then
            cat "$RUNNER_TEMP/hadolint.out"
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            set -- tests/dockerfiles/*.Dockerfile
            echo "hadolint: clean across $# Dockerfiles"
            echo "found=0" >>"$GITHUB_OUTPUT"
          fi

      - name: Say so, without failing
        if: steps.lint.outputs.found == '1'
        run: |
          set -euo pipefail
          echo "::warning title=hadolint::Dockerfile lint findings above - advisory, not blocking"
          {
            echo "### hadolint found something"
            echo
            echo "Advisory only: this job never blocks a merge. \`.hadolint.yaml\` carries a"
            echo "reason per silenced rule; anything reaching here is deliberately left visible."
            echo
            echo '```'
            sed -n '1,80p' "$RUNNER_TEMP/hadolint.out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # docs/demos/demo.gif is the one hand-rendered GIF, and .githooks/
  # demo_staleness.sh is what says when the tape, the fixtures or the shipped
  # tree moved after it was last rendered. As a git hook it only speaks on a
  # machine that opted in (`git config core.hooksPath .githooks`); here it
  # speaks on every pull request. Advisory on markdownlint's precedent and for
  # the same reason the hook never blocks a commit: a GIF is re-rendered and
  # looked at by a person, and a red check would be making that call for them.
  #
  # Pull requests only - on a push to main there is nobody left to warn - and
  # fetch-depth 0, because the script compares last-commit dates with `git
  # log` and a shallow clone answers that with the clone's own date for every
  # path. The script always exits 0, so its verdict is read out of its output.
  demo-staleness:
    name: demo.gif staleness (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        name: Compare demo.gif against what it renders
        run: |
          set -euo pipefail
          .githooks/demo_staleness.sh | tee "$RUNNER_TEMP/staleness.out"
          if grep -q 'may be out of date' "$RUNNER_TEMP/staleness.out"; then
            echo "stale=1" >>"$GITHUB_OUTPUT"
          else
            echo "demo.gif is newer than everything it renders"
            echo "stale=0" >>"$GITHUB_OUTPUT"
          fi

      - name: Say so, without failing
        if: steps.check.outputs.stale == '1'
        run: |
          set -euo pipefail
          echo "::warning title=demo.gif::docs/demos/demo.gif is older than something it renders - advisory, not blocking"
          {
            echo "### demo.gif may be out of date"
            echo
            echo "Advisory only: this job never blocks a merge. Re-render with"
            echo "\`docs/tapes/generate.sh demo\` (needs docker), look at the result, and commit it"
            echo "in its own commit - see docs/PACKAGING.md, _Regenerating the demo GIFs_."
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/staleness.out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # Hot-path timings against generous ceilings - catches an order-of-magnitude
  # regression (a fork in a loop, a probe losing its timeout), and prints the
  # numbers into every run's log for eyeballing trends.
  # bench, packaging-smoke, e2e and e2e-backends all land on one machine when
  # vars.RUNNER_LABEL is set, and must not run concurrent checkouts against its
  # shared workspace. That used to be a `needs:` chain, which bought the
  # serialization at two costs: on GitHub-hosted runs (every fork PR, and any
  # repo with no RUNNER_LABEL) four jobs that could have gone in parallel ran
  # strictly one after another, and the chain still did not solve the stated
  # problem - `concurrency` at the top of this file is keyed on github.ref, so
  # two *different* PRs put jobs on the same box at the same time anyway.
  #
  # Job-level concurrency instead: self-hosted runs share one group and queue,
  # across runs as well as within them, while hosted runs get a group per job
  # per run and full parallelism. Only the real data dependencies stay in
  # `needs:` - e2e and e2e-backends gate on `test` passing. `test-macos` was
  # never in the chain: it reads MACOS_RUNNER_LABEL, so it is never that box.
  bench:
    name: hot-path benchmarks
    runs-on: ${{ needs.runner.outputs.ubuntu }}
    needs: runner
    # one group for the shared self-hosted workspace, one per job per run
    # otherwise - see the note above bench
    concurrency:
      group: ${{ needs.runner.outputs.ubuntu == 'ubuntu-latest' && format('{0}-{1}', github.run_id, github.job) || 'hi-selfhosted-workspace' }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Run benchmarks
        run: "${{ github.workspace }}/tests/test_runner.sh --host-report --group bench"

  # catches nfpm.yaml/install_tree breakage on the PR that causes it, not at
  # the next release tag
  packaging-smoke:
    name: package build (deb, rpm, apk)
    runs-on: ${{ needs.runner.outputs.ubuntu }}
    needs: runner
    # one group for the shared self-hosted workspace, one per job per run
    # otherwise - see the note above bench
    concurrency:
      group: ${{ needs.runner.outputs.ubuntu == 'ubuntu-latest' && format('{0}-{1}', github.run_id, github.job) || 'hi-selfhosted-workspace' }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tool
        with:
          tool: nfpm

      # a throwaway key so the smoke covers the signed shape end to end - the
      # real key is the APK_SIGNING_KEY secret, release.yml's business only
      - name: Generate a throwaway apk signing key
        run: |
          set -euo pipefail
          openssl genrsa -out "$RUNNER_TEMP/smoke.rsa" 4096
          openssl rsa -in "$RUNNER_TEMP/smoke.rsa" -pubout -out "$RUNNER_TEMP/smoke.rsa.pub"
          echo "HI_APK_KEY=$RUNNER_TEMP/smoke.rsa" >>"$GITHUB_ENV"

      # mkpkg.sh itself asserts one artifact per format and writes SHA256SUMS
      - name: Build the packages
        run: packaging/mkpkg.sh

      # the check that catches "apk-tools rejects what nfpm built" (it happened:
      # nfpm 2.47.0's tree entries) and proves the signature chain: the pubkey
      # lands in /etc/apk/keys under the name nfpm.yaml stamps into the
      # signature, and apk add must accept the package with NO --allow-untrusted
      - name: Install the signed apk on Alpine
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" \
            -v "$RUNNER_TEMP/smoke.rsa.pub:/etc/apk/keys/say-hi.rsa.pub:ro" \
            alpine:3.24 sh -c 'apk add /dist/say-hi_*_noarch.apk && sh -lc "hi --version" && ls /usr/share/say-hi/common/core.sh'

      # the reproducibility contract: the same commit builds byte-identical
      # deb/rpm/apk (SOURCE_DATE_EPOCH from HEAD plus clamped staging mtimes),
      # so SHA256SUMS means the artifact, not the build that happened to make
      # it. nfpm.yaml hardcodes ./dist/staging, so the runs are sequential
      # with the first moved aside rather than parallel via --outdir.
      - name: Build again and require byte-identical packages
        run: |
          mv dist dist.first
          packaging/mkpkg.sh
          diff dist.first/SHA256SUMS dist/SHA256SUMS

      # README's package badge, the same way the tests badge works: this job is
      # the only place the real numbers exist, so it writes them down and
      # pages.yml publishes them as a shields endpoint. Measured after the
      # second build, which is the one dist/ holds.
      #
      # Two numbers, because "how big is it" has two honest answers and the
      # payload badge already answers a third. The deb is what you download; the
      # staging tree is what lands on disk, and is the larger figure - packages
      # compress, installed files do not.
      - name: Measure what the packages actually cost
        run: |
          set -euo pipefail
          deb="$(stat -c%s dist/say-hi_*_all.deb)"
          installed="$(du -sb dist/staging | cut -f1)"
          printf '%s %s\n' "$deb" "$installed" >"${{ runner.temp }}/sizes"
          {
            echo "### Package size"
            echo
            echo "| | bytes | rounded |"
            echo "|---|---|---|"
            echo "| deb (downloaded) | $deb | $(((deb + 512) / 1024)) KB |"
            echo "| installed on disk | $installed | $(((installed + 512) / 1024)) KB |"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-sizes
          path: ${{ runner.temp }}/sizes
          retention-days: 14

  e2e:
    name: e2e (ssh, docker)
    runs-on: ${{ needs.runner.outputs.ubuntu }}
    needs: [runner, test]
    # one group for the shared self-hosted workspace, one per job per run
    # otherwise - see the note above bench
    concurrency:
      group: ${{ needs.runner.outputs.ubuntu == 'ubuntu-latest' && format('{0}-{1}', github.run_id, github.job) || 'hi-selfhosted-workspace' }}
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install_methods_test.sh installs a real .deb/.rpm/.apk on its targets,
      # and builds them with the same mkpkg.sh the release runs. Without nfpm
      # those three cases stand down yellow per case - caught by --require-run
      # like any other stand-down, but the pin is still what makes them
      # actually run here rather than fail the gate by standing down.
      - uses: ./.github/actions/setup-tool
        with:
          tool: nfpm

      # --require-run: here a skip is a broken runner, not an optional backend
      - name: Run end-to-end suites
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --host-report --require-run --group e2e"

  e2e-backends:
    name: e2e (podman, nomad, kube)
    runs-on: ${{ needs.runner.outputs.ubuntu }}
    needs: [runner, test]
    # one group for the shared self-hosted workspace, one per job per run
    # otherwise - see the note above bench
    concurrency:
      group: ${{ needs.runner.outputs.ubuntu == 'ubuntu-latest' && format('{0}-{1}', github.run_id, github.job) || 'hi-selfhosted-workspace' }}
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install podman and nomad
        run: |
          set -euo pipefail
          # gpg unprivileged, `sudo` only for the write. `sudo gpg` runs with
          # root's HOME, creates /root/.gnupg on the way past, and then wants a
          # controlling terminal to say so - which an Actions step does not
          # have: "gpg: cannot open '/dev/tty'". --batch --yes says there is
          # nobody to ask, and the keyring lands through tee, the way the repo
          # list on the next line already does.
          curl -sSfL https://apt.releases.hashicorp.com/gpg |
            gpg --batch --yes --dearmor |
            sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y podman nomad
          nomad version

      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Run backend end-to-end suites
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --host-report --require-run --group backends"

  # The two platform e2e workflows, promoted out of dispatch-only. `push` only:
  # both stand up an sshd and authorize a throwaway key, which is not something
  # to hand a fork's pull request, and the runner job's fork guard covers only
  # the jobs that name it. Gated on both fast-suite jobs so a red unit test
  # doesn't cost a 15-minute macOS runner.
  e2e-macos:
    name: e2e (macOS)
    needs: [test, test-macos]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test.result == 'success' && needs.test-macos.result == 'success' }}
    uses: ./.github/workflows/macos-e2e.yml

  e2e-windows:
    name: e2e (Windows)
    needs: [test, test-macos]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test.result == 'success' && needs.test-macos.result == 'success' }}
    uses: ./.github/workflows/windows-e2e.yml

  # The non-macOS BSD, on the same gate: a FreeBSD VM on a hosted runner runs
  # the fast suites and ssh's to itself.
  e2e-freebsd:
    name: e2e (FreeBSD)
    needs: [test, test-macos]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test.result == 'success' && needs.test-macos.result == 'success' }}
    uses: ./.github/workflows/freebsd-e2e.yml

  # The client-side half of the Windows story, on the same gate. Advisory
  # until it has been green once (docs/ROADMAP.md): windows-client.yml itself
  # carries the continue-on-error, so a red suite there is a warning in this
  # run, not a red check on the push. Must stay off the required-checks list
  # until that comes out.
  e2e-windows-client:
    name: fast suites (Windows client)
    needs: [test, test-macos]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test.result == 'success' && needs.test-macos.result == 'success' }}
    uses: ./.github/workflows/windows-client.yml
