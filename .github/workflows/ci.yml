name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly re-test of what e2e-backends installs unpinned: nomad from
  # HashiCorp's apt repo, kind via helm/kind-action's install_only (only the
  # action's SHA is pinned). The framework installers under
  # tests/dockerfiles/frameworks/ are pinned per release and bumped by hand,
  # not by this schedule; dependabot's digest bumps run the same jobs only when
  # a base image moved. Wednesday, after the Monday dependabot/tool-versions
  # and Tuesday codeql/scorecard crons, so a red run follows a fresh sweep.
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

# superseded PR pushes cancel their in-flight run; main never cancels
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Whether anything besides workflow YAML changed: test, test-macos, bench,
  # packaging-smoke, e2e and e2e-backends skip on a workflow-only or docs-only
  # diff. workflow-lint and advisory-lint are exempt - a workflow-only change
  # is what workflow-lint audits and a docs-only one is when advisory-lint
  # should run. Fork-PR-safe mechanics are in changes.yml. Only push and
  # pull_request are filtered; on schedule or workflow_dispatch this job does
  # not run and the jobs below treat the skip as "assume yes" - a diff against
  # the wrong commit must never be why a real check goes quiet.
  changes:
    name: detect changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # changes.yml asks for `pull-requests: read` (dorny/paths-filter lists a
    # PR's files via the API); a reusable workflow cannot request a scope its
    # caller does not hold, so it has to be granted here.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml
    with:
      filters: |
        code:
          - '**'
          - '!.github/workflows/**'

  test:
    name: fast suites (ubuntu-latest)
    needs: changes
    if: needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - uses: ./.github/actions/setup-tool
        with:
          tool: shellcheck

      # the lint suite's shfmt/checkbashisms halves skip yellow when the tools
      # are absent - these pinned installs are what make them enforce here
      - uses: ./.github/actions/setup-tool
        with:
          tool: shfmt

      - uses: ./.github/actions/setup-tool
        with:
          tool: checkbashisms

      - uses: ./.github/actions/setup-tool
        with:
          tool: mandoc

      - uses: ./.github/actions/setup-tool
        with:
          tool: typos

      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --host-report --group fast --totals-file ${{ runner.temp }}/totals"

      # The lint group runs once, here: text linting does not depend on the
      # userland, so the macOS, Windows and FreeBSD jobs run `--group fast`
      # alone and this step, against the pinned tools above, is the gate.
      - name: Run the lint group
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --group lint --require-run"

      # The tests badge's number: pages.yml reads this artifact and publishes it
      # as a shields endpoint, so the figure stays generated with no bot commit
      # on main and never fails a run over a stale README line. The ubuntu
      # count on purpose: macOS skips a handful of cases and lints fewer files.
      # 14 days, not 1: a workflow_dispatch of pages.yml must still find totals.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-totals
          path: ${{ runner.temp }}/totals
          retention-days: 14

  # The same suites on macOS: /bin/bash 3.2, BSD userland - a real gate (the
  # %e/width/sort fixes in common/ came out of it). No lint group here: that is
  # the ubuntu job's step, against pinned tools, on a runner a tenth the price.
  test-macos:
    name: fast suites (macos-latest)
    needs: changes
    if: needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish
        run: brew install fish

      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --host-report --group fast"

  # actionlint (bad `needs`, invalid contexts, shellcheck over every run:) and
  # zizmor (the Actions security audit; its one deliberate exception, the
  # credentialed release checkout, is suppressed inline). One job, two steps
  # each with continue-on-error so a finding in one does not stop the other
  # from reporting; the trailing step fails the job if either did.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint shells out to shellcheck for run: blocks when it is on
      # PATH - pin it so both tools lint shell with the same version
      - uses: ./.github/actions/setup-tool
        with:
          tool: shellcheck

      - uses: ./.github/actions/setup-tool
        with:
          tool: actionlint

      - id: actionlint
        name: Lint the workflows
        continue-on-error: true
        run: actionlint -color

      - uses: ./.github/actions/setup-tool
        with:
          tool: zizmor

      - id: zizmor
        name: Audit the workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/

      - name: Fail if either found something
        if: steps.actionlint.outcome == 'failure' || steps.zizmor.outcome == 'failure'
        run: exit 1

  # Advisory, not a gate: a heading level, a dockerfile nit or a stale GIF has
  # never shipped a bug. Each lint step keeps its exit code (`continue-on-error`
  # on the *step*, or an output read afterwards, so findings still annotate the
  # diff) and ./.github/actions/advisory-note restates it as a warning in the
  # run summary; `continue-on-error` on the *job* would paint it green and hide
  # the result. Keep this job off branch protection's required checks when
  # they are set (docs/CONTRIBUTING.md) - it is designed to be ignorable.
  # fetch-depth 0 is for the demo-staleness step alone: it compares commit
  # dates with `git log`, and a shallow clone answers with the clone's own date
  # for every path; markdownlint and hadolint share the checkout and its cost.
  advisory-lint:
    name: advisory lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: markdownlint
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          # .claude/ is gitignored agent scratch, so this negation changes
          # nothing in CI; it keeps the local command in the summary below
          # reporting the same findings CI did.
          globs: |
            **/*.md
            !.claude/**
          config: ".markdownlint.yaml"

      - uses: ./.github/actions/advisory-note
        if: steps.markdownlint.outcome == 'failure'
        with:
          title: markdownlint
          warning-body: Markdown lint findings above - advisory, not blocking
          heading: markdownlint found something
          body: |
            Advisory only: this job never blocks a merge. See the step above for the findings,
            or run `markdownlint-cli2 '**/*.md' '!.claude/**'` locally.

      # Advisory like markdownlint: what .hadolint.yaml leaves is DL3009 and
      # DL3015 (apt lists, --no-install-recommends), image size on a throwaway
      # fixture. DL4006 - curl piped into sh with no pipefail, where a 404
      # builds a green image with the framework missing - is fixed in the
      # fixtures rather than ignored here.
      - uses: ./.github/actions/setup-tool
        with:
          tool: hadolint

      # `|| true` and a verdict read afterwards rather than continue-on-error:
      # hadolint exits non-zero per file and every one must be linted first.
      - id: hadolint
        name: Lint the fixture Dockerfiles
        run: |
          set -uo pipefail
          : >"$RUNNER_TEMP/hadolint.out"
          for f in tests/dockerfiles/*.Dockerfile; do
            hadolint --no-color --config .hadolint.yaml "$f" >>"$RUNNER_TEMP/hadolint.out" 2>&1 || true
          done
          if [ -s "$RUNNER_TEMP/hadolint.out" ]; then
            cat "$RUNNER_TEMP/hadolint.out"
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            set -- tests/dockerfiles/*.Dockerfile
            echo "hadolint: clean across $# Dockerfiles"
            echo "found=0" >>"$GITHUB_OUTPUT"
          fi

      - name: Truncate the findings before they go in the summary
        if: steps.hadolint.outputs.found == '1'
        run: sed -n '1,80p' "$RUNNER_TEMP/hadolint.out" >"$RUNNER_TEMP/hadolint.truncated"

      - uses: ./.github/actions/advisory-note
        if: steps.hadolint.outputs.found == '1'
        with:
          title: hadolint
          warning-body: Dockerfile lint findings above - advisory, not blocking
          heading: hadolint found something
          body: |
            Advisory only: this job never blocks a merge. `.hadolint.yaml` carries a
            reason per silenced rule; anything reaching here is deliberately left visible.
          report-file: ${{ runner.temp }}/hadolint.truncated

      # .github/hooks/demo_staleness.sh says when the tape, fixtures or shipped tree
      # moved after docs/tapes/demo.gif (hand-rendered) was last rendered. As a
      # hook it only speaks where `git config core.hooksPath .github/hooks` is set;
      # here it speaks on every pull request - not on a push to main, where
      # there is nobody left to warn. It always exits 0, so the verdict is read
      # out of its output.
      - id: demo-staleness
        name: Compare demo.gif against what it renders
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          .github/hooks/demo_staleness.sh | tee "$RUNNER_TEMP/staleness.out"
          if grep -q 'may be out of date' "$RUNNER_TEMP/staleness.out"; then
            echo "stale=1" >>"$GITHUB_OUTPUT"
          else
            echo "demo.gif is newer than everything it renders"
            echo "stale=0" >>"$GITHUB_OUTPUT"
          fi

      - name: Strip ANSI before it goes in the summary
        if: steps.demo-staleness.outputs.stale == '1'
        run: sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/staleness.out" >"$RUNNER_TEMP/staleness.plain"

      - uses: ./.github/actions/advisory-note
        if: steps.demo-staleness.outputs.stale == '1'
        with:
          title: demo.gif
          warning-body: docs/tapes/demo.gif is older than something it renders - advisory, not blocking
          heading: demo.gif may be out of date
          body: |
            Advisory only: this job never blocks a merge. Re-render with
            `docs/tapes/generate.sh demo` (needs docker), look at the result, and commit it
            in its own commit - see docs/PACKAGING.md, _Regenerating the demo GIFs_.
          report-file: ${{ runner.temp }}/staleness.plain

  # Hot-path timings against generous ceilings: catches an order-of-magnitude
  # regression (a fork in a loop, a probe losing its timeout) and logs the
  # numbers for eyeballing trends.
  bench:
    name: hot-path benchmarks
    needs: changes
    if: needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Run benchmarks
        run: "${{ github.workspace }}/tests/test_runner.sh --host-report --group bench"

  # catches nfpm.yaml/install_tree breakage on the PR that causes it, not at
  # the next release tag
  packaging-smoke:
    name: package build (deb, rpm, apk)
    needs: changes
    if: needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tool
        with:
          tool: nfpm

      # a throwaway key so the smoke covers the signed shape end to end - the
      # real key is the APK_SIGNING_KEY secret, release.yml's business only
      - name: Generate a throwaway apk signing key
        run: |
          set -euo pipefail
          openssl genrsa -out "$RUNNER_TEMP/smoke.rsa" 4096
          openssl rsa -in "$RUNNER_TEMP/smoke.rsa" -pubout -out "$RUNNER_TEMP/smoke.rsa.pub"
          echo "HI_APK_KEY=$RUNNER_TEMP/smoke.rsa" >>"$GITHUB_ENV"

      # mkpkg.sh itself asserts one artifact per format and writes SHA256SUMS
      - name: Build the packages
        run: packaging/mkpkg.sh

      # Catches "apk-tools rejects what nfpm built" (nfpm 2.47.0's tree entries
      # did) and proves the signature chain: the pubkey lands in /etc/apk/keys
      # under the name nfpm.yaml stamps into the signature, and apk add must
      # accept the package with NO --allow-untrusted.
      - name: Install the signed apk on Alpine
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" \
            -v "$RUNNER_TEMP/smoke.rsa.pub:/etc/apk/keys/say-hi.rsa.pub:ro" \
            alpine:3.24 sh -c 'apk add /dist/say-hi_*_noarch.apk && sh -lc "hi --version" && ls /usr/share/say-hi/common/core.sh'

      # The reproducibility contract: the same commit builds byte-identical
      # deb/rpm/apk (SOURCE_DATE_EPOCH from HEAD plus clamped staging mtimes).
      # nfpm.yaml hardcodes ./dist/staging, so the builds are sequential with
      # the first moved aside rather than parallel via --outdir.
      - name: Build again and require byte-identical packages
        run: |
          mv dist dist.first
          packaging/mkpkg.sh
          diff dist.first/SHA256SUMS dist/SHA256SUMS

      # README's package badge, published by pages.yml as a shields endpoint
      # like the tests badge; measured after the second build, the one dist/
      # holds. Two numbers: the deb is the download, the staging tree is what
      # lands on disk (packages compress, installed files do not).
      - name: Measure what the packages actually cost
        run: |
          set -euo pipefail
          deb="$(stat -c%s dist/say-hi_*_all.deb)"
          installed="$(du -sb dist/staging | cut -f1)"
          printf '%s %s\n' "$deb" "$installed" >"${{ runner.temp }}/sizes"
          {
            echo "### Package size"
            echo
            echo "| | bytes | rounded |"
            echo "|---|---|---|"
            echo "| deb (downloaded) | $deb | $(((deb + 512) / 1024)) KB |"
            echo "| installed on disk | $installed | $(((installed + 512) / 1024)) KB |"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-sizes
          path: ${{ runner.temp }}/sizes
          retention-days: 14

      # The repository the release publishes, from a third build signed with a
      # throwaway GPG key (the rpm signature carries its signing time, which is
      # why the byte-identical check above stays on unsigned builds): every
      # index mkrepo.sh writes, on the runner's own docker, on the PR that
      # breaks it. Installing from the result is tests/packaging/repo_test.sh's
      # job, in the e2e group.
      - name: Build the package repository
        run: |
          set -euo pipefail
          gnupg="$RUNNER_TEMP/gnupg"
          mkdir -p "$gnupg"
          chmod 700 "$gnupg"
          GNUPGHOME="$gnupg" gpg --batch --quiet --passphrase '' \
            --quick-generate-key 'say-hi smoke <smoke@example.invalid>' rsa4096 sign never
          GNUPGHOME="$gnupg" gpg --batch --quiet --armor --export-secret-keys >"$RUNNER_TEMP/smoke.gpg.key"
          mv dist dist.unsigned
          HI_GPG_KEY="$RUNNER_TEMP/smoke.gpg.key" packaging/mkpkg.sh
          packaging/mkrepo.sh --gpg-key "$RUNNER_TEMP/smoke.gpg.key" --apk-key "$RUNNER_TEMP/smoke.rsa" \
            --tarball "$RUNNER_TEMP/package-repo.tar.gz"
          echo "package-repo.tar.gz: $(tar -tzf "$RUNNER_TEMP/package-repo.tar.gz" | grep -c '[^/]$') files"

  # Beside the fast suites, not after them: this and e2e-backends each take
  # about three minutes, so waiting on `test` to spare a runner on a red unit
  # test cost every green PR three minutes of wall clock - half its run. A red
  # unit test and a red e2e now show up together.
  e2e:
    name: e2e (ssh, docker)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install_methods_test.sh builds real .deb/.rpm/.apk with mkpkg.sh and
      # installs them on its targets; without nfpm those cases stand down and
      # --require-run fails the gate, so the pin is what makes them run.
      - uses: ./.github/actions/setup-tool
        with:
          tool: nfpm

      # --require-run: here a skip is a broken runner, not an optional backend
      - name: Run end-to-end suites
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --host-report --require-run --group e2e"

  e2e-backends:
    name: e2e (podman, nomad, kube)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install podman and nomad
        run: |
          set -euo pipefail
          # gpg unprivileged, `sudo` only for the write. `sudo gpg` runs with
          # root's HOME, creates /root/.gnupg on the way past, and then wants a
          # controlling terminal to say so - which an Actions step does not
          # have: "gpg: cannot open '/dev/tty'". --batch --yes says there is
          # nobody to ask, and the keyring lands through tee, the way the repo
          # list on the next line already does.
          curl -sSfL https://apt.releases.hashicorp.com/gpg |
            gpg --batch --yes --dearmor |
            sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y podman nomad
          nomad version

      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Run backend end-to-end suites
        run: "${{ github.workspace }}/tests/test_runner.sh --verbose --host-report --require-run --group backends"

  # `push` only: both platform e2e workflows stand up an sshd and authorize a
  # throwaway key, not something to hand a fork's pull request, and the runner
  # job's fork guard covers only the jobs that name it. Gated on both fast-suite
  # jobs so a red unit test does not cost a 15-minute macOS runner. One gate
  # job rather than the same needs/if on all three callers below.
  e2e-gate:
    name: e2e gate
    needs: [test, test-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - id: gate
        run: |
          ok=false
          if [ "${{ github.event_name }}" = push ] && [ "${{ needs.test.result }}" = success ] && [ "${{ needs.test-macos.result }}" = success ]; then
            ok=true
          fi
          echo "ok=$ok" >>"$GITHUB_OUTPUT"

  e2e-macos:
    name: e2e (macOS)
    needs: e2e-gate
    if: needs.e2e-gate.outputs.ok == 'true'
    uses: ./.github/workflows/macos-e2e.yml

  e2e-windows:
    name: e2e (Windows)
    needs: e2e-gate
    if: needs.e2e-gate.outputs.ok == 'true'
    uses: ./.github/workflows/windows-e2e.yml

  # The non-macOS BSD, on the same gate: a FreeBSD VM on a hosted runner runs
  # the fast suites and ssh's to itself.
  e2e-freebsd:
    name: e2e (FreeBSD)
    needs: e2e-gate
    if: needs.e2e-gate.outputs.ok == 'true'
    uses: ./.github/workflows/freebsd-e2e.yml

  # The client-side half of Windows. Not behind e2e-gate: it is the fast
  # suites on another client, not an e2e that wants green targets first, and
  # at seven minutes (now two shards of half that) it was the long pole of
  # every push when it also waited for `test`. Still push-only, as the gate
  # kept it, and gated on `changes` like the other fast-suite jobs. A real
  # check, not advisory: windows-client.yml carries no continue-on-error, so
  # a red suite fails the push. Not yet on the required-checks list
  # (docs/ROADMAP.md's release-readiness entry), so it does not block a merge
  # yet.
  e2e-windows-client:
    name: fast suites (Windows client)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/windows-client.yml
