name: CI

on:
  # Nothing runs on a draft: `changes` skips and every job below skips with
  # it. ready_for_review is not in the default type set, so it is named here,
  # or a draft marked ready would never get its run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Weekly re-test of what e2e-backends installs unpinned: nomad from
  # HashiCorp's apt repo, kind via helm/kind-action's install_only (only the
  # action's SHA is pinned). The framework installers under
  # tests/dockerfiles/frameworks/ are pinned per release and bumped by hand,
  # not by this schedule; dependabot's digest bumps run the same jobs only when
  # a base image moved. Wednesday, after the Monday dependabot/tool-versions
  # and Tuesday codeql/scorecard crons, so a red run follows a fresh sweep.
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

# superseded PR pushes cancel their in-flight run; main never cancels, and
# groups per commit: a queued run in a shared group is replaced by the next
# one, and release.yml's gate needs a finished run for every pushed commit
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # `changes` runs on every event but a draft, so `needs.changes.outputs.code`
  # is one flag every code-dependent job below reads instead of repeating
  # "nothing relevant changed" itself. It defaults to 'true' - a dedup match
  # or the filter cleanly reporting no code changes are the only ways to
  # 'false'; a schedule or dispatch (the filter step's own `if` skips it) and
  # a failed lookup both leave it 'true', so change detection breaking is
  # never read as "assume nothing changed". `outputs.trusted` is the other
  # flag: a push, or a pull_request from this repository - read by
  # test-macos's loopback, e2e-gate, and e2e-windows-client. The three e2e-*
  # reusable-workflow jobs gate on `needs.e2e-gate.outputs.ok` instead, which
  # is empty when that job skips. The `!cancelled()` jobs below name the
  # draft clause themselves, since `!cancelled()` runs past a skipped need, and
  # so does dependency-review, which does not need `changes` at all.
  #
  # Whether anything besides workflow YAML or markdown changed: test-ubuntu,
  # test-arm, test-macos, test-alpine, profile, packaging-smoke, e2e, and
  # e2e-backends skip on a workflow-only or docs-only diff. workflow-lint,
  # advisory-lint, secret-scan, and dependency-review are exempt - such a
  # change is what they audit - and so are lint and bench: the lint group
  # checks the Markdown itself and bench_test.sh README.md's payload badge,
  # and both are cheap (~40s); they read `reuse-run` only, never `code`.
  #
  # A push to main whose tree a same-repo PR run already took green (a squash
  # merge of an up-to-date PR, the usual case) is the same code twice: the
  # push finds that run's ci-tree-<tree> marker, `code` reads false, and every
  # job below skips - lint, workflow-lint, advisory-lint, and bench included,
  # through `reuse-run`. carry-forward hands the PR run's results to what
  # reads main's newest run.
  changes:
    name: detect changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists a PR's files via the API
      actions: read # find_tree_run.sh reads other runs' artifacts
    outputs:
      code: ${{ steps.gate.outputs.code }}
      reuse-run: ${{ steps.reuse.outputs.run }}
      trusted: ${{ steps.trust.outputs.trusted }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it only reads a diff
          # and the API. One that turns out to need root fails here outright
          # rather than quietly doing less, which is what makes this worth
          # setting rather than inferring.
          disable-sudo: true
          # Off this job's own audit log: the checkout, the cache receiver, and
          # the API that paths-filter and find_tree_run.sh ask for a run to
          # reuse.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443

      # a PR's files come from the API and only a push diffs the tree, but
      # both need the tree-marker helpers below
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # trusted: a push, or a pull_request from this repository - read by
      # mark-tree below, test-macos's HI_LOOPBACK, e2e-gate, and
      # e2e-windows-client's `if:`. A fork PR's head repository is the fork.
      - id: trust
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -eu
          trusted=false
          if [ "$EVENT" = push ] || { [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; }; then
            trusted=true
          fi
          echo "trusted=$trusted" >>"$GITHUB_OUTPUT"

      # push/pull_request only: a schedule or dispatch run has no diff to
      # take, and `gate` below reads that as "assume yes" the same way it
      # reads this step failing outright. some-with-excludes, not `some`: a
      # bare negated pattern matches nothing on its own, and `some` would
      # count workflow files since `**` matches them
      - id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!.github/workflows/**'
              - '!**/*.md'

      # same-repo only: find_tree_run.sh's header says why
      - if: >-
          github.event_name == 'pull_request'
          && steps.trust.outputs.trusted == 'true'
        uses: $/.github/actions/mark-tree
        with:
          prefix: ci-tree

      # continue-on-error: a failed lookup is a full run, never a skipped one;
      # the two artifacts are what carry-forward copies, so a run without
      # them (a docs-only PR skipped both jobs) is no match
      - id: reuse
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: .github/scripts/find_tree_run.sh ci.yml "ci-tree-$TREE" tests package-install-sizes | tee -a "$GITHUB_OUTPUT"

      # `code`'s one computation, `always()` so a failed filter or reuse step
      # still reaches it - false only where something affirmatively says so
      - id: gate
        if: always()
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          REUSE_RUN: ${{ steps.reuse.outputs.run }}
        run: |
          set -eu
          code=true
          [ "$FILTER_OUTCOME" != success ] || [ "$FILTER_CODE" = true ] || code=false
          [ -z "$REUSE_RUN" ] || code=false
          echo "code=$code" >>"$GITHUB_OUTPUT"

  # Two plain jobs, not a matrix: a matrix job's skipped entries go unnamed -
  # GitHub reports one skip against the job id, not per `matrix.os` - so a
  # draft or workflow/docs-only diff left `fast suites (ubuntu-latest)`,
  # required by branch protection, sitting at Expected forever instead of
  # showing skipped. Each of these is its own job, so a skip reports under
  # its own name like test-macos's or test-alpine's does. ubuntu-24.04-arm
  # (free on a public repo) runs the same suites on arm64, so an x86-only
  # assumption - the header's uname -m and CPU cells, a probe that only knows
  # one arch - fails here rather than on someone's Pi. A red arm64 entry
  # holds e2e-gate like a red ubuntu-latest one.
  test-ubuntu:
    name: fast suites (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Off this job's own audit log, on a run whose apt cache missed, so
          # the mirrors are named rather than hidden behind a cache hit: the
          # checkout, the cache receiver, and what `apt-get update` plus the
          # zsh/fish install reach. azure.archive.ubuntu.com is port 80, not
          # 443. dl.google.com is there because ../apt/lib.sh drops only
          # sources.list.d/*.list and the image now ships Chrome as a deb822
          # .sources, so the index is still fetched - and `apt-get update`
          # exits 100 when any index fails, which is the whole thing that
          # mitigation exists to prevent.
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            dl.google.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-shells

      # No --verbose: the runner then fans suites out to the core count
      # instead of width 1 for live streaming. A passing transcript still
      # folds into a ::group:: and a failing one replays in full with an
      # ::error annotation - only the live stream is lost.
      # fast plus ci here, and here only: ci is the suites a second platform
      # could only repeat - workflow and manifest checks, ubuntu-only tooling
      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --host-report --group fast,ci --totals-file ${{ runner.temp }}/totals"

      # The tests badge's number: pages.yml reads this artifact and publishes it
      # as a shields endpoint, so the figure stays generated with no bot commit
      # on main and never fails a run over a stale README line. This job on
      # purpose, not test-arm: macOS skips a handful of cases and lints fewer
      # files. 14 days, not 1: a workflow_dispatch of pages.yml must still
      # find totals.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests
          path: ${{ runner.temp }}/totals
          retention-days: 14

  test-arm:
    name: fast suites (ubuntu-24.04-arm)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # no harden-runner: its community tier has no arm agent (it only logs
    # that and exits), so the step would be a no-op here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-shells

      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --host-report --group fast"

  # The lint group's four suites (shellcheck, dialects, tools, drift), against
  # the pinned tools below - text linting does not depend on the userland, so
  # the macOS, Alpine, Windows, and BSD jobs run `--group fast` alone and this is
  # the one gate. Its own job, not a step of `test`: the two groups run side
  # by side, and `test` installs none of the tools only the linters call.
  # markdownlint and prettier gate through tools_test.sh, inside this job, so
  # making them blocking left the required-check names as they were.
  # Not in e2e-gate's `needs:` - a red lint has no bearing on whether an ssh
  # session works, and gating on it would only make the platform e2e jobs
  # wait on tool installs they don't use. Add `lint` to e2e-gate's `needs:`
  # to make lint block e2e.
  lint:
    name: lint suites (ubuntu-latest)
    needs: changes
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.changes.outputs.reuse-run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The longest list here, and mostly off this job's own audit log: the
          # checkout, the cache, setup-shells' apt, and an image pull. Four are
          # added for a cold run the log could not show - it hit every cache.
          # salsa.debian.org and mandoc.bsd.lv are checkbashisms' and mandoc's
          # own download hosts from setup-tool/tools.txt; registry.npmjs.org is
          # `npm ci --prefix .github`; the release hosts are the other pinned
          # tools. lychee's blocking pass is --offline, so no linked host
          # belongs here.
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            salsa.debian.org:443
            mandoc.bsd.lv:443
            registry.npmjs.org:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            dl.google.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # dialects_test.sh runs `zsh -n` / `fish --no-execute` (its floor-image
      # checks use the preinstalled docker); tools_test.sh lints the shipped
      # rcs with neovim and emacs, which the image lacks - a skip there is a
      # failure under --require-run below
      - uses: $/.github/actions/setup-shells
        with:
          extra-packages: neovim emacs-nox

      # the lint suite's shfmt/checkbashisms halves skip yellow when the tools
      # are absent - these pinned installs are what make them enforce here.
      # release.yml's build job passes the identical list, which is the cache key
      - uses: $/.github/actions/setup-tools
        with:
          tools: shellcheck shfmt checkbashisms mandoc typos lychee

      # markdownlint-cli2 needs node 22+, which the runner's default may not be;
      # the npm cache is keyed on the lockfile the step below installs from
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/package-lock.json

      # markdownlint-cli2 and prettier with their whole dependency tree, from
      # .github/package-lock.json (dependabot's npm entry moves it);
      # tools_test.sh runs them from .github/node_modules/.bin
      - name: Install the pinned Markdown tools
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      - name: Run the lint group
        run: "${{ github.workspace }}/tests/test_runner.sh --group lint --require-run"

      # Blocking, unlike link-check.yml's weekly sweep: --offline checks only
      # what this tree decides - relative paths and #fragments - so a red here
      # is this diff's broken link or anchor, never the internet's. Tracked
      # files only; .claude/ is agent config, not docs.
      - name: Check relative links and anchors in the Markdown
        run: git ls-files -z '*.md' ':!:.claude/**' | xargs -0 lychee --config lychee.toml --offline --include-fragments --no-progress

  # The same suites on macOS: /bin/bash 3.2, BSD userland - a real gate (the
  # %e/width/sort fixes in common/ came out of it). No lint group here: that is
  # its own ubuntu job, against pinned tools, on a runner a tenth the price.
  #
  # Then, for e2e-gate's audience (pushes and same-repo PRs: the steps stand
  # up an sshd and authorize a throwaway key), the BSD path end to end on this
  # runner rather than a second macOS one. It ssh's to itself, so client and
  # target are both macOS userland and Apple's /bin/bash 3.2 - run as
  # `/bin/bash ./hi.sh` on purpose, PATH's bash being Homebrew's 5.x: a
  # one-shot command, a full interactive session, and a --doctor. The job keeps
  # its name: branch protection requires it and README's macOS badge reads it.
  test-macos:
    name: fast suites (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HI_LOOPBACK: ${{ needs.changes.outputs.trusted == 'true' }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit, and it cannot be otherwise: harden-runner blocks egress on
          # Ubuntu runners only. Its macOS agent reports no endpoint or DNS
          # event at all.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-shells

      # No --verbose - see the `test` job's comment on the same flag.
      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --host-report --group fast"

      - name: Enable Remote Login and authorize a throwaway key
        if: env.HI_LOOPBACK == 'true'
        run: |
          set -euo pipefail
          ssh-keygen -t ed25519 -N '' -q -f "$HOME/.ssh/loop"
          cat "$HOME/.ssh/loop.pub" >>"$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh" && chmod 600 "$HOME/.ssh/authorized_keys"
          # a Host entry for the --doctor step, which takes no ssh options and
          # reads ~/.ssh/config as completion and the header do
          printf 'Host loop\n  HostName 127.0.0.1\n  IdentityFile %s/.ssh/loop\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n' "$HOME" >>"$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          sudo systemsetup -setremotelogin on
          for _ in $(seq 1 30); do
            ssh -i "$HOME/.ssh/loop" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=2 \
              "$USER@127.0.0.1" true && exit 0
            sleep 1
          done
          echo "sshd never answered" >&2
          exit 1

      # checked rather than assumed: an image that moved /bin/bash would
      # silently turn the steps below into a bash 5 test
      - name: The client is Apple's bash 3.2
        if: env.HI_LOOPBACK == 'true'
        run: |
          set -euo pipefail
          /bin/bash --version | head -1
          /bin/bash --version | head -1 | grep -q 'version 3\.2'

      # the pty trick the e2e suites use: `ssh -t` needs a tty on our side.
      # _HI_HOME is belt and braces (hi.sh derives its tree, GLOSSARY: HI.33),
      # kept because a wrong tree here is invisible - the first run of this
      # sourced one under /Users/runner that was never there.
      - name: Say hi to ourselves (one command, only its output back)
        if: env.HI_LOOPBACK == 'true'
        run: |
          set -euo pipefail
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          rc=0
          out="$(python3 -c 'import pty, sys; sys.exit(pty.spawn(sys.argv[1:]))' \
            /bin/bash ./hi.sh -i "$HOME/.ssh/loop" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            "$USER@127.0.0.1" 'echo HI_MAC_LOOP_OK' 2>&1)" || rc=$?
          printf '%s\n' "$out"
          # the marker says the remote command ran; it cannot say the client
          # came home clean, so the status is checked after the output is
          # printed rather than thrown away with a `|| true`
          grep -q HI_MAC_LOOP_OK <<<"$out"
          [ "$rc" -eq 0 ] || {
            echo "hi exited $rc after a successful remote command" >&2
            exit "$rc"
          }

      # A full session: the header has to say macOS, hi_info has to name the
      # session's tree, and the disconnect banner has to close it. Driven the
      # way tests/lib/process.sh's _hi_interactive_case drives one - wait for
      # a marker, type the next line - because input queued ahead of load()'s
      # "hi loaded with" banner lands on whatever reads the pty first, and
      # pty.spawn never closes the master on stdin EOF: one missed line once
      # sat out the whole job timeout with nothing in the log. The driver
      # gives up at 90s naming the marker that never came (macOS has no GNU
      # timeout). hi_root is a payload tree under $TMPDIR - nothing installs
      # say-hi on the loopback - named <user>.hi.XXXXXX.<random> (BSD mktemp
      # appends its own suffix to -t), hence the loose grep.
      - name: Say hi to ourselves (a full session)
        if: env.HI_LOOPBACK == 'true'
        run: |
          set -euo pipefail
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          rc=0
          python3 - /bin/bash ./hi.sh -i "$HOME/.ssh/loop" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            "$USER@127.0.0.1" <<'PY' 2>&1 | tee "$RUNNER_TEMP/session.log" || rc=$?
          import os, pty, select, sys, time
          argv = sys.argv[1:]
          pid, fd = pty.fork()
          if pid == 0:
              os.execvp(argv[0], argv)
          deadline = time.time() + 90
          seen = b""
          def pump(until):
              global seen
              while until is None or until not in seen:
                  left = deadline - time.time()
                  if left <= 0:
                      sys.stdout.flush()
                      sys.exit("driver: gave up after 90s waiting for %s" % (
                          repr(until.decode()) if until else "the session to close"))
                  ready, _, _ = select.select([fd], [], [], min(left, 1.0))
                  if fd not in ready:
                      continue
                  try:
                      data = os.read(fd, 4096)
                  except OSError:
                      data = b""
                  if not data:
                      if until is None:
                          return
                      sys.stdout.flush()
                      sys.exit("driver: pty closed before %r" % until.decode())
                  seen += data
                  sys.stdout.buffer.write(data)
                  sys.stdout.flush()
          pump(b"hi loaded with")
          os.write(fd, b"hi_info\n")
          pump(b"hi_root:")
          os.write(fd, b"exit\n")
          pump(None)
          _, status = os.waitpid(pid, 0)
          sys.exit(os.waitstatus_to_exitcode(status))
          PY
          grep -q 'Connected' "$RUNNER_TEMP/session.log"
          grep -q 'macOS' "$RUNNER_TEMP/session.log"
          grep -Eq "hi_root: .*/$USER\.hi\.[A-Za-z0-9.]+/say-hi" "$RUNNER_TEMP/session.log"
          grep -q 'Disconnected' "$RUNNER_TEMP/session.log"
          # The driver's own verdict last, and never discarded: the greps above
          # name a missing marker more precisely, so they get to fail first, but
          # a session that prints all four and *then* exits non-zero - or one
          # the driver gave up on at 90s, which exits with its message and a
          # full transcript already grepped - is only visible here. pipefail is
          # on, so this is python's status and not tee's.
          [ "$rc" -eq 0 ] || {
            echo "the session driver exited $rc - see the transcript above" >&2
            exit "$rc"
          }

      # read-only over the Host entry above, in JSON; any `bad` row exits 1,
      # so a finding fails the step with the row logged
      - name: hi --doctor against the loopback
        if: env.HI_LOOPBACK == 'true'
        run: |
          set -euo pipefail
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          rc=0
          /bin/bash ./hi.sh --doctor --json loop >"$RUNNER_TEMP/doctor.json" || rc=$?
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print(json.dumps(d, indent=1))' "$RUNNER_TEMP/doctor.json"
          [ "$rc" -eq 0 ] || { echo "hi --doctor found a bad row (exit $rc)" >&2; exit "$rc"; }

      - name: The cleanup trap left nothing behind
        if: env.HI_LOOPBACK == 'true'
        run: bash .github/scripts/no_hi_session_left.sh

  # The client on musl and busybox: the fast suites in an Alpine container, as
  # an unprivileged user, with the shells, git, python3, and openssl (bump.sh's
  # BLAKE2 fallback) every other CI box has. Alpine as a target is
  # ssh_test.sh's; this is hi.sh itself on busybox sed/awk/mktemp/ip. Built
  # from alpine-shell.Dockerfile, so the base stays digest-pinned under
  # dependabot and image-scan. The copy sits in $HOME/hi-tree, not
  # $HOME/say-hi, for the reason windows-e2e.yml's wsl-suites gives.
  test-alpine:
    name: fast suites (Alpine client)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Read off this job's own harden-runner log, not guessed: the docker
          # build pulls the base image (registry-1.docker.io, auth.docker.io,
          # and whichever CDN Docker Hub answers with) and apk installs the
          # shells from Alpine's mirror. GitHub's own meta domains - github.com,
          # *.github.com, ghcr.io and the productionresultssa* blobs the cache
          # and artifacts use - are allowed by harden-runner itself and need no
          # row here. Both Docker CDNs are listed because a run gets one or the
          # other; release.yml's recorded list has the same pair.
          allowed-endpoints: >
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            dl-cdn.alpinelinux.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Alpine client
        run: >-
          docker build -q -t hi-alpine-client
          --build-arg PKGS="bash zsh fish git python3 openssh-client openssl"
          -f tests/dockerfiles/alpine-shell.Dockerfile tests/dockerfiles

      - name: Run the fast suites on Alpine
        run: |
          docker run --rm -v "$PWD:/src:ro" hi-alpine-client sh -euc '
            adduser -D hi
            mkdir -p /home/hi/hi-tree
            cp -a /src /home/hi/hi-tree/say-hi
            chown -R hi:hi /home/hi/hi-tree
            su -s /bin/sh hi -c "cd /home/hi/hi-tree/say-hi &&
              git config --global --add safe.directory \"\$PWD\" &&
              _HI_HOME=/home/hi/hi-tree bash tests/test_runner.sh --host-report --group fast"'

  # actionlint (bad `needs`, invalid contexts, shellcheck over every run:) and
  # zizmor (the Actions security audit; its one deliberate exception, the
  # credentialed release checkout, is suppressed inline). One job, two steps
  # each with continue-on-error so a finding in one does not stop the other
  # from reporting; the trailing step fails the job if either did.
  #
  # actionlint is pinned to kjanat's fork, not upstream: upstream rejects the
  # `$/...` self-repository syntax zizmor's own auto-fix rewrote every local
  # `uses:` to (tools.txt has the why).
  workflow-lint:
    name: workflow lint
    needs: changes
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.changes.outputs.reuse-run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it runs its three
          # linters out of the tool cache. One that turns out to need root fails
          # here outright rather than quietly doing less, which is what makes
          # this worth setting rather than inferring.
          disable-sudo: true
          # Off this job's own audit log: the checkout and the cache, plus
          # github.com and api.github.com from zizmor itself - it resolves the
          # actions it audits online, which no other lint job here does. That
          # run hit the tool cache, so the two release hosts are added for a
          # cold one, as in advisory-lint; they are setup-tool's download path
          # recorded in release.yml's allowlist.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint shells out to shellcheck for run: blocks when it is on
      # PATH - pin it so both tools lint shell with the same version
      - uses: $/.github/actions/setup-tools
        with:
          tools: shellcheck actionlint zizmor

      - id: actionlint
        name: Lint the workflows
        continue-on-error: true
        run: actionlint -color

      # `.`, not `.github/`: collection honors .gitignore only from the root,
      # and a local `npm ci --prefix .github` puts third-party workflows under
      # .github/node_modules that `.github/` would audit
      - id: zizmor
        name: Audit the workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .

      - name: Fail if either found something
        if: steps.actionlint.outcome == 'failure' || steps.zizmor.outcome == 'failure'
        run: exit 1

  # Every commit reachable from the checkout, not just this diff: a secret
  # pushed and then deleted is still in the history anyone can clone. The
  # binary needs no token, so a fork PR runs it too. --redact keeps a finding's
  # value out of the public log; a false positive goes in a .gitleaks.toml
  # allowlist with its reason, never a wider ignore.
  secret-scan:
    name: secret scan (gitleaks)
    needs: changes
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.changes.outputs.reuse-run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it only scans the
          # checkout. One that turns out to need root fails here outright rather
          # than quietly doing less, which is what makes this worth setting
          # rather than inferring.
          disable-sudo: true
          # Off this job's own audit log: the checkout and the cache. That run
          # hit the tool cache, so the two release hosts cover a cold gitleaks
          # download - setup-tool's path, as recorded in release.yml's own
          # allowlist.
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: $/.github/actions/setup-tools
        with:
          tools: gitleaks

      - name: Scan the full history for secrets
        run: gitleaks git --redact --no-banner --verbose .

  # Pull requests only: the action diffs the dependency graph between the PR's
  # base and head, and a push has no base to diff. Fails on a newly added
  # dependency with a high or critical advisory - the workflows' actions and
  # .github/package-lock.json here. Skips a draft itself rather than through
  # `changes`, whose outputs it never reads - not `code`, since a
  # workflow-only diff is how a new action arrives.
  dependency-review:
    name: dependency review
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it is one action
          # talking to the API. One that turns out to need root fails here
          # outright rather than quietly doing less, which is what makes this
          # worth setting rather than inferring.
          disable-sudo: true
          # Off this job's own audit log, which reached one host: the review
          # action asks the API for the diff's advisories and nothing else.
          allowed-endpoints: >
            api.github.com:443

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Advisory, not a gate: a dockerfile nit has never shipped a bug. The lint
  # step's verdict is an output read afterwards, so findings still show in the
  # log, and ./.github/actions/advisory-note restates it as a warning in the
  # run summary; `continue-on-error` on the *job* would paint it green and hide
  # the result. Keep this job off branch protection's required checks when
  # they are set (docs/CONTRIBUTING.md) - it is designed to be ignorable.
  advisory-lint:
    name: advisory lint
    needs: changes
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.changes.outputs.reuse-run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it runs its linters
          # out of the tool cache. One that turns out to need root fails here
          # outright rather than quietly doing less, which is what makes this
          # worth setting rather than inferring.
          disable-sudo: true
          # This job's own audit log named github.com (checkout) and
          # results-receiver.actions.githubusercontent.com (the cache), with
          # the productionresultssa* blob harden-runner allows itself. It was
          # a cache hit, so hadolint never downloaded: the two release hosts
          # below are setup-tool's download path, recorded in release.yml's
          # own allowlist for the same code, and are here so a cold run works
          # too. GitHub meta domains need no row; these githubusercontent.com
          # ones are not meta and do.
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .hadolint.yaml's ignore list is version pins (DL3008/DL3018/DL3041)
      # and fixture-shape rules (DL3002, DL3066, SC2016) that have a written
      # reason to stay. Everything else,
      # including DL3009/DL3015 (apt lists, --no-install-recommends) and
      # DL4006 (curl piped into sh with no pipefail, where a 404 builds a
      # green image with the framework missing), is fixed in the fixtures
      # rather than ignored here.
      - uses: $/.github/actions/setup-tools
        with:
          tools: hadolint

      # `|| true` and a verdict read afterwards rather than continue-on-error:
      # hadolint exits non-zero per file and every one must be linted first.
      - id: hadolint
        name: Lint the fixture Dockerfiles
        run: |
          set -uo pipefail
          : >"$RUNNER_TEMP/hadolint.out"
          for f in tests/dockerfiles/*.Dockerfile; do
            hadolint --no-color --config .hadolint.yaml "$f" >>"$RUNNER_TEMP/hadolint.out" 2>&1 || true
          done
          if [ -s "$RUNNER_TEMP/hadolint.out" ]; then
            cat "$RUNNER_TEMP/hadolint.out"
            # the summary gets the first 80 lines
            sed -n '1,80p' "$RUNNER_TEMP/hadolint.out" >"$RUNNER_TEMP/hadolint.truncated"
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            set -- tests/dockerfiles/*.Dockerfile
            echo "hadolint: clean across $# Dockerfiles"
            echo "found=0" >>"$GITHUB_OUTPUT"
          fi

      - uses: $/.github/actions/advisory-note
        if: steps.hadolint.outputs.found == '1'
        with:
          title: hadolint
          warning-body: Dockerfile lint findings above - advisory, not blocking
          heading: hadolint found something
          body: |
            Advisory only: this job never blocks a merge. `.hadolint.yaml` carries a
            reason per silenced rule; anything reaching here is deliberately left visible.
          report-file: ${{ runner.temp }}/hadolint.truncated

  # Hot-path timings against generous ceilings: catches an order-of-magnitude
  # regression (a fork in a loop, a probe losing its timeout) and logs the
  # numbers for eyeballing trends.
  bench:
    name: hot-path benchmarks
    needs: changes
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.changes.outputs.reuse-run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Off this job's own audit log: the checkout, the cache, and what
          # setup-shells' apt reaches. See test-ubuntu above for why
          # dl.google.com is here and why the Ubuntu mirror is port 80.
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            dl.google.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-shells

      - name: Run benchmarks
        run: "${{ github.workspace }}/tests/test_runner.sh --host-report --group bench"

  # Per-command profiles of the same four hot paths, through timep in the
  # tests/dockerfiles/timep.Dockerfile box (tests/profile.sh's header says why a
  # container, and why the numbers are rankings rather than milliseconds).
  # Advisory: the bench above is the gate, this is what to read when it trips,
  # so a red here - timep fetched from upstream main at run time, a box that
  # will not build - never blocks a merge. The profiles land as an artifact.
  profile:
    name: hot-path profiles (timep)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Off this job's own audit log: the checkout, timep from raw.github,
          # the cache, the image pull, and the debian packages inside it. Both
          # Docker CDNs are listed because a run gets one or the other.
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            deb.debian.org:80

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Profile the hot paths
        run: "${{ github.workspace }}/tests/profile.sh --outdir ${{ runner.temp }}/profiles"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: profiles
          path: ${{ runner.temp }}/profiles
          retention-days: 14
          if-no-files-found: ignore

  # catches nfpm.yaml/install_tree breakage on the PR that causes it, not at
  # the next release tag
  packaging-smoke:
    name: package build (deb, rpm, apk)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Off this job's own audit log: the checkout, the cache, the images
          # mkrepo builds in, and the debian/alpine packages inside them. The
          # release hosts cover a cold nfpm download, which this run took from
          # cache.
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            deb.debian.org:80
            dl-cdn.alpinelinux.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-tools
        with:
          tools: nfpm

      # a throwaway key so the smoke covers the signed shape end to end - the
      # real key is the APK_SIGNING_KEY secret, release.yml's business only
      - name: Generate a throwaway apk signing key
        run: |
          set -euo pipefail
          openssl genrsa -out "$RUNNER_TEMP/smoke.rsa" 4096
          openssl rsa -in "$RUNNER_TEMP/smoke.rsa" -pubout -out "$RUNNER_TEMP/smoke.rsa.pub"
          echo "HI_APK_KEY=$RUNNER_TEMP/smoke.rsa" >>"$GITHUB_ENV"

      # mkpkg.sh itself asserts one artifact per format and writes SHA256SUMS
      - name: Build the packages
        run: packaging/mkpkg.sh

      # Catches "apk-tools rejects what nfpm built" (nfpm 2.47.0's tree entries
      # did) and proves the signature chain: the pubkey lands in /etc/apk/keys
      # under the name nfpm.yaml stamps into the signature, and apk add must
      # accept the package with NO --allow-untrusted. The image is
      # tests/dockerfiles' alpine pin, by digest (check_tool_versions.local.sh
      # reports when the two part).
      - name: Install the signed apk on Alpine
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" \
            -v "$RUNNER_TEMP/smoke.rsa.pub:/etc/apk/keys/say-hi.rsa.pub:ro" \
            alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b \
            sh -c 'apk add /dist/say-hi_*_noarch.apk && sh -lc "hi --version" && ls /usr/share/say-hi/common/core.sh'

      # The reproducibility contract: the same commit builds byte-identical
      # deb/rpm/apk (SOURCE_DATE_EPOCH from HEAD plus clamped staging mtimes).
      # nfpm.yaml hardcodes ./dist/staging, so the builds are sequential with
      # the first moved aside rather than parallel via --outdir.
      - name: Build again and require byte-identical packages
        run: |
          mv dist dist.first
          packaging/mkpkg.sh
          diff dist.first/SHA256SUMS dist/SHA256SUMS

      # README's package badge, published by pages.yml as a shields endpoint
      # like the tests badge; measured after the second build, the one dist/
      # holds. Two numbers: the deb is the download, the staging tree is what
      # lands on disk (packages compress, installed files do not).
      - name: Measure what the packages actually cost
        run: |
          set -euo pipefail
          deb="$(stat -c%s dist/say-hi_*_all.deb)"
          installed="$(du -sb dist/staging | cut -f1)"
          printf '%s %s\n' "$deb" "$installed" >"${{ runner.temp }}/sizes"
          {
            echo "### Package size"
            echo
            echo "| | bytes | rounded |"
            echo "|---|---|---|"
            echo "| deb (downloaded) | $deb | $(((deb + 512) / 1024)) KB |"
            echo "| installed on disk | $installed | $(((installed + 512) / 1024)) KB |"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-install-sizes
          path: ${{ runner.temp }}/sizes
          retention-days: 14

      # The repository the release publishes, from a third build signed with a
      # throwaway GPG key (the rpm signature carries its signing time, which is
      # why the byte-identical check above stays on unsigned builds): every
      # index mkrepo.sh writes, on the runner's own docker, on the PR that
      # breaks it. Installing from the result is tests/packaging/repo_test.sh's
      # job, in the e2e group.
      - name: Build the package repository
        run: |
          set -euo pipefail
          gnupg="$RUNNER_TEMP/gnupg"
          mkdir -p "$gnupg"
          chmod 700 "$gnupg"
          GNUPGHOME="$gnupg" gpg --batch --quiet --passphrase '' \
            --quick-generate-key 'say-hi smoke <smoke@example.invalid>' rsa4096 sign never
          GNUPGHOME="$gnupg" gpg --batch --quiet --armor --export-secret-keys >"$RUNNER_TEMP/smoke.gpg.key"
          mv dist dist.unsigned
          HI_GPG_KEY="$RUNNER_TEMP/smoke.gpg.key" packaging/mkpkg.sh
          packaging/mkrepo.sh --gpg-key "$RUNNER_TEMP/smoke.gpg.key" --apk-key "$RUNNER_TEMP/smoke.rsa" \
            --tarball "$RUNNER_TEMP/package-repo.tar.gz"
          echo "package-repo.tar.gz: $(tar -tzf "$RUNNER_TEMP/package-repo.tar.gz" | grep -c '[^/]$') files"

  # Beside the fast suites, not after them: this and e2e-backends each take
  # about three minutes to start, so waiting on `test` would cost every green
  # PR three minutes of wall clock, and a red unit test and a red e2e show up
  # together.
  #
  # Four shards rather than one long run: the eight e2e suites take 25
  # minutes serial (test_runner.sh pins its width to 1 whenever an
  # e2e/backends/bench suite is selected), and --shard i/n (the same tool
  # windows-client.yml uses) is a runner-count knob - two suites a shard.
  e2e:
    name: e2e (ssh, docker, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit, for now: Fedora's MirrorManager handed out a different
          # mirror per request (cofractal-ewr.mm.fcix.net, insect.mm.fcix.net,
          # ...), so no fixed list could hold. dnf is now pinned to
          # mirrors.kernel.org (sshd-fedora.Dockerfile, repo_test.sh's
          # $_HI_DNF_PIN); this goes to block once a cold run's audit log,
          # all four shards, gives the list - the framework installers
          # (starship.rs, mise.jdx.dev, ...) reach hosts no file here names.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install_methods_test.sh builds real .deb/.rpm/.apk with mkpkg.sh and
      # installs them on its targets; without nfpm those cases stand down and
      # --require-run fails the gate, so the pin is what makes them run.
      - uses: $/.github/actions/setup-tools
        with:
          tools: nfpm

      # the ssh suite's starved case needs the netem qdisc to shape a
      # container's own link; ubuntu-latest doesn't load it by default. `||
      # true`: a runner image that ever blocks this degrades to the case's
      # own explicit skip (tests/lib/fixtures.sh's netem capability) under
      # --require-run below, rather than failing this step outright.
      - name: Load the netem qdisc for the ssh suite's starved case
        run: sudo modprobe sch_netem || true

      # --require-run: here a skip is a broken runner, not an optional
      # backend. runner_test.sh checks the matrix's slices partition the
      # e2e group.
      - name: Run this shard of the end-to-end suites
        env:
          HI_SHARD: ${{ matrix.shard }}
        run: |
          "${{ github.workspace }}/tests/test_runner.sh" --verbose --host-report --require-run --group e2e --shard "$HI_SHARD"

  # One shard per backend rather than a named matrix entry each: every shard
  # installs all three tools (a few redundant seconds, paid in parallel, not
  # serial) so the mapping from shard number to backend lives in one place -
  # test_runner.sh's own table order - instead of being pinned twice, once
  # here and once in the suite table. The three serial on one runner take 40
  # minutes (one shared container/VM daemon is what test_runner.sh's width
  # pin protects against); a runner apiece is a separate daemon each.
  e2e-backends:
    name: e2e (podman, nomad, kube, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
        # one backend per shard, in the suite table's order (backends:podman,
        # backends:nomad, backends:kube) - setup-backends then installs only
        # what this shard's suite drives instead of all three every time
        include:
          - { shard: 1/3, backends: podman }
          - { shard: 2/3, backends: nomad }
          - { shard: 3/3, backends: kind }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Off this job's own audit log, plus two the log could not show: this
          # shard took podman from ubuntu's own repo and never installed nomad,
          # so apt.releases.hashicorp.com is here from
          # setup-backends/install.sh, and the release hosts cover kind's binary
          # download. The union across all three shards, which sweep one suite
          # set between them, so which shard reaches a host is arbitrary. The
          # kube rows came from a cold run: on the run this list was first built
          # from, kind-action restored kind from actions/cache and never fetched
          # kubectl, so dl.k8s.io was missing and shard 3 went red on it.
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            dl.google.com:443
            apt.releases.hashicorp.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            dl.k8s.io:443
            cdn.dl.k8s.io:443
            dl-cdn.alpinelinux.org:443
            checkpoint-api.hashicorp.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-backends
        with:
          backends: ${{ matrix.backends }}

      # same contract as e2e's above: three suites, three shards - one
      # backend each
      - name: Run this shard of the backend end-to-end suites
        env:
          HI_SHARD: ${{ matrix.shard }}
        run: |
          "${{ github.workspace }}/tests/test_runner.sh" --verbose --host-report --require-run --group backends --shard "$HI_SHARD"

  # The two checks CONTRIBUTING.md's table and README's badge know as
  # `e2e (ssh, docker)` and `e2e (podman, nomad, kube)` - two plain jobs, not
  # one matrix job, so a skip reports under each one's own name instead of
  # going unnamed the way a skipped matrix entry does (the same reason
  # `test` split into `test-ubuntu`/`test-arm`), and each restates the draft
  # clause since `!cancelled()` runs past a skipped need. `code` reads empty
  # on a draft (`changes` itself skipped) same as on a workflow-only or
  # docs-only diff, so the step takes the "rightly skipped" branch either way
  # without needing its shard job to have run. `code` is what says a shard
  # was rightly skipped rather than a failed gate - `changes` failing
  # outright leaves `code` 'true' (run everything), never a skip that could
  # pass as green.
  e2e-checks-ssh:
    name: e2e (ssh, docker)
    needs: [changes, e2e]
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it only reads other
          # jobs' results. One that turns out to need root fails here outright
          # rather than quietly doing less, which is what makes this worth
          # setting rather than inferring.
          disable-sudo: true
          # A gate job, as e2e-gate below: its audit log named no endpoint.
          allowed-endpoints: >
            github.com:443

      - name: Require every shard green, unless the run was rightly skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          if [ "$CODE" = true ]; then
            echo "shards: $RESULT"
            [ "$RESULT" = success ]
          else
            echo "no code changes, or a green PR run of this tree - shards were rightly skipped"
          fi

  e2e-checks-backends:
    name: e2e (podman, nomad, kube)
    needs: [changes, e2e-backends]
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it only reads other
          # jobs' results. One that turns out to need root fails here outright
          # rather than quietly doing less, which is what makes this worth
          # setting rather than inferring.
          disable-sudo: true
          # A gate job, as e2e-gate below: its audit log named no endpoint.
          allowed-endpoints: >
            github.com:443

      - name: Require every shard green, unless the run was rightly skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.e2e-backends.result }}
        run: |
          set -euo pipefail
          if [ "$CODE" = true ]; then
            echo "shards: $RESULT"
            [ "$RESULT" = success ]
          else
            echo "no code changes, or a green PR run of this tree - shards were rightly skipped"
          fi

  # Pushes to main and same-repository pull requests, never a fork's: the
  # platform e2e workflows stand up an sshd and authorize a throwaway key,
  # not something to hand a stranger's pull request, but a PR whose head
  # branch lives in this repository was pushed by someone who can push to
  # main already, and it is that PR where a red Windows or BSD run is worth
  # knowing - not after the merge, off a release. Gated on `test-ubuntu` and
  # `test-arm` alone, not `test-macos` too: nearly every bad push fails a red
  # ubuntu or arm64 unit test first, and waiting on macOS's own 30-minute job
  # as well only delays the Windows and BSD runners starting, for what a red
  # macOS entry catches on its own (a red gate here still holds them, so
  # nothing ships around a macOS-only break, just later - macOS's own check
  # still fails the run). One gate job rather than the same needs/if on every
  # caller below; macOS's loopback rides in test-macos itself, for the same
  # audience.
  e2e-gate:
    name: e2e gate
    needs: [changes, test-ubuntu, test-arm]
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it only reads other
          # jobs' results. One that turns out to need root fails here outright
          # rather than quietly doing less, which is what makes this worth
          # setting rather than inferring.
          disable-sudo: true
          # A gate job: it reads its needs' outputs and reaches nothing else.
          # Its own audit log named no endpoint at all.
          allowed-endpoints: >
            github.com:443

      - id: gate
        env:
          TRUSTED: ${{ needs.changes.outputs.trusted }}
          TEST_UBUNTU: ${{ needs.test-ubuntu.result }}
          TEST_ARM: ${{ needs.test-arm.result }}
        run: |
          ok=false
          [ "$TRUSTED" = true ] && [ "$TEST_UBUNTU" = success ] && [ "$TEST_ARM" = success ] && ok=true
          echo "ok=$ok" >>"$GITHUB_OUTPUT"

  e2e-windows:
    name: e2e (Windows)
    needs: e2e-gate
    if: needs.e2e-gate.outputs.ok == 'true'
    uses: $/.github/workflows/windows-e2e.yml

  # The non-macOS BSDs, on the same gate: a FreeBSD and an OpenBSD VM on
  # hosted runners each run the fast suites and ssh to themselves.
  e2e-freebsd:
    name: e2e (FreeBSD)
    needs: e2e-gate
    if: needs.e2e-gate.outputs.ok == 'true'
    uses: $/.github/workflows/freebsd-e2e.yml

  e2e-openbsd:
    name: e2e (OpenBSD)
    needs: e2e-gate
    if: needs.e2e-gate.outputs.ok == 'true'
    uses: $/.github/workflows/openbsd-e2e.yml

  # The client-side half of Windows. Not behind e2e-gate: it is the fast
  # suites on another client, not an e2e that wants green targets first, and
  # waiting on `test` as well would make it the long pole of every push.
  # Pushes and same-repo PRs, the
  # same audience as e2e-gate (spelled out here because it does not sit
  # behind the gate), and gated on `changes` like the other fast-suite jobs.
  # A real check, not advisory: windows-client.yml carries no
  # continue-on-error, so a red suite fails the run. Not on the
  # required-checks list, so it does not block a merge.
  e2e-windows-client:
    name: fast suites (Windows client)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted == 'true'
    uses: $/.github/workflows/windows-client.yml

  # A push whose tree already went green on its PR (`changes` found the
  # marker) skips every job above, so what reads main's newest run gets that
  # PR run's results instead: the two artifacts pages.yml and release.yml
  # fetch, and a check run per reusable-workflow job - README's platform
  # badges read check runs on main's head, and a skipped caller leaves none
  # for its callee at all. Each mirrored check links the PR job it stands for.
  carry-forward:
    name: reuse the PR run's results
    needs: changes
    if: needs.changes.outputs.reuse-run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Artifacts only: it downloads a shard's parts and uploads them again.
          # The blob storage behind them rides GitHub's meta domains.
          allowed-endpoints: >
            github.com:443
            results-receiver.actions.githubusercontent.com:443

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{tests,package-install-sizes}"
          path: ${{ runner.temp }}/pr
          run-id: ${{ needs.changes.outputs.reuse-run }}
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests
          path: ${{ runner.temp }}/pr/tests/totals
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-install-sizes
          path: ${{ runner.temp }}/pr/package-install-sizes/sizes
          retention-days: 14

      - name: Mirror the PR run's platform checks onto this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.changes.outputs.reuse-run }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | contains(" / ")) | [.name, .conclusion, .html_url] | @tsv' |
            while IFS=$'\t' read -r name conclusion url; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
                -f name="$name" -f head_sha="$GITHUB_SHA" -f status=completed \
                -f conclusion="$conclusion" -f details_url="$url" \
                -f "output[title]=Reused from PR run $RUN" \
                -f "output[summary]=This commit's tree is the one that run tested." >/dev/null
              printf '%s  %s\n' "$conclusion" "$name"
            done
