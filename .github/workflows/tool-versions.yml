name: Tool versions

# Weekly drift check over the curl-installed tools in setup-tool's tools.txt,
# plus the couple of pins (bashcov, currently) that live inline in a workflow
# instead - the one class of pin dependabot cannot see (its own config says
# so). The signal is one tracking issue, kept current: opened when a pin is
# behind, rewritten with the current table on every later run, closed by the
# run that finds everything current - image-scan.yml's shape, and for its
# reason: a stale pin is a standing state, not an event, and a ::warning in a
# scheduled run that nobody opens is a signal only in the sense that a tree
# falling in a forest is. The annotations stay too, for whoever does open the
# run. The bump itself stays a one-line edit at wherever the row says it lives.
#
# An issue, not a pull request, is also why this workflow still exists rather
# than being folded into Renovate, which could watch the same pins: the
# reasoning is in .github/dependabot.yml's header, and the answer there is no.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # the one write this job does: upsert (and close) its own tracking issue
  issues: write

jobs:
  check:
    name: composite-action tool pins vs upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script exits with the number of outdated pins; captured as an
      # output rather than failing the step, so the issue below can be closed
      # on the zero and opened on the rest. A missing upstream answer prints
      # a row and counts as current, which is the script's own call.
      - id: check
        name: Compare pinned defaults to upstream releases
        env:
          # raises the GitHub releases API rate limit well above the roster
          # size - unauthenticated it is 60/hour per IP, shared with every
          # other job on the runner pool
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/check_tool_versions.sh | tee "$RUNNER_TEMP/tools.txt" || rc=$?
          echo "outdated=$rc" >>"$GITHUB_OUTPUT"

      - name: Compose the report, when there's drift to report
        if: steps.check.outputs.outdated != 0
        env:
          OUTDATED: ${{ steps.check.outputs.outdated }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "$OUTDATED pinned tool(s) are behind upstream."
            echo "Bump each OUTDATED row where it is pinned - tools.txt's version column for most,"
            echo "or the workflow file the row names for the couple that live inline instead."
            echo
            echo '```'
            cat "$RUNNER_TEMP/tools.txt"
            echo '```'
            echo
            echo "Found by [\`tool-versions\`]($RUN_URL). Closed automatically once every pin is current."
          } >"$RUNNER_TEMP/report.md"

      - uses: ./.github/actions/upsert-tracking-issue
        with:
          label: tool-versions
          label-color: 0E8A16
          label-description: A tools.txt pin in .github/actions/setup-tool is behind upstream
          title: Pinned CI tools are behind their upstream releases
          resolved: ${{ steps.check.outputs.outdated == 0 && 'true' || 'false' }}
          close-comment: Every pin is current again. [Latest run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          body-file: ${{ runner.temp }}/report.md
