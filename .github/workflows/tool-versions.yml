name: Tool versions

# Drift check over the curl-installed tools in setup-tool's tools.txt, plus
# the pins that live inline in a workflow (bashcov, currently) - the one
# class of pin dependabot cannot see. Runs after every green CI battery on a
# push to main (the batch scorecard.yml and coverage.yml share) and weekly as
# a backstop, since upstream releases land without a push here. The signal is
# one tracking issue, kept current: opened when a pin is behind, rewritten on
# every later run, closed when everything is current, on image-scan.yml's
# shape. An issue, not a PR, is why this is not folded into Renovate:
# .github/dependabot.yml's header.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

# pushes to main can stack; only the newest drift report matters
concurrency:
  group: tool-versions
  cancel-in-progress: true

permissions:
  contents: read
  # the one write this job does: upsert (and close) its own tracking issue
  issues: write

jobs:
  check:
    name: composite-action tool pins vs upstream
    # only a green push to main gets a fresh report; the schedule and a manual
    # dispatch pass the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script exits with the number of outdated pins, captured as an
      # output rather than failing the step so the issue below closes on zero
      # and opens on the rest; a missing upstream answer counts as current.
      - id: check
        name: Compare pinned defaults to upstream releases
        env:
          # raises the releases API rate limit above the roster size -
          # unauthenticated it is 60/hour per IP, shared across the runner pool
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/check_tool_versions.sh | tee "$RUNNER_TEMP/tools.txt" || rc=$?
          echo "outdated=$rc" >>"$GITHUB_OUTPUT"

      - name: Compose the report, when there's drift to report
        if: steps.check.outputs.outdated != 0
        env:
          OUTDATED: ${{ steps.check.outputs.outdated }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "$OUTDATED pinned tool(s) are behind upstream."
            echo "Bump each OUTDATED row where it is pinned - tools.txt's version column for most,"
            echo "or the workflow file the row names for the couple that live inline instead."
            echo
            echo '```'
            cat "$RUNNER_TEMP/tools.txt"
            echo '```'
            echo
            echo "Found by [\`tool-versions\`]($RUN_URL). Closed automatically once every pin is current."
          } >"$RUNNER_TEMP/report.md"

      - uses: $/.github/actions/upsert-tracking-issue
        with:
          label: tool-versions
          label-color: 0E8A16
          label-description: A tools.txt pin in .github/actions/setup-tool is behind upstream
          title: Pinned CI tools are behind their upstream releases
          resolved: ${{ steps.check.outputs.outdated == 0 && 'true' || 'false' }}
          close-comment: Every pin is current again. [Latest run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          body-file: ${{ runner.temp }}/report.md
