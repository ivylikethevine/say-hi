name: Tool versions

# Drift check over the pins dependabot cannot see - the curl-installed tools
# in setup-tool's tools.txt and the inline pins check_tool_versions.local.sh
# lists (bashcov, vhs, the docs theme) - plus a second look at the action SHAs
# and image digests it does move. Runs after every green CI battery on a
# push to main (the batch scorecard.yml and coverage.yml share) and weekly as
# a backstop, since upstream releases land without a push here. The signal is
# one tracking issue, kept current: opened when a pin is behind, rewritten on
# every later run, closed when everything is current, on image-scan.yml's
# shape. An issue, not a PR, is why this is not folded into Renovate:
# .github/dependabot.yml's header.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

# pushes to main can stack, but queue rather than cancel: a run cancelled
# mid-upsert can leave its tracking issue half-written (or a duplicate opened)
concurrency:
  group: tool-versions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: composite-action tool pins vs upstream
    # only a green push to main gets a fresh report; the schedule and a manual
    # dispatch pass the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the one write this job does: upsert (and close) its own tracking issue
      issues: write
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # disable-sudo: this job never elevates - harden-runner's monitor
          # logged no sudo exec for it on a green run, and it compares pins
          # against upstream tags over the API. One that turns out to need root
          # fails here outright rather than quietly doing less, which is what
          # makes this worth setting rather than inferring.
          disable-sudo: true
          # Off this job's own audit log: the API for the upstream tags, plus
          # the two projects that publish theirs elsewhere - hub.docker.com and
          # salsa.debian.org.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            hub.docker.com:443
            salsa.debian.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script exits with the number of problems (outdated pins, stale
      # roster rows, local-check failures), captured as an output rather than
      # failing the step so the issue below closes on zero and opens on the
      # rest; a missing upstream answer counts as current.
      - id: check
        name: Compare pinned defaults to upstream releases
        env:
          # raises the releases API rate limit above the roster size -
          # unauthenticated it is 60/hour per IP, shared across the runner pool
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/check_tool_versions.sh | tee "$RUNNER_TEMP/tools.txt" || rc=$?
          echo "outdated=$rc" >>"$GITHUB_OUTPUT"

      - name: Compose the report, when there's drift to report
        if: steps.check.outputs.outdated != 0
        env:
          OUTDATED: ${{ steps.check.outputs.outdated }}
        run: |
          set -euo pipefail
          {
            echo "$OUTDATED problem(s) with the pins below."
            echo "Fix each OUTDATED or ERROR row where it says: tools.txt (pin and sha256 together),"
            echo "or the file an inline pin, action, or image row names."
            echo
            echo '```'
            cat "$RUNNER_TEMP/tools.txt"
            echo '```'
          } >"$RUNNER_TEMP/report.md"

      - uses: $/.github/actions/upsert-tracking-issue
        with:
          label: tool-versions
          label-color: 0E8A16
          label-description: A pin dependabot cannot move is behind upstream
          title: Pinned CI tools are behind their upstream releases
          resolved: ${{ steps.check.outputs.outdated == 0 && 'true' || 'false' }}
          close-comment: Every pin is current again.
          resolved-when: every pin is current
          body-file: ${{ runner.temp }}/report.md
