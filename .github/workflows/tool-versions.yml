name: Tool versions

# Drift check over the pins dependabot can't see: the CI tools in
# .github/actions/setup-tool/tools.txt and the inline pins and local checks in
# .github/scripts/check_tool_versions.local.sh. It also re-checks the action
# SHAs and image digests dependabot does move, so an unmerged bump shows as
# drift, and applies dependabot's 7-day cooldown. The signal is one tracking
# issue, kept current: opened when something is behind, rewritten on every
# later run, closed when all is current. Runs after every green CI run on a
# push to main and weekly (Monday, after dependabot's run), since upstream
# releases land without a push here.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

# pushes to main can stack, but queue rather than cancel: a run cancelled
# mid-upsert can leave its tracking issue half-written (or a duplicate opened)
concurrency:
  group: tool-versions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: pinned CI tools vs upstream
    # only a green push to main gets a fresh report; the schedule and a manual
    # dispatch pass the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # the one write this job does: upsert (and close) its own tracking issue
      issues: write
    steps:
      # block, not audit: check_tool_versions.sh asks the GitHub API, Docker
      # Hub, npm, and any gitlab: host a roster row names - nothing else.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            hub.docker.com:443
            registry.npmjs.org:443
            salsa.debian.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script exits with the number of problems, captured as an output
      # rather than failing the step, so the issue closes on zero and opens on
      # the rest. An unreadable upstream counts as current, unless no lookup on
      # its host answered: that host is missing from allowed-endpoints above.
      - id: check
        name: Compare pins to upstream releases
        env:
          # raises the GitHub API rate limit (60/hour unauthenticated, shared
          # across the runner pool) above the roster size
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/check_tool_versions.sh | tee "$RUNNER_TEMP/tool-versions.txt" || rc=$?
          echo "problems=$rc" >>"$GITHUB_OUTPUT"

      - name: Compose the tracking issue body
        if: steps.check.outputs.problems != '0'
        env:
          PROBLEMS: ${{ steps.check.outputs.problems }}
        run: |
          set -euo pipefail
          {
            echo "$PROBLEMS problem(s) with the pins below. Fix each OUTDATED, MISMATCH or ERROR row"
            echo "where it points: tools.txt (pin and sha256 together), the file an inline or local"
            echo "row names, or dependabot's open bump PR for an action SHA or image digest."
            echo
            echo '```'
            cat "$RUNNER_TEMP/tool-versions.txt"
            echo '```'
          } >"$RUNNER_TEMP/issue.md"

      - uses: ./.github/actions/upsert-tracking-issue
        with:
          label: tool-versions
          label-color: 0E8A16
          label-description: A pin dependabot cannot move is behind upstream
          title: Pinned CI tools are behind their upstream releases
          resolved: ${{ steps.check.outputs.problems == '0' }}
          close-comment: Every pin is current again.
          resolved-when: every pin is current
          body-file: ${{ runner.temp }}/issue.md
