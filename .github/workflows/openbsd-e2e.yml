name: OpenBSD e2e

# freebsd-e2e.yml's job on the other BSD: an OpenBSD VM on the hosted ubuntu
# runner runs the fast suites and then ssh's to itself, client and target
# both OpenBSD userland. Its base carries neither bash nor base64(1) - only
# b64encode/b64decode - so the VM takes both from packages, which is what
# SUPPORT.md's *BSD row asks of an OpenBSD target. No fish: two fish
# versions share the package stem, and a non-interactive pkg_add refuses the
# ambiguity; the fish dialect is proven on every other platform. ci.yml calls
# it beside freebsd-e2e.yml, behind the same gate; dispatch runs it on its
# own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback:
    name: hi localhost (OpenBSD both ends)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .github/scripts/bsd_loopback.sh - byte for byte freebsd-e2e.yml's own
      # call, its header says why
      - name: Fast suites, then say hi to ourselves
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: "7.9"
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg_add -I bash zsh git python%3 base64
          run: bash "$GITHUB_WORKSPACE/.github/scripts/bsd_loopback.sh" </dev/null
