name: OpenBSD e2e

# freebsd-e2e.yml's job on the other BSD: an OpenBSD VM on the hosted ubuntu
# runner runs the fast suites and then ssh's to itself, client and target
# both OpenBSD userland. Its base carries no bash, and no base64(1) -
# LibreSSL's `openssl base64` stands in for that (GLOSSARY.md's HI.17) - so
# the VM takes bash alone from packages, which is what COMPATIBILITY.md's *BSD row
# asks of an OpenBSD target. No fish: two fish
# versions share the package stem, and a non-interactive pkg_add refuses the
# ambiguity; the fish dialect is proven on every other platform. ci.yml calls
# it beside freebsd-e2e.yml, behind the same gate; dispatch runs it on its
# own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback:
    name: hi localhost (OpenBSD both ends)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit, for one more run: the OpenBSD guest opened DNS-over-HTTPS
          # to 9.9.9.9 with no hostname in the exchange, and allowed-endpoints
          # matches on hostname, so no row could permit it. The prepare step
          # below now stops unwind, the resolver that does it; once a run's
          # audit log shows no 9.9.9.9, this goes to block. Its other hosts
          # are legible (cdn.openbsd.org, pool.ntp.org, time.cloudflare.com,
          # www.google.com for its connectivity check).
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .github/scripts/bsd_loopback.sh - byte for byte freebsd-e2e.yml's own
      # call, its header says why
      - name: Fast suites, then say hi to ourselves
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: "7.9"
          usesh: true
          sync: rsync
          copyback: false
          # unwind first: the guest's own resolver is what sends DNS over
          # HTTPS to 9.9.9.9, a bare IP no allowlist row can name. Stopped,
          # resolvd falls back to the nameservers DHCP handed out, which go
          # through the host - where harden-runner sees every name. Printed,
          # so the next run's log shows what the guest resolves through.
          prepare: |
            rcctl stop unwind || true
            rcctl disable unwind || true
            sleep 2
            cat /etc/resolv.conf
            pkg_add -I bash zsh git python%3
          run: bash "$GITHUB_WORKSPACE/.github/scripts/bsd_loopback.sh" </dev/null
