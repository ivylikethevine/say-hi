name: Link check

# External links in the docs. Advisory: a rotted URL is worth fixing but has
# never shipped a bug, so this never fails on one and is never a required
# check; what it finds goes to one `link-check` tracking issue, closed by the
# run that finds none. Runs after every green CI run on a push to main (a doc
# change checks its new links when it lands) and weekly, since links rot with
# no push here; never per-PR. Pull requests check relative links and fragments
# offline (ci.yml). Settings for both are lychee.toml.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

# pushes to main can stack, but queue rather than cancel: a run cancelled
# mid-upsert can leave its tracking issue half-written (or a duplicate opened)
concurrency:
  group: link-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lychee:
    name: lychee (advisory)
    # only a green push to main gets a fresh sweep; the schedule and a manual
    # dispatch pass the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the one write this job does: upsert (and close) its own tracking issue
    steps:
      # audit, deliberately: lychee's job is to reach every URL the docs name,
      # so an allowlist would be the docs' own link list.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the tools.txt pin (sha256-verified, drift-checked), the same binary
      # ci.yml's offline check runs
      - uses: ./.github/actions/setup-tool
        with:
          tool: lychee

      # lychee exits 2 for broken links, which is the finding, not a failure;
      # any other non-zero exit (bad input, a crash) still fails the job.
      - id: check
        name: Check for dead links
        env:
          # authenticated github.com requests dodge the anonymous rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # .github/link-check-paths.txt, in a repo that has one, adds
          # pathspecs beyond the Markdown, one per line; the cleaned list
          # is an output for the issue body
          extra=()
          if [ -f .github/link-check-paths.txt ]; then
            mapfile -t extra < <(sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' .github/link-check-paths.txt)
          fi
          echo "extra=${extra[*]+${extra[*]} }" >>"$GITHUB_OUTPUT"
          mapfile -d '' files < <(git ls-files -z '*.md' ${extra[@]+"${extra[@]}"})
          rc=0
          lychee --config lychee.toml --include-fragments --no-progress \
            --format markdown --output "$RUNNER_TEMP/lychee.md" "${files[@]}" || rc=$?
          case "$rc" in
            0) echo "found=0" >>"$GITHUB_OUTPUT" ;;
            2) echo "found=1" >>"$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # with warning-title set, this also writes the ::warning and the step
      # summary
      - uses: ./.github/actions/upsert-tracking-issue
        with:
          label: link-check
          label-color: FBCA04
          label-description: A link in the docs is dead or unreachable
          title: Dead links in the docs
          resolved: ${{ steps.check.outputs.found != '1' }}
          close-comment: Every link resolves again.
          resolved-when: every link resolves
          preamble: |-
            lychee found dead or unreachable links in the docs. A URL that is fine but
            refuses automated checks belongs in `lychee.toml` with a comment saying why.
            Reproduce with `git ls-files -z '*.md' ${{ steps.check.outputs.extra }}| xargs -0 lychee --config lychee.toml --include-fragments`.
          body-file: ${{ runner.temp }}/lychee.md
          warning-title: lychee
          warning-body: Dead or unreachable links - advisory, not blocking - see the link-check issue
