name: Link check

# External links in the Markdown. Advisory: a rotted URL is worth seeing and
# has never shipped a bug, so this reports - a run summary note and one
# `link-check` tracking issue, closed the run the links recover - and never
# blocks; never add it to required checks. ci.yml's lint job is the blocking
# half, offline (relative paths and anchors only). Runs after every green CI
# battery on a push to main (the batch scorecard, coverage, and tool-versions
# share) and weekly as a backstop, since link rot happens on the internet's
# clock with no push here; never per-PR. Settings for both are lychee.toml.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

# pushes to main can stack, but queue rather than cancel: a run cancelled
# mid-upsert can leave its tracking issue half-written (or a duplicate opened)
concurrency:
  group: link-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lychee:
    name: lychee (advisory)
    # only a green push to main gets a fresh sweep; the schedule and a manual
    # dispatch pass the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the one write this job does: upsert (and close) its own tracking issue
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the tools.txt pin (sha256-verified, drift-checked), the same binary
      # ci.yml's lint job runs offline - not lycheeverse/lychee-action, whose
      # lychee version is the action's to pick
      - uses: $/.github/actions/setup-tools
        with:
          tools: lychee

      # accepted codes, excluded paths, and retries are lychee.toml's. No
      # --cache: nothing persists .lycheecache between runs, and the weekly
      # cadence would expire it anyway - a cold sweep is the job
      - id: lychee
        name: Check for dead links
        continue-on-error: true
        env:
          # authenticated github.com requests dodge the anonymous rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          lychee --config lychee.toml --no-progress \
            --format markdown --output "$RUNNER_TEMP/lychee.md" './**/*.md'

      # a lychee that died before writing its report still opens the issue,
      # saying so rather than posting an empty body
      - name: Compose the tracking issue body
        if: steps.lychee.outcome == 'failure'
        run: |
          set -euo pipefail
          {
            echo "lychee found dead or unreachable links in the Markdown."
            echo "Reproduce with \`lychee --config lychee.toml './**/*.md'\`."
            echo
            if [ -s "$RUNNER_TEMP/lychee.md" ]; then
              cat "$RUNNER_TEMP/lychee.md"
            else
              echo "lychee wrote no report; the run log has its error."
            fi
          } >"$RUNNER_TEMP/issue.md"

      - uses: $/.github/actions/upsert-tracking-issue
        with:
          label: link-check
          label-color: FBCA04
          label-description: A link in the Markdown is dead or unreachable
          title: Dead links in the Markdown
          resolved: ${{ steps.lychee.outcome == 'failure' && 'false' || 'true' }}
          close-comment: Every link resolves again.
          resolved-when: every link resolves
          body-file: ${{ runner.temp }}/issue.md
          warning-title: lychee
          warning-body: Dead or unreachable links - advisory, not blocking - see the issue
