name: Demos

# Proof that the tapes still render, on the pull request that changes one.
# docs/demos/*.gif are manual artifacts - rendered by hand, reviewed by eye,
# committed in their own commit - so nothing here writes one back. What this
# catches is the other failure: a tape that quietly stopped working, which today
# is found months later by whoever next runs docs/tapes/generate.sh.
#
# Two jobs, and they answer different questions.
#
# `render` gates every pull request that touches a tape: color_preview needs no
# backend at all (see the roster at the top of generate.sh) and renders in
# seconds, so it runs on a hosted runner with no daemon, no images and no
# cluster, and it is attached for a person to look at.
#
# `publish` is the autogenerated half. Every tape but `demo` renders on the
# self-hosted box the e2e jobs already use - it is the only machine with all
# four backends - and the GIFs go out as an artifact that pages.yml collects
# into the site. Nothing is committed on either path, which is the same reason
# pages.yml publishes the badge endpoint rather than sed'ing a number into
# README: a bot commit on top of the author's is what branch protection refuses.
#
# `demo.gif` is deliberately not in that set. It is the one GIF claiming stock
# defaults with nothing turned off, so it goes quietly wrong when the header,
# the prompt or the tape moves, and only a person looking at it can tell -
# .githooks/demo_staleness.sh exists to say when that has happened. The other
# seven each advertise one knob, which is a thing a machine can render honestly.
#
# It runs generate.sh rather than vhs directly, which is the point: `Require hi`
# in a tape is satisfied by *any* hi on $PATH, and a runner that happened to
# have one installed would record the wrong tree. generate.sh's preflight puts a
# shim for this checkout's hi.sh on the front of $PATH, and it also tears the
# fixtures down afterwards.
on:
  pull_request:
    paths:
      - "docs/tapes/**"
      - ".github/workflows/demos.yml"
  # What re-renders the published set. A tape landing on main is the change that
  # certainly moved a demo; the weekly run is for the changes that move one
  # without touching a tape at all - the header, the prompt, anything in the
  # shipped tree the session in the frame is running (.githooks/demo_staleness.sh
  # lists them as $_HI_DEMO_INPUTS). Rendering seven tapes stands a kind cluster
  # up and tears it down, so this is a cadence, not a per-push gate.
  push:
    branches: [main]
    paths:
      - "docs/tapes/**"
      - ".github/workflows/demos.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# superseded PR pushes cancel their in-flight run; a dispatch never cancels
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: render color_preview (ubuntu-latest)
    # Hardcoded, not vars.RUNNER_LABEL: this tape wants no backend, so there is
    # nothing to gain from somebody's actual machine and a fork PR would be
    # running unreviewed tape files on it. The docker-backed tapes are the ones
    # that will need the self-hosted label, when they are added.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `path:` input - that would run one tape and skip generate.sh's shim.
      # This step is here for the toolchain only: vhs, plus the ttyd and ffmpeg
      # it shells out to, which the runner image does not carry.
      #
      # `version` is left at the action's default (latest) on purpose, where
      # everything else this repo installs is pinned. A pinned vhs would hide
      # the upstream break this job exists to catch; the supply-chain half of
      # the pin is the action's own SHA above, which dependabot keeps current.
      - name: Install vhs, ttyd and ffmpeg
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          # the tapes render at common.tape's geometry in vhs's default font,
          # so the artifact is only worth looking at if that font is here
          install-fonts: "true"

      - name: Render the backend-free tape
        # --require-run turns a stand-down into a failure: this tape needs no
        # backend, so "skipped" here can only mean the toolchain above did not
        # land, and a green run that rendered nothing is the one outcome this
        # job must not produce.
        run: docs/tapes/generate.sh --require-run color_preview

      # Attached rather than committed, per the note at the top: a GIF is looked
      # at by a person before it lands in the tree, and a PR artifact is where
      # that look happens.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: color-preview-demo
          path: docs/demos/color_preview.gif
          # a review aid for one pull request, not a release artifact
          retention-days: 7
          if-no-files-found: error

  publish:
    name: render every tape but demo (self-hosted)
    # The one machine with docker, podman, nomad and kind on it. A hosted runner
    # can render exactly one of these seven (color_preview, above); the rest
    # stand down without a backend, and --require-run below turns that into the
    # failure it should be rather than a green run that rendered nothing.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Never on a pull request: this runs unreviewed tape files on somebody's
    # actual machine. Pushes to main and manual dispatch only.
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 45
    # one group for the shared self-hosted workspace, as ci.yml's heavy jobs do
    concurrency:
      group: ${{ vars.RUNNER_LABEL && 'hi-selfhosted-workspace' || format('{0}-{1}', github.run_id, github.job) }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The `runs-on` fallback above is a sane degradation everywhere else it
      # appears - coverage, link-check, codeql and the rest all do their job on
      # a hosted runner. Here it is not: six of these seven tapes need docker,
      # podman, nomad or kind, so with vars.RUNNER_LABEL unset this job installs
      # for five minutes and then dies inside vhs, and no line of that log says
      # "the repository variable is missing". Say it here instead, before the
      # first apt call. Failing rather than skipping is deliberate and is
      # --require-run's rule one level up: a render that produced nothing must
      # not read as a green run, because pages.yml serves the last *successful*
      # run's artifact and would go on serving nothing.
      - name: Check this is the self-hosted renderer
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          echo "::error title=RUNNER_LABEL is not set::demos publish needs the self-hosted renderer (docker, podman, nomad, kind) and is running on a GitHub-hosted runner. Set the RUNNER_LABEL repository variable - Settings > Secrets and variables > Actions > Variables - to that machine's runner label. Only color_preview can render here; the other six tapes cannot."
          exit 1

      # hands the persistent self-hosted workspace back to the runner user, so
      # checkout's own cleanup can always finish - see docs/PACKAGING.md
      - name: Reclaim the workspace
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # generate.sh's roster (the top of that file) names what each tape needs,
      # and it is not only the backends: a tape that opens `Set Shell zsh` wants
      # that shell on the *renderer*, and a missing one is a vhs error rather
      # than a clean stand-down. docker, podman, kind and kubectl are what the
      # self-hosted box is for; these three are not, and --require-run below
      # turns each missing one into a failed tape (docker and kube want zsh,
      # podman wants fish, complete wants both fish and nomad).
      #
      # The same three ci.yml's backends job installs, by the same route, for
      # the same machine - neither job may assume the other has run, and apt is
      # idempotent when one has.
      - name: Install zsh, fish and nomad
        run: |
          set -euo pipefail
          # gpg unprivileged, `sudo` only for the write - see the identical
          # step in ci.yml for why `sudo gpg` cannot work in an Actions step
          curl -sSfL https://apt.releases.hashicorp.com/gpg |
            gpg --batch --yes --dearmor |
            sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y zsh fish nomad
          nomad version

      - name: Install vhs, ttyd and ffmpeg
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          install-fonts: "true"

      # Named rather than "everything except demo": generate.sh's roster is
      # ordered on purpose (cheapest first, kube last because tearing its
      # fixture down deletes the kind cluster), and naming the tapes keeps that
      # order. A tape added to the roster has to be added here too, which is the
      # point - it is a decision about whether a machine may render it.
      - name: Render every tape but demo
        run: >-
          docs/tapes/generate.sh --require-run
          color_preview ssh docker podman nomad complete kube

      # The fixtures are torn down by generate.sh between tapes, but a run that
      # died mid-tape leaves the last one up on a machine that persists between
      # jobs. Always, so a failed render still cleans up after itself.
      - name: Take the fixtures down
        if: ${{ always() }}
        run: docs/tapes/generate.sh --down || true

      # pages.yml collects this into the site - see the demos block there. Kept
      # longer than the PR artifact above because the site reads the newest
      # successful run, which may be older than the deploy that wants it (the
      # same shape the coverage badge already uses).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gifs
          # everything this job rendered, and nothing it did not: demo.gif is
          # the committed hand-rendered one and must not ride along as though
          # it were fresh
          path: |
            docs/demos/*.gif
            !docs/demos/demo.gif
          retention-days: 90
          if-no-files-found: error
