name: Demos

# Renders the demo tapes and ships them as an artifact pages.yml serves - for
# a release, weekly, or on dispatch. Never on a pull request: a PR must
# not re-render the packages preview (or any tape) for its own sake, and a
# tape landing on main between releases waits for the next tag or the weekly
# cron rather than re-rendering per push. Nothing is committed back - a bot
# commit on top of the author's is what branch protection refuses. Needs
# docker, podman, nomad, and kind.
#
# Of the eight .tape files, common.tape is the shared include, leaving seven
# renderable tapes. demo.gif is hand-rendered, reviewed by eye, and committed in
# its own commit: it is the one GIF claiming stock defaults, it goes quietly
# wrong when the header, the prompt, or the tape moves, and only a person can
# tell. The other six each
# advertise one feature, which a machine can render honestly, so `publish`
# renders them.
#
# generate.sh rather than vhs directly: `Require hi` in a tape is satisfied by
# *any* hi on $PATH, so a runner with one installed would record the wrong
# tree. generate.sh's preflight puts a shim for this checkout's hi.sh on the
# front of $PATH and tears the fixtures down afterwards.
on:
  # A release is what the published set should actually reflect, prereleases
  # included, since an rc's GIFs are a useful rehearsal of what the release
  # will show - but not off a tag push of its own: release.yml's publish job
  # dispatches this at the tag once the release exists, which is what lets
  # `attach` below find it rather than race it. The weekly run is for
  # changes that move a demo without a release in between (header, prompt,
  # anything in the shipped tree) and keeps the render inside the artifact's 90-day
  # retention. Rendering six of the seven renderable tapes stands a kind
  # cluster up and tears it down: a cadence, not a gate.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# no pull_request trigger, so nothing here ever runs twice for one push
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One runner per tape. The renders are independent - each tape stands its own
  # fixtures up and takes them down - and serially they cost the sum of six
  # renders plus one backend install; in parallel they cost the slowest tape
  # plus that install, paid six times over on six runners. The `run` tape's
  # teardown deletes its kind cluster, which is no reason to order the roster:
  # nothing else is sharing its machine.
  #
  # A tape added to docs/tapes/generate.sh's roster must be added to `tape`
  # below too, deciding whether a hosted runner may render it. `demo` is not
  # here: it is the committed, hand-rendered one.
  render:
    name: render ${{ matrix.tape }}
    # Every one of these six tapes needs docker, podman, nomad, or kind; the
    # hosted runner carries docker and the steps below install the other three
    # (as ci.yml's e2e-backends does). --require-run makes a tape that stands
    # down for a missing backend a failure, never a green run that rendered
    # nothing - pages.yml serves the last *successful* run's artifact, and
    # `collect` below only runs when every tape rendered.
    runs-on: ubuntu-latest
    # the hosted path pays the apt and kind installs on top of one render
    timeout-minutes: 30
    strategy:
      # one tape failing must not cancel the five that would have rendered:
      # the transcripts of the others are what say whether it is that tape or
      # the renderer
      fail-fast: false
      matrix:
        tape: [packages, editors, overlay, colors, complete, run]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The union of every render matrix leg's audit log, plus
          # dl.google.com, which the first blocking run proved is not optional:
          # _ci_apt_drop_vendor_lists removes only sources.list.d/*.list, so
          # the image's deb822 Chrome .sources survives and `apt-get update`
          # still fetches that index - and apt exits 100 when any index fails,
          # which is what ci.yml's test-ubuntu list says in the same words.
          # Blocked, `render colors` went from "1 rendered, 0 failed" under
          # audit to a fixture that never came up and a 312s vhs timeout.
          # Still left out on purpose: Chrome's own telemetry
          # (update.googleapis.com, mtalk.google.com, accounts.google.com,
          # clients2, content-autofill, optimizationguide-pa, www.gstatic.com
          # and www.google.com). None of that is this job's, and if a later run
          # shows one of them is load-bearing too, its own log will name it.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            dl.google.com:443
            deb.debian.org:443
            dl-cdn.alpinelinux.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            quay.io:443
            apt.releases.hashicorp.com:443
            checkpoint-api.hashicorp.com:443
            dl.k8s.io:443
            starship.rs:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # generate.sh's roster (top of that file) names what each tape needs.
      # The backends composite ci.yml's e2e-backends job shares (podman,
      # nomad, and kind with the kubectl it brings for the run and complete
      # tapes) - plus renderer packages: `Set Shell zsh` wants that shell on
      # the *renderer*, and a missing one is a vhs error rather than a clean
      # stand-down, so the shells go in too (editors and run want zsh, overlay
      # and complete want fish) and --require-run turns each missing one into
      # a failed tape. Installed unconditionally rather than per tape: the
      # roster is generate.sh's to state, and a matrix that had to restate it
      # would be a second copy to keep true.
      - uses: $/.github/actions/setup-backends
        with:
          extra-packages: zsh fish

      # v2.1.1 is upstream's newest tag and its own `main` branch is still
      # node20 - not a stale pin, there is no node24 release to move to yet.
      #
      # `version` pinned as well: left unset the action installs whatever vhs
      # tagged last, and the binary is not covered by the SHA above. v0.12.0
      # (2026-09-09 09:50 UTC) reached the 16:07 run that day and every one of
      # the six tapes came back "vhs exited 0 but <gif> was not rewritten" -
      # the renderer is a build input like any other, so it gets a version.
      # Bump it deliberately, after a dispatch run renders all six green.
      - name: Install vhs, ttyd, and ffmpeg
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.11.0
          install-fonts: "true"

      - name: Render ${{ matrix.tape }}
        run: docs/tapes/generate.sh --require-run ${{ matrix.tape }}

      # A run that died mid-tape leaves its fixture up on a machine that
      # persists between jobs; always, so a failed render still cleans up.
      - name: Take the fixtures down
        if: ${{ always() }}
        run: docs/tapes/generate.sh --down || true

      # One GIF per job, named for its tape; `collect` merges them into the
      # single artifact pages.yml reads. Short retention: these are the parts,
      # kept only long enough to debug a run that never reached `collect`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif-${{ matrix.tape }}
          path: docs/tapes/${{ matrix.tape }}.gif
          retention-days: 7
          if-no-files-found: error

  # The six parts as the one artifact pages.yml fetches by name. `needs:` with
  # no status function, so a single failed tape skips this job and the run is
  # not a success - which is what keeps the site on the last render where
  # every GIF was fresh, rather than publishing five new ones beside a stale
  # sixth.
  collect:
    name: collect the GIFs
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Taken from the two steps, not from a log: this job has not run
          # since v0.3.5 (every run since failed in render), and demos.yml
          # carried no harden-runner at all back then, so there is no audit
          # data for it either way. Both steps only move artifacts, which go to
          # the auto-allowed productionresultssa* blobs, so the rows below are
          # the conventional minimum rather than a demonstrated need. The first
          # run that gets this far is the one to take a real list from.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: demo-gif-*
          merge-multiple: true
          path: gifs

      # pages.yml collects this into the site. 90 days because the site reads
      # the newest successful run, which may be older than the deploy that
      # wants it (the coverage badge's shape). demo.gif is never here: it is
      # the committed hand-rendered one and must not ride along as though
      # fresh - no render job produces it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gifs
          path: gifs
          retention-days: 90
          if-no-files-found: error

  # A release's demo: one rendered GIF uploaded to the release as demo.gif
  # and embedded in the body's `demo` slot (.github/scripts/release_slot.sh,
  # which publish's body leaves for it). Only for a run at a tag - release.yml
  # dispatches one per release - and a tag with no release (a dispatch by hand
  # against an old one) warns and attaches nothing. The `release-body-<tag>`
  # group is shared with release.yml's tap job, the body's other writer. The
  # sums predate the upload and do not cover it; the release body says so.
  attach:
    name: attach the demo to the release
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-body-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Taken from the three steps rather than a log: this job is gated on
          # github.ref_type == 'tag', so it has never run on a branch push and
          # no audit log for it exists. Its whole network use is legible - the
          # checkout, artifacts off the auto-allowed blobs, and `gh release
          # upload`, which release.yml's publish job already blocks against the
          # same two hosts. If a tagged run trips on a row, that log is the one
          # to take the real list from.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-gifs
          path: gifs

      # packages: the header's check, the feature the top of README leads with
      - name: Upload and embed the demo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TAPE: packages
          # release.yml's publish job writes `<!-- hi:demo -->`
          RELEASE_SLOT_PREFIX: hi
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning title=demo::no release for $TAG - the demo was not attached"
            exit 0
          fi
          cp "gifs/$TAPE.gif" "$RUNNER_TEMP/demo.gif"
          # shellcheck source=.github/scripts/gh_asset.sh
          source .github/scripts/gh_asset.sh
          _ci_upload_assets "$TAG" "$RUNNER_TEMP/demo.gif"
          .github/scripts/release_slot.sh "$GITHUB_REPOSITORY" "$TAG" demo \
            "![say-hi $TAG: the $TAPE demo]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/demo.gif)"
