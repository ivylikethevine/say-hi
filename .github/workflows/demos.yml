name: Demos

# Renders the demo tapes. `render` proves the docker-only packages tape still
# renders, on every pull request touching a tape, and attaches the GIF for a
# person to look at; `publish` renders every tape but demo on a push to main,
# weekly, or on dispatch, and ships the GIFs as an artifact pages.yml serves.
# Nothing is committed back - a bot commit on top of the author's is what
# branch protection refuses. Needs docker; publish installs podman, nomad, kind.
#
# Of the nine .tape files, common.tape is the shared include, leaving eight
# renderable tapes. demo.gif is hand-rendered, reviewed by eye and committed in
# its own commit: it is the one GIF claiming stock defaults, it goes quietly
# wrong when the header, the prompt or the tape moves, and only a person can
# tell (.github/hooks/demo_staleness.sh says when). The other seven each advertise
# one feature, which a machine can render honestly, so `publish` renders them.
#
# generate.sh rather than vhs directly: `Require hi` in a tape is satisfied by
# *any* hi on $PATH, so a runner with one installed would record the wrong
# tree. generate.sh's preflight puts a shim for this checkout's hi.sh on the
# front of $PATH and tears the fixtures down afterwards.
on:
  pull_request:
    paths:
      - "docs/tapes/**"
      # a re-rendered demo.gif landing beside its tape is not a tape change
      - "!docs/tapes/*.gif"
      - ".github/workflows/demos.yml"
  # What re-renders the published set: a tape landing on main certainly moved a
  # demo; the weekly run is for changes that move one without touching a tape
  # (header, prompt, anything in the shipped tree - .github/hooks/demo_staleness.sh
  # lists them as $_HI_DEMO_INPUTS). Rendering seven of the eight renderable
  # tapes stands a kind cluster up and tears it down: a cadence, not a gate.
  push:
    branches: [main]
    paths:
      - "docs/tapes/**"
      # a re-rendered demo.gif landing beside its tape is not a tape change
      - "!docs/tapes/*.gif"
      - ".github/workflows/demos.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# superseded PR pushes cancel their in-flight run; a dispatch never cancels
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: render packages (ubuntu-latest)
    # No backend needed, so it renders on every pull request, a fork's
    # included; the backend tapes are `publish`'s, which never runs on a PR.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `path:` input - that would run one tape and skip generate.sh's shim;
      # this step is for the toolchain only (vhs, ttyd, ffmpeg). `version` is
      # left at the action's default on purpose: a pinned vhs would hide the
      # upstream break this job exists to catch, and the action's own SHA is
      # the supply-chain half of the pin.
      - name: Install vhs, ttyd and ffmpeg
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          # the tapes render at common.tape's geometry in vhs's default font,
          # so the artifact is only worth looking at if that font is here
          install-fonts: "true"

      - name: Render the docker-only tape
        # --require-run: this tape needs only the docker every hosted runner
        # has, so a stand-down can only mean the toolchain did not land, and a
        # green run that rendered nothing must not happen.
        run: docs/tapes/generate.sh --require-run packages

      # Attached rather than committed: a person looks at a GIF before it lands
      # in the tree, and a PR artifact is where that look happens.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-demo
          path: docs/tapes/packages.gif
          # a review aid for one pull request, not a release artifact
          retention-days: 7
          if-no-files-found: error

  publish:
    name: render every tape but demo
    # Every one of these seven tapes needs docker, podman, nomad or kind; the
    # hosted runner carries docker and the steps below install the other three
    # (as ci.yml's e2e-backends does). --require-run makes a tape that stands
    # down for a missing backend a failure, never a green run that rendered
    # nothing - pages.yml serves the last *successful* run's artifact.
    runs-on: ubuntu-latest
    # Never on a pull request: pushes to main, the weekly cron, dispatch only.
    if: ${{ github.event_name != 'pull_request' }}
    # the hosted path pays the apt and kind installs on top of the render
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # generate.sh's roster (top of that file) names what each tape needs, and
      # not only backends: `Set Shell zsh` wants that shell on the *renderer*,
      # and a missing one is a vhs error rather than a clean stand-down, so the
      # shells go in too (editors and run want zsh, overlay and complete want
      # fish) and --require-run turns each missing one into a failed tape. fzf
      # is here because pick.tape records the picker bare `hi` reaches for
      # first, and `Require fzf` would stand it down on a runner without one.
      # Same packages and route as ci.yml's e2e-backends job: neither job may
      # assume the other ran on the machine, and apt is idempotent when it has.
      - name: Install zsh, fish, fzf, podman and nomad
        run: |
          set -euo pipefail
          # gpg unprivileged, `sudo` only for the write - see the identical
          # step in ci.yml for why `sudo gpg` cannot work in an Actions step
          curl -sSfL https://apt.releases.hashicorp.com/gpg |
            gpg --batch --yes --dearmor |
            sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y zsh fish fzf podman nomad
          nomad version

      # kind, and the kubectl it brings along, for the run and complete tapes
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Install vhs, ttyd and ffmpeg
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          install-fonts: "true"

      # Named rather than "everything except demo": generate.sh's roster is
      # ordered on purpose (cheapest first, run last since its teardown deletes
      # the kind cluster) and naming the tapes keeps it. A tape added to the
      # roster must be added here too, deciding whether a machine may render it.
      - name: Render every tape but demo
        run: >-
          docs/tapes/generate.sh --require-run
          packages editors pick overlay colors complete run

      # A run that died mid-tape leaves its fixture up on a machine that
      # persists between jobs; always, so a failed render still cleans up.
      - name: Take the fixtures down
        if: ${{ always() }}
        run: docs/tapes/generate.sh --down || true

      # pages.yml collects this into the site. Kept longer than the PR artifact
      # because the site reads the newest successful run, which may be older
      # than the deploy that wants it (the coverage badge's shape).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gifs
          # everything this job rendered and nothing else: demo.gif is the
          # committed hand-rendered one and must not ride along as though fresh
          path: |
            docs/tapes/*.gif
            !docs/tapes/demo.gif
          retention-days: 90
          if-no-files-found: error
