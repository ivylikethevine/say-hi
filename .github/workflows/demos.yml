name: Demos

# Renders the demo tapes and ships them as an artifact pages.yml serves - on
# a release tag, weekly, or on dispatch. Never on a pull request: a PR must
# not re-render the packages preview (or any tape) for its own sake, and a
# tape landing on main between releases waits for the next tag or the weekly
# cron rather than re-rendering per push. Nothing is committed back - a bot
# commit on top of the author's is what branch protection refuses. Needs
# docker, podman, nomad and kind.
#
# Of the eight .tape files, common.tape is the shared include, leaving seven
# renderable tapes. demo.gif is hand-rendered, reviewed by eye and committed in
# its own commit: it is the one GIF claiming stock defaults, it goes quietly
# wrong when the header, the prompt or the tape moves, and only a person can
# tell. The other six each
# advertise one feature, which a machine can render honestly, so `publish`
# renders them.
#
# generate.sh rather than vhs directly: `Require hi` in a tape is satisfied by
# *any* hi on $PATH, so a runner with one installed would record the wrong
# tree. generate.sh's preflight puts a shim for this checkout's hi.sh on the
# front of $PATH and tears the fixtures down afterwards.
on:
  # A tag is what the published set should actually reflect - the same v*
  # pattern release.yml matches, prereleases included, since an rc's GIFs are
  # a useful rehearsal of what the release will show. The weekly run is for
  # changes that move a demo without a release in between (header, prompt,
  # anything in the shipped tree) and keeps the render inside the artifact's 90-day
  # retention. Rendering six of the seven renderable tapes stands a kind
  # cluster up and tears it down: a cadence, not a gate.
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# no pull_request trigger, so nothing here ever runs twice for one push
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One runner per tape. The renders are independent - each tape stands its own
  # fixtures up and takes them down - and serially they cost the sum of six
  # renders plus one backend install; in parallel they cost the slowest tape
  # plus that install, paid six times over on six runners. The `run` tape's
  # teardown deletes its kind cluster, which is no reason to order the roster:
  # nothing else is sharing its machine.
  #
  # A tape added to docs/tapes/generate.sh's roster must be added to `tape`
  # below too, deciding whether a hosted runner may render it. `demo` is not
  # here: it is the committed, hand-rendered one.
  render:
    name: render ${{ matrix.tape }}
    # Every one of these six tapes needs docker, podman, nomad or kind; the
    # hosted runner carries docker and the steps below install the other three
    # (as ci.yml's e2e-backends does). --require-run makes a tape that stands
    # down for a missing backend a failure, never a green run that rendered
    # nothing - pages.yml serves the last *successful* run's artifact, and
    # `collect` below only runs when every tape rendered.
    runs-on: ubuntu-latest
    # the hosted path pays the apt and kind installs on top of one render
    timeout-minutes: 30
    strategy:
      # one tape failing must not cancel the five that would have rendered:
      # the transcripts of the others are what say whether it is that tape or
      # the renderer
      fail-fast: false
      matrix:
        tape: [packages, editors, overlay, colors, complete, run]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # generate.sh's roster (top of that file) names what each tape needs.
      # The backends composite ci.yml's e2e-backends job shares (podman,
      # nomad, and kind with the kubectl it brings for the run and complete
      # tapes) - plus renderer packages: `Set Shell zsh` wants that shell on
      # the *renderer*, and a missing one is a vhs error rather than a clean
      # stand-down, so the shells go in too (editors and run want zsh, overlay
      # and complete want fish) and --require-run turns each missing one into
      # a failed tape. Installed unconditionally rather than per tape: the
      # roster is generate.sh's to state, and a matrix that had to restate it
      # would be a second copy to keep true.
      - uses: $/.github/actions/setup-backends
        with:
          extra-packages: zsh fish

      # v2.1.1 is upstream's newest tag and its own `main` branch is still
      # node20 - not a stale pin, there is no node24 release to move to yet.
      #
      # `version` pinned as well: left unset the action installs whatever vhs
      # tagged last, and the binary is not covered by the SHA above. v0.12.0
      # (2026-09-09 09:50 UTC) reached the 16:07 run that day and every one of
      # the six tapes came back "vhs exited 0 but <gif> was not rewritten" -
      # the renderer is a build input like any other, so it gets a version.
      # Bump it deliberately, after a dispatch run renders all six green.
      - name: Install vhs, ttyd and ffmpeg
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.11.0
          install-fonts: "true"

      - name: Render ${{ matrix.tape }}
        run: docs/tapes/generate.sh --require-run ${{ matrix.tape }}

      # A run that died mid-tape leaves its fixture up on a machine that
      # persists between jobs; always, so a failed render still cleans up.
      - name: Take the fixtures down
        if: ${{ always() }}
        run: docs/tapes/generate.sh --down || true

      # One GIF per job, named for its tape; `collect` merges them into the
      # single artifact pages.yml reads. Short retention: these are the parts,
      # kept only long enough to debug a run that never reached `collect`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif-${{ matrix.tape }}
          path: docs/tapes/${{ matrix.tape }}.gif
          retention-days: 7
          if-no-files-found: error

  # The six parts as the one artifact pages.yml fetches by name. `needs:` with
  # no status function, so a single failed tape skips this job and the run is
  # not a success - which is what keeps the site on the last render where
  # every GIF was fresh, rather than publishing five new ones beside a stale
  # sixth.
  collect:
    name: collect the GIFs
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: demo-gif-*
          merge-multiple: true
          path: gifs

      # pages.yml collects this into the site. 90 days because the site reads
      # the newest successful run, which may be older than the deploy that
      # wants it (the coverage badge's shape). demo.gif is never here: it is
      # the committed hand-rendered one and must not ride along as though
      # fresh - no render job produces it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gifs
          path: gifs
          retention-days: 90
          if-no-files-found: error
