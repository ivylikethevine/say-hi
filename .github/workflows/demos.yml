name: Demos

# Renders the demo tapes and ships them as an artifact pages.yml serves - on
# a release tag, weekly, or on dispatch. Never on a pull request: a PR must
# not re-render the packages preview (or any tape) for its own sake, and a
# tape landing on main between releases waits for the next tag or the weekly
# cron rather than re-rendering per push. Nothing is committed back - a bot
# commit on top of the author's is what branch protection refuses. Needs
# docker, podman, nomad and kind.
#
# Of the nine .tape files, common.tape is the shared include, leaving eight
# renderable tapes. demo.gif is hand-rendered, reviewed by eye and committed in
# its own commit: it is the one GIF claiming stock defaults, it goes quietly
# wrong when the header, the prompt or the tape moves, and only a person can
# tell (.github/hooks/demo_staleness.sh says when). The other seven each
# advertise one feature, which a machine can render honestly, so `publish`
# renders them.
#
# generate.sh rather than vhs directly: `Require hi` in a tape is satisfied by
# *any* hi on $PATH, so a runner with one installed would record the wrong
# tree. generate.sh's preflight puts a shim for this checkout's hi.sh on the
# front of $PATH and tears the fixtures down afterwards.
on:
  # A tag is what the published set should actually reflect - the same v*
  # pattern release.yml matches, prereleases included, since an rc's GIFs are
  # a useful rehearsal of what the release will show. The weekly run is for
  # changes that move a demo without a release in between (header, prompt,
  # anything in the shipped tree - .github/hooks/demo_staleness.sh lists them
  # as $_HI_DEMO_INPUTS) and keeps the render inside the artifact's 90-day
  # retention. Rendering seven of the eight renderable tapes stands a kind
  # cluster up and tears it down: a cadence, not a gate.
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# no pull_request trigger, so nothing here ever runs twice for one push
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: render every tape but demo
    # Every one of these seven tapes needs docker, podman, nomad or kind; the
    # hosted runner carries docker and the steps below install the other three
    # (as ci.yml's e2e-backends does). --require-run makes a tape that stands
    # down for a missing backend a failure, never a green run that rendered
    # nothing - pages.yml serves the last *successful* run's artifact.
    runs-on: ubuntu-latest
    # Never on a pull request: a tag push, the weekly cron, dispatch only. No
    # trigger above admits pull_request, but this is the same belt-and-braces
    # guard the other non-PR workflows carry.
    if: ${{ github.event_name != 'pull_request' }}
    # the hosted path pays the apt and kind installs on top of the render
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # generate.sh's roster (top of that file) names what each tape needs, and
      # The backends composite ci.yml's e2e-backends job shares (podman,
      # nomad, and kind with the kubectl it brings for the run and complete
      # tapes) - plus renderer packages: `Set Shell zsh` wants that shell on
      # the *renderer*, and a missing one is a vhs error rather than a clean
      # stand-down, so the shells go in too (editors and run want zsh, overlay
      # and complete want fish) and --require-run turns each missing one into
      # a failed tape. fzf is here because pick.tape records the picker bare
      # `hi` reaches for first, and `Require fzf` would stand it down on a
      # runner without one.
      - uses: $/.github/actions/setup-backends
        with:
          extra-packages: zsh fish fzf

      # v2.1.1 is upstream's newest tag and its own `main` branch is still
      # node20 - not a stale pin, there is no node24 release to move to yet.
      - name: Install vhs, ttyd and ffmpeg
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          install-fonts: "true"

      # Named rather than "everything except demo": generate.sh's roster is
      # ordered on purpose (cheapest first, run last since its teardown deletes
      # the kind cluster) and naming the tapes keeps it. A tape added to the
      # roster must be added here too, deciding whether a machine may render it.
      - name: Render every tape but demo
        run: >-
          docs/tapes/generate.sh --require-run
          packages editors pick overlay colors complete run

      # A run that died mid-tape leaves its fixture up on a machine that
      # persists between jobs; always, so a failed render still cleans up.
      - name: Take the fixtures down
        if: ${{ always() }}
        run: docs/tapes/generate.sh --down || true

      # pages.yml collects this into the site. 90 days because the site reads
      # the newest successful run, which may be older than the deploy that
      # wants it (the coverage badge's shape).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gifs
          # everything this job rendered and nothing else: demo.gif is the
          # committed hand-rendered one and must not ride along as though fresh
          path: |
            docs/tapes/*.gif
            !docs/tapes/demo.gif
          retention-days: 90
          if-no-files-found: error
