name: CodeQL

# CodeQL over the one language here it can read: GitHub Actions. It cannot
# analyse the product - CodeQL has no shell analyser; the bash is covered by
# `--group fast` (docs/TESTING.md). The overlap with zizmor is the point:
# zizmor is the fast gate in ci.yml, CodeQL the slower dataflow pass whose
# findings land in the Security tab with a trace, and Scorecard's SAST check
# counts only this one. Runs on push to main, every PR, weekly and on dispatch.
on:
  push:
    branches: [main]
  # no `paths:` filter, deliberately: Scorecard's SAST check counts completed
  # CodeQL runs on the merged PRs behind the last 30 default-branch commits,
  # and most dev->main PRs touch no workflow file, so a scoped trigger reads
  # as if CodeQL only sometimes existed
  pull_request:
  # the default-branch baseline code scanning diffs a PR against; without it
  # the first PR to touch a workflow has nothing to compare to
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # the SARIF upload, and the workflow definitions being analysed
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `actions` is the whole matrix on purpose (see the header); build-mode
      # none is the only mode it has, there being nothing to compile
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:actions"
