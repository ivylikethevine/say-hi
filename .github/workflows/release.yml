name: Release

# Builds and publishes a release. Runs on a pushed v* tag, or by hand as a
# rehearsal: the dispatch runs the whole build job against a HEAD archive and
# a fake version, and the publish job is hard-gated to tag pushes. Branch
# pushes and PRs are ci.yml's. Needs the `release` environment with a required
# reviewer (docs/PACKAGING.md); APK_SIGNING_KEY, MINISIGN_SECRET_KEY,
# HOMEBREW_TAP_TOKEN and AUR_SSH_KEY are each optional and skip loudly.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: rehearsal version (build only - nothing publishes)
        required: false
        default: "0.0.0"

# read-only by default; only the gated publish job gets write scopes
permissions:
  contents: read

# Serialized, never cancelled: two tags pushed close together would otherwise
# each open a manifest PR against main from the other's base. The wait on
# environment approval does not count against job timeouts.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Dispatch only: a v* tag push skips this and goes straight to build, which
  # keeps the real release unattended, and a rehearsal cannot reach
  # APK_SIGNING_KEY without a named reviewer saying so.
  gate:
    name: approve the rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: manual-dispatch
    steps:
      - run: echo "rehearsal approved for ${{ github.triggering_actor }}"

  # Everything that can fail, nothing that can publish: a tag push runs it
  # unattended so a bad tag is caught before anyone is asked to approve.
  build:
    name: build packages
    needs: gate
    # gate is *skipped* on a tag push, not failed - hence the result check
    # rather than a bare `needs`; `!cancelled()` rather than `always()` so
    # cancelling the run still stops the build
    if: ${{ !cancelled() && needs.gate.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the provenance attestation below needs these two; contents stays read
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      # same pinned upstream binary ci.yml uses - the distro package lags badly
      - uses: ./.github/actions/setup-tool
        with:
          tool: shellcheck

      # Built here rather than fetched: GitHub's auto-generated /archive/
      # tarball is the one released artifact with no signature or attestation,
      # so this builds the same shape (packaging/srctar.sh), ships it as an
      # asset and lets it inherit SHA256SUMS and the provenance below. One
      # code path for tag and rehearsal - only the ref differs - and a
      # rehearsal's sums are never committed.
      - name: Pick the version and build the source tarball
        # via env, never inline ${{ }} in the run block: a crafted dispatch
        # input must stay data (zizmor: template-injection)
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$REHEARSAL_VERSION"
            ref=HEAD
          else
            version="${GITHUB_REF_NAME#v}"
            ref="$GITHUB_REF_NAME"
          fi
          tarball="$RUNNER_TEMP/say-hi-$version.tar.gz"
          packaging/srctar.sh "$version" "$ref" "$tarball"
          echo "HI_VERSION=$version" >>"$GITHUB_ENV"
          echo "HI_TARBALL=$tarball" >>"$GITHUB_ENV"

      # --tarball unconditionally: bump.sh sums the exact bytes built above and
      # uploaded by publish, so the manifests cannot checksum a different one.
      - name: Regenerate the manifests
        run: packaging/bump.sh --tarball "$HI_TARBALL" "$HI_VERSION"

      - name: Verify the result
        run: packaging/bump.sh --check "$HI_VERSION"

      # after the bump, so the packaging drift guards in the fast group run
      # against the manifests this release ships
      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --group fast"

      - name: Run the lint group
        run: "${{ github.workspace }}/tests/test_runner.sh --group lint"

      - uses: ./.github/actions/setup-tool
        with:
          tool: nfpm

      # Absent APK_SIGNING_KEY (forks, before first release) the apk builds
      # unsigned, as a keyless local build does. A plain repo secret, not the
      # release environment: this job is ungated (rehearsals run it) and the
      # key only signs an artifact the gated publish job still has to approve.
      - name: Write the apk signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APK_SIGNING_KEY" ]; then
            printf '%s\n' "$APK_SIGNING_KEY" >"$RUNNER_TEMP/say-hi-apk.rsa"
            chmod 600 "$RUNNER_TEMP/say-hi-apk.rsa"
            echo "HI_APK_KEY=$RUNNER_TEMP/say-hi-apk.rsa" >>"$GITHUB_ENV"
          else
            echo "no APK_SIGNING_KEY secret - the apk will be unsigned"
          fi

      # asserts one artifact per format, adds the source tarball, and writes
      # dist/SHA256SUMS and dist/ARTIFACTS - which is how the tarball reaches
      # the attestation and the upload below without either naming it
      - name: Build the packages
        run: packaging/mkpkg.sh --source-tarball "$HI_TARBALL"

      # read from mkpkg.sh's dist/ARTIFACTS rather than respelled as *.deb
      # *.rpm *.apk here; a multiline output, the shape both actions below take
      - name: List what the release ships
        id: artifacts
        run: |
          set -euo pipefail
          {
            echo 'paths<<HI_ARTIFACTS_EOF'
            sed 's|^|dist/|' dist/ARTIFACTS
            echo 'HI_ARTIFACTS_EOF'
          } >>"$GITHUB_OUTPUT"

      # not a shared list: the artifact, the manifest PR, the tap and the AUR
      # each take a different subset of these five
      - name: Collect the manifests alongside them
        run: |
          set -euo pipefail
          mkdir -p dist/manifests
          cp packaging/aur/say-hi/PKGBUILD dist/manifests/PKGBUILD
          cp packaging/aur/say-hi/.SRCINFO dist/manifests/.SRCINFO
          cp packaging/aur/say-hi-git/PKGBUILD dist/manifests/PKGBUILD.git
          cp packaging/aur/say-hi-git/.SRCINFO dist/manifests/.SRCINFO.git
          cp packaging/homebrew/say-hi.rb dist/manifests/say-hi.rb

      # Signed build provenance for everything the release carries: the sums
      # say what the bytes are, the attestation says which run built them.
      # Check with: gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            ${{ steps.artifacts.outputs.paths }}
            dist/manifests/*
            dist/ARTIFACTS
          if-no-files-found: error

  # The only job that publishes. `environment: release` makes GitHub hold it
  # for a required reviewer - BUT THAT REVIEWER IS A REPO SETTING, NOT THIS
  # FILE: until Settings -> Environments -> "release" -> Required reviewers
  # exists, there is no gate and this job runs unattended. See
  # docs/PACKAGING.md.
  publish:
    name: publish to the release (manual approval)
    needs: build
    # hard gate on top of the environment: a rehearsal dispatch must never
    # publish, however the environment happens to be configured
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - uses: ./.github/actions/setup-tool
        with:
          tool: minisign

      # The offline half of verification: the attestation needs gh and GitHub,
      # a detached minisign signature over SHA256SUMS verifies with one static
      # public key (in the README) and no network. The secret is sealed to
      # this environment, behind the gate, unlike the apk key. Generated with
      # `minisign -G -W` - no password, nobody is at this terminal to type
      # one. Absent, the release ships unsigned sums, loudly.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            printf '%s\n' "$MINISIGN_SECRET_KEY" >"$RUNNER_TEMP/minisign.key"
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS \
              -t "say-hi $GITHUB_REF_NAME"
          else
            echo "no MINISIGN_SECRET_KEY secret - SHA256SUMS ships unsigned"
          fi

      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Body: what changed, then how to check it. The notes are generated
          # because docs/ROADMAP.md deletes finished entries and this is where
          # the git-history ledger gets published. Asked for via the API and
          # composed here rather than --generate-notes plus --notes, which
          # would put the checklist first: gh appends generated notes *after*
          # --notes.
          notes="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body 2>/dev/null || true)"
          [ -n "$notes" ] || notes="_Release notes could not be generated for this tag._"
          # The checklist: each command is the one docs/PACKAGING.md documents
          # under "Verifying a release download", and the public key is read
          # out of that file so a second literal copy cannot drift.
          pubkey="$(sed -n "s/^minisign -Vm SHA256SUMS -P '\([^']*\)'.*/\1/p" \
            docs/PACKAGING.md | head -n1)"
          [ -n "$pubkey" ] ||
            { echo "no minisign public key in docs/PACKAGING.md - did that section move?" >&2; exit 1; }
          # advertise the signature check only when a signature shipped: the
          # signing step above no-ops without MINISIGN_SECRET_KEY
          if [ -f dist/SHA256SUMS.minisig ]; then
            sigline="minisign -Vm SHA256SUMS -P '$pubkey'"
          else
            sigline="# SHA256SUMS is unsigned for this release - no minisign check"
          fi
          # printf rather than a heredoc: a heredoc body would have to be
          # unindented, which ends the YAML block scalar
          body="$(printf '%s\n' \
            "$notes" \
            "" \
            "## Verifying this download" \
            "" \
            "The sums cover every file here, the source tarball included." \
            "" \
            '```sh' \
            "sha256sum -c --ignore-missing SHA256SUMS" \
            "$sigline" \
            "gh attestation verify say-hi_*_all.deb --repo $GITHUB_REPOSITORY" \
            '```' \
            "" \
            "Full runbook: [docs/PACKAGING.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/PACKAGING.md#verifying-a-release-download)")"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$body"
          # the manifests ride along so updating the AUR and the tap is a copy,
          # not a re-derivation; read line by line, not mapfile (bash 4)
          files=()
          while IFS= read -r f; do files+=("dist/$f"); done <dist/ARTIFACTS
          files+=(dist/manifests/*)
          [ -f dist/SHA256SUMS.minisig ] && files+=(dist/SHA256SUMS.minisig)
          gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"

      # The regenerated manifests come back here, after the human gate, so the
      # tag stays put: they are consumed from the AUR/tap repos, not from the
      # tarball. A PR, not a direct push: `main` requires one. Nothing waits on
      # the merge - the tap and aur jobs read the manifests out of the
      # `packages` artifact; the PR only keeps the in-repo copy current for the
      # next release to diff against.
      #
      # the one checkout that keeps its credentials: the step below pushes a
      # branch with them (every other checkout sets persist-credentials: false)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: main
          path: main

      - name: Open the manifest PR against main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp dist/manifests/PKGBUILD main/packaging/aur/say-hi/PKGBUILD
          cp dist/manifests/.SRCINFO main/packaging/aur/say-hi/.SRCINFO
          cp dist/manifests/say-hi.rb main/packaging/homebrew/say-hi.rb
          cd main
          if git diff --quiet; then
            echo "manifests already current on main - nothing to open"
            exit 0
          fi
          branch="manifests-$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packaging/aur/say-hi/PKGBUILD packaging/aur/say-hi/.SRCINFO packaging/homebrew/say-hi.rb
          git commit -m "packaging: manifests for $GITHUB_REF_NAME"
          git push origin "$branch"
          # printf rather than a heredoc: a heredoc body would have to be
          # unindented, which ends the YAML block scalar
          body="$(printf '%s\n' \
            "Regenerated packaging manifests for say-hi $GITHUB_REF_NAME." \
            "" \
            "Opened by the release workflow after the publish gate. The packages" \
            "and the tap/AUR jobs read these from the release artifact, so" \
            "nothing is waiting on this merge - it keeps the in-repo copy" \
            "current for the next release to diff against.")"
          gh pr create --head "$branch" --base main \
            --title "packaging: manifests for $GITHUB_REF_NAME" --body "$body"

  # Copies one formula into the tap repo, behind the same human gate
  # (`environment: release`, `needs: publish`): what was approved above is
  # exactly what lands here. A PR, not a direct push: a tap has no review of
  # its own, so the PR is where the `brew` job's verdict (below) gets read
  # before the formula goes live. Every step no-ops loudly without
  # HOMEBREW_TAP_TOKEN, so this can land before the tap repo exists. See
  # docs/PACKAGING.md.
  tap:
    name: open a PR against the Homebrew tap
    needs: publish
    # never on a v0.0.x tag: those are debug tags, pushed to exercise the
    # release path rather than to ship. A missing token would skip this too,
    # but that is a fact about which secrets exist; this line is the promise.
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'v0.0.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Open the formula PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no HOMEBREW_TAP_TOKEN secret - the tap formula was NOT updated;"
            echo "copy dist/manifests/say-hi.rb to Formula/say-hi.rb by hand (docs/PACKAGING.md)"
            exit 0
          fi
          branch="say-hi-$GITHUB_REF_NAME"
          gh repo clone "$TAP_REPO" tap -- --depth 1
          cd tap
          git checkout -b "$branch"
          mkdir -p Formula
          cp ../dist/manifests/say-hi.rb Formula/say-hi.rb
          if git diff --quiet; then
            echo "tap formula already current - nothing to open"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "say-hi $GITHUB_REF_NAME"
          git push origin "$branch"
          # The checklist rides in the body: the `brew` job ran the same three
          # commands on a hosted mac against this tarball, so the boxes are for
          # a reviewer confirming that run. printf rather than a heredoc: a
          # heredoc body would have to be unindented, which ends the YAML
          # block scalar.
          # shellcheck disable=SC2016 # the backticks are markdown, not substitution
          body="$(printf '%s\n' \
            "Formula for say-hi $GITHUB_REF_NAME, generated by the release workflow." \
            "" \
            "The release workflow's \`brew\` job ran these on a hosted mac; confirm from one of your own before merging:" \
            "" \
            '- [ ] `brew install --build-from-source Formula/say-hi.rb`' \
            '- [ ] `brew test say-hi`' \
            '- [ ] `brew audit --strict --new say-hi`')"
          gh pr create --repo "$TAP_REPO" --head "$branch" \
            --title "say-hi $GITHUB_REF_NAME" --body "$body"

  # A plain git push over ssh - the AUR has no PR mechanism - so the safety is
  # the gate above (`needs: publish`, the same `release` environment) plus
  # pushing exactly the two files the build job regenerated and the packaging
  # suite checked. Deliberately does NOT run namcap (it needs an Arch box, so
  # each package's first push is still a manual, namcap'd one -
  # docs/PACKAGING.md) and does NOT touch say-hi-git (it builds from `main`
  # and has no version to bump). No secret, no push: it prints what to copy
  # and exits 0, as the tap job does.
  aur:
    name: push the AUR package
    needs: publish
    # a v0.0.x debug tag reaches no external channel, on the tap job's
    # reasoning above
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'v0.0.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Push PKGBUILD and .SRCINFO to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "no AUR_SSH_KEY secret - the AUR package was NOT updated;"
            echo "copy dist/manifests/PKGBUILD and .SRCINFO to the aur/say-hi repo by hand,"
            echo "after running the namcap gate in docs/PACKAGING.md"
            exit 0
          fi
          # the key never touches the workspace: $RUNNER_TEMP is outside it, and
          # the host key is pinned by keyscan rather than accepted on first use
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$AUR_SSH_KEY" >"$RUNNER_TEMP/ssh/aur"
          chmod 600 "$RUNNER_TEMP/ssh/aur"
          ssh-keyscan -t ed25519 aur.archlinux.org >"$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"

          git clone --depth 1 ssh://aur@aur.archlinux.org/say-hi.git aur
          cp dist/manifests/PKGBUILD aur/PKGBUILD
          cp dist/manifests/.SRCINFO aur/.SRCINFO
          cd aur
          # only those two files are ever tracked in an AUR repo: a stray file
          # pushed there is a package that fails to build for everyone
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "refusing to push: the AUR checkout has untracked files" >&2
            git status --short >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "AUR package already current - nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "say-hi $GITHUB_REF_NAME"
          git push origin master

  # The devcontainer Feature, published to ghcr as an OCI artifact behind the
  # same gate and v0.0.x skip as the channels above. Its version is not the
  # release's: devcontainer-feature.json carries its own `version`, the
  # registry refuses a re-push of one, and the say-hi it installs is chosen by
  # its `version` option at container-build time - so it needs no bump.sh
  # pass. No secret to skip on: ghcr takes the workflow's own GITHUB_TOKEN, so
  # `packages: write` is all it wants. See docs/PACKAGING.md's devcontainer
  # Feature section.
  feature:
    name: publish the devcontainer Feature to ghcr
    needs: publish
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'v0.0.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          publish-features: "true"
          base-path-to-features: packaging/devcontainer/src
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The three commands docs/PACKAGING.md's "Homebrew tap" section asks for by
  # hand before a tap PR is merged, run on a hosted mac against the tarball
  # just published - the formula's url points at the release asset, which is
  # why this waits on publish and never runs for a rehearsal. It gates
  # nothing: the tap job opens its PR either way, so a red audit here is read
  # on that PR rather than holding the release back.
  #
  # `brew audit` refuses a path and wants a *named* formula in a tap, hence
  # the throwaway local tap; --new on top of --strict is what a first
  # submission gets. Two findings are expected while the repository is private
  # (the homepage 404 and the HEAD URL not resolving - PACKAGING.md records the
  # run) and are filtered before the verdict; anything else is real.
  brew:
    name: brew install, test and audit the formula (macOS)
    needs: publish
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'v0.0.')
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Put the formula in a throwaway tap
        env:
          TAP: ${{ github.repository_owner }}/tap
        run: |
          set -euo pipefail
          brew tap-new --no-git "$TAP"
          cp dist/manifests/say-hi.rb "$(brew --repository "$TAP")/Formula/say-hi.rb"

      - name: brew install --build-from-source
        env:
          TAP: ${{ github.repository_owner }}/tap
        run: brew install --build-from-source "$TAP/say-hi"

      - name: brew test
        run: brew test say-hi

      # || true on the audit and the verdict read afterwards (hadolint's shape
      # in ci.yml): the two expected lines are filtered out before the exit
      # status means anything
      - id: audit
        name: brew audit --strict --new
        env:
          TAP: ${{ github.repository_owner }}/tap
        run: |
          set -euo pipefail
          brew audit --strict --new "$TAP/say-hi" >"$RUNNER_TEMP/audit.out" 2>&1 || true
          cat "$RUNNER_TEMP/audit.out"
          grep -vE 'homepage URL .* is not reachable|HEAD: The URL .* is not a valid Git URL|^say-hi$|^ *$|^Error: [0-9]+ problems? in 1 formula' \
            "$RUNNER_TEMP/audit.out" >"$RUNNER_TEMP/audit.real" || true
          if [ -s "$RUNNER_TEMP/audit.real" ]; then
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            echo "found=0" >>"$GITHUB_OUTPUT"
          fi

      - name: Report the verdict
        env:
          FOUND: ${{ steps.audit.outputs.found }}
        run: |
          set -euo pipefail
          {
            echo "### brew audit --strict --new"
            echo
            if [ "$FOUND" = 1 ]; then
              echo "Findings beyond the two expected while the repo is private:"
              echo
              echo '```'
              cat "$RUNNER_TEMP/audit.real"
              echo '```'
            else
              echo "Clean, apart from the two findings PACKAGING.md expects while the repo is private."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$FOUND" = 1 ]; then
            echo "::error title=brew audit::the formula has audit findings - see the step summary and the tap PR"
            exit 1
          fi
