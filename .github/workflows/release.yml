name: Release

# Builds and publishes a release. Runs on a pushed v* tag, or by hand as a
# rehearsal: the dispatch runs the whole build job against a HEAD archive and
# a fake version, and the publish job is hard-gated to tag pushes. A
# prerelease tag (a `-` in the name, v1.0.0-rc.1) is a GitHub Release only:
# marked as a prerelease and never Latest, no Pages refresh, no brew/tap job,
# and publish-external.yml's AUR job refuses it. Branch pushes and PRs
# are ci.yml's. Needs the `release` environment, which seals
# MINISIGN_SECRET_KEY, APK_SIGNING_KEY, and GPG_SIGNING_KEY (docs/RELEASING.md)
# - no required reviewer on it: the gates are the tag protection rule and the
# `gate` job (a tag publishes only once it is signed by a key in
# .github/allowed_signers, sits on main, and CI went green on its commit). The
# three keys are each optional and skip loudly. The AUR push is not here -
# publish-external.yml reaches it, by a separate manual dispatch against an
# already-published tag, and holds AUR_SSH_KEY. The
# manifests it builds (dist/manifests/) are release assets only - the
# committed packaging/aur and packaging/homebrew files stay permanent
# templates (packaging/bump.sh's header) and this workflow never writes to
# main.
#
# Every job below `gate` names its `needs` result in its `if`: a job-level
# `if` with no status function gets an implicit success() that looks at the
# whole needs chain - a skipped ancestor two jobs up skips everything under
# it, with the run still green.
#
# Every job starts with harden-runner: `audit` records egress, and the two
# jobs that write outside the run (publish, tap) run `block` with an
# allowlist.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: rehearsal version (build only - nothing publishes)
        required: false
        default: "0.0.0"

# read-only by default; only the gated publish job gets write scopes
permissions:
  contents: read

# Serialized, never cancelled: two tags racing through publish would dispatch
# pages.yml (below) out of order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every release starts here. A tag push publishes only a well-formed tag,
  # signed by a key in .github/allowed_signers, on a commit CI already took
  # green on main: the tag protection rule says who may release, this says
  # what. A dispatch rehearsal (a branch HEAD, publishing nothing) skips those
  # checks and waits on the `manual-dispatch` environment instead, so it
  # cannot start a build without a named reviewer saying so. One job for both
  # events keeps build's single `needs:`; the environment is picked per event
  # because it is job-level, and an empty name is no environment - a tag push
  # stays unattended. A rejected rehearsal fails the job, and build's
  # `== 'success'` stops there.
  gate:
    name: gate the release (signed tag, on main, green CI)
    runs-on: ubuntu-latest
    # long enough to wait out a CI run still going when the tag was pushed
    # (its slowest jobs are the ~30-minute macOS and Windows ones)
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && 'manual-dispatch' || '' }}
    permissions:
      actions: read # the CI run lookup
      contents: read # the checkout and the compare call
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Off this job's own audit log, and it reaches nothing else: the gate
          # only reads the tag, the branch and CI's conclusion through the API.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: The rehearsal was approved
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: echo "rehearsal approved for $ACTOR"

      # vMAJOR.MINOR.PATCH with an optional -prerelease: the version build
      # derives from the tag has to be one nfpm, bump.sh, and the manifests
      # all read the same way
      - name: The tag is a release version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Release refused::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      # the commit must be on main, not only tagged: main's CI run is the
      # one looked up below, a tag on a side branch has none to find, and the
      # allowed_signers file the signature check reads is main's
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          echo "main...$GITHUB_SHA: $status"
          case "$status" in
          identical | behind) ;;
          *)
            echo "::error title=Release refused::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
            ;;
          esac

      # checkout fetches a tag push by its ref (+refs/tags/<tag>:refs/tags/<tag>),
      # so the annotated tag object and its signature arrive with the commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      # Tags are SSH-signed (git's gpg.format=ssh), so the trust root is an
      # allowed_signers file rather than a keyring. Only the committed file
      # counts: the global and system git configs are ignored, and a
      # lightweight or unsigned tag fails `git tag -v` outright.
      - name: The tag is signed by a release key
        if: github.event_name == 'push'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set -euo pipefail
          type="$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")"
          [ "$type" = tag ] || {
            echo "::error title=Release refused::$GITHUB_REF_NAME is a lightweight tag - cut a signed one (git tag -s)"
            exit 1
          }
          git -c gpg.ssh.allowedSignersFile=.github/allowed_signers tag -v "$GITHUB_REF_NAME" || {
            echo "::error title=Release refused::$GITHUB_REF_NAME is not signed by a key in .github/allowed_signers"
            exit 1
          }

      # CI's push run for exactly this commit, newest first. A push whose
      # tree already went green on its PR concludes success too (ci.yml's
      # carry-forward), and only a green PR run is ever carried forward.
      # Still running: wait for it. Not there after a few minutes (a tag
      # pushed with main can beat its run into existence): the tag landed on
      # a commit CI never ran for, one inside a multi-commit push - refused.
      - name: CI concluded success for the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=0
          while :; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | [.status, (.conclusion // "none"), .html_url] | @tsv')"
            if [ -z "$run" ]; then
              missing=$((missing + 1))
              if [ "$missing" -ge 5 ]; then
                echo "::error title=Release refused::no CI push run on main for $GITHUB_SHA"
                exit 1
              fi
              sleep 60
              continue
            fi
            # "none" rather than empty while running: a tab is IFS whitespace,
            # so an empty field would shift the url into $conclusion
            IFS=$'\t' read -r status conclusion url <<<"$run"
            echo "CI $status ($conclusion): $url"
            [ "$status" = completed ] && break
            sleep 60
          done
          [ "$conclusion" = success ] || {
            echo "::error title=Release refused::CI concluded $conclusion for $GITHUB_SHA - fix main and cut a new tag"
            exit 1
          }

  # Everything that can fail, nothing that can publish: a bad tag fails here,
  # before publish touches the release.
  #
  # `environment: release` on a tag push only: APK_SIGNING_KEY and
  # GPG_SIGNING_KEY are sealed there, and its deployment-tags rule (`v*`)
  # would refuse a rehearsal's branch ref. An empty name is no environment, so
  # a rehearsal builds with neither key - unsigned apk and rpm, both skipping
  # loudly - while ci.yml's packaging-smoke keeps the signed shape covered
  # with throwaway keys.
  build:
    name: build packages
    needs: gate
    # gate is the verdict for both events - the explicit result, per the
    # header; `!cancelled()` rather than `always()` so cancelling the run
    # still stops the build
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    # the provenance attestation below needs these two; contents stays read
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      debug: ${{ steps.tag.outputs.debug }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Off the v0.4.2 run's audit log. Artifact upload needs no row of its
          # own: harden-runner auto-allows the productionresultssa* blobs it
          # goes to, as coverage.yml's blocking shards showed. The
          # run-actions-N-azure-REGION host this job's audit log also named is
          # something else - if a future run trips on it, this row set is wrong
          # and the job goes back to audit rather than growing a row that
          # rotates. tuf-repo-cdn.sigstore.dev is belt and braces: the run read
          # here signed off an embedded TUF root, and a cold one would not.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            dl.google.com:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # classified once, read by publish's Pages refresh and by brew/tap
      # below instead of each re-deriving its own contains/startsWith guard.
      # $GITHUB_REF_NAME on a workflow_dispatch rehearsal is whatever branch
      # dispatched it, never a tag - harmless, since every consumer already
      # requires `github.event_name == 'push'` before it looks at either flag.
      - id: tag
        run: |
          set -eu
          prerelease=false debug=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          case "$GITHUB_REF_NAME" in v0.0.*) debug=true ;; esac
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          echo "debug=$debug" >>"$GITHUB_OUTPUT"

      # neovim and emacs-nox: tools_test.sh lints the shipped rcs with both,
      # same as ci.yml's lint job - --require-run below turns a missing one
      # into a failure rather than a quiet skip
      - uses: $/.github/actions/setup-shells
        with:
          extra-packages: neovim emacs-nox

      # the same tools ci.yml's lint job pins, and for the same reason: without
      # them the tag build's "Run the lint group" below runs shellcheck alone,
      # with shfmt, checkbashisms, mandoc, and typos skipping for want of a binary.
      # lychee too, though nothing here runs it: the list is the cache key, so
      # keeping it identical (same order) to ci.yml's reuses that job's cache
      - uses: $/.github/actions/setup-tools
        with:
          tools: shellcheck shfmt checkbashisms mandoc typos lychee

      # Built here rather than fetched: GitHub's auto-generated /archive/
      # tarball is the one released artifact with no signature or attestation,
      # so this builds the same shape (packaging/srctar.sh), ships it as an
      # asset and lets it inherit SHA256SUMS and the provenance below. One
      # code path for tag and rehearsal - only the ref differs - and a
      # rehearsal's sums are never committed.
      - name: Pick the version and build the source tarball
        # via env, never inline ${{ }} in the run block: a crafted dispatch
        # input must stay data (zizmor: template-injection)
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$REHEARSAL_VERSION"
            ref=HEAD
          else
            version="${GITHUB_REF_NAME#v}"
            ref="$GITHUB_REF_NAME"
          fi
          tarball="$RUNNER_TEMP/say-hi-$version.tar.gz"
          packaging/srctar.sh "$version" "$ref" "$tarball"
          echo "HI_VERSION=$version" >>"$GITHUB_ENV"
          echo "HI_TARBALL=$tarball" >>"$GITHUB_ENV"

      # --tarball unconditionally: bump.sh sums the exact bytes built above and
      # uploaded by publish, so the manifests cannot checksum a different one.
      - name: Regenerate the manifests
        run: packaging/bump.sh --tarball "$HI_TARBALL" "$HI_VERSION"

      - name: Verify the result
        run: packaging/bump.sh --check "$HI_VERSION"

      # after the bump, so the packaging drift guards in the fast group run
      # against the manifests this release ships
      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --group fast"

      # markdownlint-cli2 and prettier, as ci.yml's lint job installs them -
      # without these, --require-run below fails on their skips. No npm cache:
      # a tag build should not restore state a branch run could have written
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install the pinned Markdown tools
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      - name: Run the lint group
        run: "${{ github.workspace }}/tests/test_runner.sh --group lint --require-run"

      - uses: $/.github/actions/setup-tools
        with:
          tools: nfpm

      # Absent APK_SIGNING_KEY (forks, before first release, and every
      # rehearsal - the job's environment comment says why) the apk builds
      # unsigned, as a keyless local build does.
      - name: Write the apk signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APK_SIGNING_KEY" ]; then
            echo "no APK_SIGNING_KEY secret - the apk will be unsigned"
            exit 0
          fi
          # the committed public half is what the runbook tells Alpine users
          # to trust and what mkrepo.sh serves; packaging/lib.sh's
          # verify_signing_key is the one implementation of "the secret is
          # the key the committed public half names"
          source packaging/lib.sh
          write_key "$RUNNER_TEMP/say-hi-apk.rsa" "$APK_SIGNING_KEY"
          verify_signing_key rsa "$RUNNER_TEMP/say-hi-apk.rsa" packaging/apk/say-hi.rsa.pub || {
            echo "::error title=APK_SIGNING_KEY::the secret is not the key packaging/apk/say-hi.rsa.pub is the public half of"
            exit 1
          }
          echo "HI_APK_KEY=$RUNNER_TEMP/say-hi-apk.rsa" >>"$GITHUB_ENV"

      # The GPG key that signs the rpm here (nfpm, via HI_GPG_KEY) and, in
      # publish, the package repository's indexes - sealed to the release
      # environment like the apk key. Its fingerprint has to match the
      # committed public half, packaging/gpg/say-hi.asc - the key every apt and
      # dnf client is told to trust (docs/RELEASING.md's _Package repository_).
      # Absent, the rpm builds unsigned and publish ships no repository, both
      # loudly.
      - name: Write the GPG signing key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "no GPG_SIGNING_KEY secret - the rpm builds unsigned and no package repository is published"
            exit 0
          fi
          # packaging/lib.sh's verify_signing_key is the one implementation
          # of this check, shared with mkrepo.sh's gpg_setup; its own stderr
          # names which half is missing or mismatched
          source packaging/lib.sh
          write_key "$RUNNER_TEMP/say-hi.gpg.key" "$GPG_SIGNING_KEY"
          fpr="$(verify_signing_key gpg "$RUNNER_TEMP/say-hi.gpg.key" packaging/gpg/say-hi.asc)" || {
            echo "::error title=GPG_SIGNING_KEY::the secret is not the key packaging/gpg/say-hi.asc names - the log line above has the detail"
            exit 1
          }
          echo "HI_GPG_KEY=$RUNNER_TEMP/say-hi.gpg.key" >>"$GITHUB_ENV"
          echo "signing the rpm with $fpr"

      # asserts one artifact per format, adds the source tarball, and writes
      # dist/SHA256SUMS and dist/ARTIFACTS - which is how the tarball reaches
      # the attestation and the upload below without either naming it
      - name: Build the packages
        run: packaging/mkpkg.sh --source-tarball "$HI_TARBALL"

      # read from mkpkg.sh's dist/ARTIFACTS rather than respelled as *.deb
      # *.rpm *.apk here; a multiline output, the shape both actions below take
      - name: List what the release ships
        id: artifacts
        run: |
          set -euo pipefail
          {
            echo 'paths<<HI_ARTIFACTS_EOF'
            sed 's|^|dist/|' dist/ARTIFACTS
            echo 'HI_ARTIFACTS_EOF'
          } >>"$GITHUB_OUTPUT"

      # not a shared list: the release upload and publish-external.yml's
      # later `gh release download` each take a different subset of these
      # three. say-hi-git has no version to bump and nothing to publish per
      # release (packaging/aur/say-hi-git derives pkgver() from main itself),
      # so its PKGBUILD/.SRCINFO never rode along here.
      - name: Collect the manifests alongside them
        run: |
          set -euo pipefail
          mkdir -p dist/manifests
          cp packaging/aur/say-hi/PKGBUILD dist/manifests/PKGBUILD
          # SRCINFO, not .SRCINFO: GitHub refuses a release asset name that
          # starts with a dot and stores it as `default.SRCINFO`, which
          # publish-external.yml's `--pattern .SRCINFO` then matched nothing
          # of. It gets its dot back at the cp into the AUR checkout.
          cp packaging/aur/say-hi/.SRCINFO dist/manifests/SRCINFO
          cp packaging/homebrew/say-hi.rb dist/manifests/say-hi.rb

      # Signed build provenance for everything the release carries: the sums
      # say what the bytes are, the attestation says which run built them.
      # Check with: gh attestation verify <file> --repo <owner>/<repo>
      # actions/attest-build-provenance is a wrapper over actions/attest as of
      # v4 - called directly instead, carrying over the header-size bump the
      # wrapper set on its inner step.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      # What's in the box: a project with no package.json/Cargo.toml/go.mod
      # (say-hi vendors nothing - README's own claim) gets a near-empty SBOM,
      # which is itself the useful, accurate answer rather than a reason to
      # skip generating one. Scans the checkout, not a staged/packaged tree:
      # every channel installs the same shell scripts, so one SBOM over the
      # source describes them all. Uploads disabled - dist/say-hi.spdx.json
      # rides the packages artifact below and publish's own upload instead,
      # the same one-place-uploads-it shape as SHA256SUMS.minisig.
      - name: Generate an SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/say-hi.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # actions/attest-sbom is deprecated in favor of actions/attest (its own
      # v4 wrapper prints a warning saying so); called directly instead.
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}
          sbom-path: dist/say-hi.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            ${{ steps.artifacts.outputs.paths }}
            dist/manifests/*
            dist/ARTIFACTS
            dist/say-hi.spdx.json
          # kept though dist/manifests/ no longer holds a dotfile: the
          # action drops hidden files by default, and a path list that
          # grows one again should not fail two jobs later, in publish
          include-hidden-files: true
          if-no-files-found: error

  # The only job that publishes. It runs unattended: the gate is the tag
  # protection rule (only someone who can push a v* tag can start a release),
  # not a person clicking approve. `environment: release` stays because
  # the signing keys are sealed to it, and because its
  # deployment-tags rule (`v*`) keeps the job to tag refs - a repo setting,
  # not this file. See docs/RELEASING.md.
  publish:
    name: publish to the release
    needs: build
    # hard gate on top of the environment: a rehearsal dispatch must never
    # publish, however the environment happens to be configured. The explicit
    # build result rather than a bare event check: the implicit success()
    # reads the whole needs chain, and a skipped job anywhere above silently
    # skips this one (v0.0.1-rc and v0.0.2-rc.1 shipped no packages that way,
    # when `gate` ran on dispatches only).
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # 20, not 15: the assets go up one at a time now (gh_asset.sh), and a
    # run where several need their retries spends a couple of minutes
    # sleeping on top of mkrepo.sh's image pulls and three repo builds
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      # dispatches pages.yml and demos.yml (the last two steps)
      actions: write
      # release_notes.sh reads each merged PR's body for its `## Release note`
      pull-requests: read
      # gh attestation download, below - reads what build's attest steps wrote
      attestations: read
    # relayed rather than read straight off `build` by brew/tap below - each
    # job under the gate keeps a single `needs:` entry, which is what lets
    # test_release_jobs_under_the_gate_check_their_needs read every job's
    # `if:` the same simple way
    outputs:
      prerelease: ${{ needs.build.outputs.prerelease }}
      debug: ${{ needs.build.outputs.debug }}
    steps:
      # block, not audit: the one job holding the signing keys and a
      # contents: write token talks only to these - checkout and gh (github,
      # api, uploads); setup-tools' minisign download (objects,
      # release-assets); gh attestation download's bundle (tmaproduction);
      # mkrepo.sh's image pulls (the docker hosts) and the package installs
      # inside them (debian, alpine). GitHub's runner, artifact, and cache
      # hosts are the agent's implicit allowlist. Read off the steps, not a
      # recorded run: tighten or extend it from a release's harden-runner
      # insights (the run summary links them), not by guessing.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            deb.debian.org:80
            deb.debian.org:443
            dl-cdn.alpinelinux.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - uses: $/.github/actions/setup-tools
        with:
          tools: minisign

      # The offline half of verification: the attestation needs gh and GitHub,
      # a detached minisign signature over SHA256SUMS verifies with one static
      # public key (in docs/PACKAGING.md) and no network. The secret is sealed to
      # this environment, and only this job reads it. Generated with
      # `minisign -G -W` - no password, nobody is at this terminal to type
      # one. Absent, the release ships unsigned sums, loudly.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            source packaging/lib.sh
            write_key "$RUNNER_TEMP/minisign.key" "$MINISIGN_SECRET_KEY"
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS \
              -t "say-hi $GITHUB_REF_NAME"
          else
            echo "no MINISIGN_SECRET_KEY secret - SHA256SUMS ships unsigned"
          fi

      # The tag's own test count and coverage, frozen into the body as static
      # badges. README's three badges read the newest green run of main and
      # drift with it; a release should say what it was cut at. Looked up by
      # this commit's sha (a workflow_run-triggered coverage run carries the
      # triggering push's), and a figure that is not there - Coverage still
      # running, an artifact past its retention - is a grey "unknown",
      # never a failed release.
      - uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: ci.yml
          artifact-name: tests
          dest-subdir: badge-tests
          head-sha: ${{ github.sha }}
          found-message: "tests totals from CI run"
          missing-message: "no green CI run for this commit - the tests badge reads unknown"
          warn-on-missing: "true"

      # one lookup, both figures
      - uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: "{coverage-pct,coverage-v2-pct}"
          dest-subdir: badge-coverage
          head-sha: ${{ github.sha }}
          event: workflow_run
          found-message: "coverage figures from Coverage run"
          missing-message: "no green Coverage run for this commit - the coverage badges read unknown"
          warn-on-missing: "true"

      # totals is one line, "passed failed skipped selected"
      # (test_runner.sh --totals-file); each pct file is one number.
      - name: Freeze the badge figures
        run: |
          set -euo pipefail
          badge() { printf 'https://img.shields.io/badge/%s-%s-%s' "$1" "$2" "$3"; }
          # pct_ok (.github/scripts/pct_ok.sh, shared with pages.yml and
          # coverage.yml's PR comment): a figure that is all zeros is not a
          # measurement, it is what kcov's merge writes when it resolves no
          # sources ("files": [], 0.00) - coverage.yml's gather job refuses to
          # publish one, but an older pct artifact can still carry it, and a
          # frozen 0.00% in a release body reads as true where grey "unknown"
          # reads as what it is. The same refusal, at the consumer.
          # shellcheck source=.github/scripts/pct_ok.sh
          source .github/scripts/pct_ok.sh
          tests=unknown tcolor=lightgrey kcov=unknown kcolor=lightgrey bashcov=unknown bcolor=lightgrey
          if [ -f "$RUNNER_TEMP/badge-tests/totals" ]; then
            read -r passed _ _ _ <"$RUNNER_TEMP/badge-tests/totals" || true
            case "$passed" in '' | *[!0-9]*) ;; *) tests="$passed%20passed" tcolor=4c1 ;; esac
          fi
          if [ -f "$RUNNER_TEMP/badge-coverage/coverage-pct/pct" ]; then
            pct="$(tr -d ' \n' <"$RUNNER_TEMP/badge-coverage/coverage-pct/pct")"
            if pct_ok "$pct"; then kcov="$pct%25" kcolor=informational; else echo "::warning::kcov figure '$pct' is not a measurement - the badge reads unknown"; fi
          fi
          if [ -f "$RUNNER_TEMP/badge-coverage/coverage-v2-pct/pct" ]; then
            pct="$(tr -d ' \n' <"$RUNNER_TEMP/badge-coverage/coverage-v2-pct/pct")"
            if pct_ok "$pct"; then bashcov="$pct%25" bcolor=informational; else echo "::warning::bashcov figure '$pct' is not a measurement - the badge reads unknown"; fi
          fi
          {
            echo "HI_BADGE_TESTS=$(badge tests "$tests" "$tcolor")"
            echo "HI_BADGE_KCOV=$(badge kcov "$kcov" "$kcolor")"
            echo "HI_BADGE_BASHCOV=$(badge bashcov "$bashcov" "$bcolor")"
          } >>"$GITHUB_ENV"
          echo "badges: tests=$tests kcov=$kcov bashcov=$bashcov"

      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Body: the badges frozen above, what changed, then how to check it.
          # The notes are generated because README.md's Roadmap section deletes
          # finished entries and this is where the git-history ledger gets
          # published. Asked for via the API and composed here rather than
          # --generate-notes plus --notes, which would put the checklist first:
          # gh appends generated notes *after* --notes.
          notes="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body 2>/dev/null || true)"
          [ -n "$notes" ] || notes="_Release notes could not be generated for this tag._"
          # What changed, in the words each PR's `## Release note` section
          # (the template's) gave it: release_notes.sh reads the PR numbers
          # out of the generated notes, so "since the last tag" is GitHub's
          # own answer, and prints nothing when no PR said anything - the
          # titles then stand alone as they always did.
          printf '%s\n' "$notes" >"$RUNNER_TEMP/generated-notes.md"
          changed="$(bash .github/scripts/release_notes.sh "$GITHUB_REPOSITORY" "$RUNNER_TEMP/generated-notes.md")"
          # The checklist: each command is the one docs/PACKAGING.md documents
          # under "Verifying a release download", and the public key is read
          # out of that file so a second literal copy cannot drift.
          pubkey="$(sed -n "s/^minisign -Vm SHA256SUMS -P '\([^']*\)'.*/\1/p" \
            docs/PACKAGING.md | head -n1)"
          [ -n "$pubkey" ] ||
            { echo "no minisign public key in docs/PACKAGING.md - did that section move?" >&2; exit 1; }
          # advertise the signature check only when a signature shipped: the
          # signing step above no-ops without MINISIGN_SECRET_KEY
          if [ -f dist/SHA256SUMS.minisig ]; then
            sigline="minisign -Vm SHA256SUMS -P '$pubkey'"
          else
            sigline="# SHA256SUMS is unsigned for this release - no minisign check"
          fi
          # The repository links: derived from $GITHUB_REPOSITORY rather than
          # another literal copy of the Pages URL (mkrepo's local-build
          # default and docs/PACKAGING.md hold the remaining literals), and
          # derived once - the package-repository step below feeds the same
          # value to mkrepo.sh's --base-url, and the two must never disagree.
          # The apt and apk rows are config values, not pages - GitHub Pages
          # has no directory index, so only the two key files and say-hi.repo
          # are fetchable.
          pages="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "HI_PAGES_URL=$pages" >>"$GITHUB_ENV"
          # printf rather than a heredoc: a heredoc body would have to be
          # unindented, which ends the YAML block scalar. The two
          # `<!-- hi:... -->` lines are slots later jobs fill through
          # .github/scripts/release_slot.sh - `demo` (demos.yml's attach) and
          # `tap` (the tap job below); unfilled, a comment renders as nothing.
          body="$(printf '%s\n' \
            "![tests]($HI_BADGE_TESTS) ![kcov]($HI_BADGE_KCOV) ![bashcov]($HI_BADGE_BASHCOV)" \
            "" \
            "<!-- hi:demo -->" \
            "" \
            ${changed:+"$changed" ""} \
            "$notes" \
            "" \
            "## Verifying this download" \
            "" \
            "The sums cover the deb, rpm, apk, and source tarball." \
            "" \
            '```sh' \
            "sha256sum -c --ignore-missing SHA256SUMS" \
            "$sigline" \
            "gh attestation verify say-hi_*_all.deb --repo $GITHUB_REPOSITORY" \
            '```' \
            "" \
            "Full runbook: [docs/PACKAGING.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/PACKAGING.md#verifying-a-release-download)" \
            "" \
            "## Package repositories" \
            "" \
            "Subscribe once and \`apt\`, \`dnf\`, or \`apk\` upgrades say-hi from here on; the repositories always serve the newest stable release. Setup: [docs/PACKAGING.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/PACKAGING.md#package-repository)." \
            "" \
            "- apt: \`$pages/apt\` (suite \`stable\`, component \`main\`, key [say-hi.asc]($pages/say-hi.asc))" \
            "- dnf: [say-hi.repo]($pages/say-hi.repo)" \
            "- apk: \`$pages/apk\` (key [say-hi.rsa.pub]($pages/say-hi.rsa.pub))" \
            "<!-- hi:tap -->")"
          # A prerelease tag (anything with a `-`: v1.0.0-rc.1) is marked as
          # one and never becomes "Latest" - README's release badge and
          # pages.yml's package repository both read that pointer, and
          # neither should land on a candidate.
          extra=()
          case "$GITHUB_REF_NAME" in *-*) extra=(--prerelease --latest=false) ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$body" "${extra[@]}"
          # the manifests ride along so publish-external.yml's later dispatch
          # is a `gh release download`, not a re-derivation; read line by
          # line, not mapfile (bash 4). No dotglob needed: the AUR
          # manifest travels as SRCINFO, per the collect step above
          files=()
          while IFS= read -r f; do files+=("dist/$f"); done <dist/ARTIFACTS
          files+=(dist/manifests/*)
          [ -f dist/SHA256SUMS.minisig ] && files+=(dist/SHA256SUMS.minisig)
          files+=(dist/say-hi.spdx.json)
          # build's two attest steps covered every file dist/ARTIFACTS lists,
          # SHA256SUMS included - its bytes are unchanged since (minisign
          # signs it, never rewrites it), so its digest still matches what was
          # attested. Scorecard's Signed-Releases check reads release assets
          # for a literal `*.intoto.jsonl` name to award its top score; `gh
          # attestation download` names its output after the digest instead
          # (`sha256:<digest>.jsonl`), so the rename is what makes the file
          # visible to it, not the attestation itself, which stands regardless.
          if gh attestation download dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"; then
            mv sha256:*.jsonl dist/say-hi.intoto.jsonl
            files+=(dist/say-hi.intoto.jsonl)
          else
            echo "no attestations found for dist/SHA256SUMS - shipping without one" >&2
          fi
          # one call per asset, not one call for the list: gh uploads the
          # list five at a time and aborts on the first refusal, which on
          # v0.4.3 left the signature, the SBOM and the provenance behind
          # an rpm GitHub would not save
          # shellcheck source=.github/scripts/gh_asset.sh
          source .github/scripts/gh_asset.sh
          _ci_upload_assets "$GITHUB_REF_NAME" "${files[@]}"

      # The subscribable repository (docs/RELEASING.md's _Package repository_):
      # apt, rpm, and apk indexes over the packages just uploaded, signed with
      # the GPG key the rpm was and the apk index with the apk's key, shipped
      # as one asset that pages.yml unpacks from the newest non-prerelease
      # release. After the upload, so a failure here still leaves a complete
      # release. Skips loudly without GPG_SIGNING_KEY: an unsigned repository
      # is nothing to subscribe to. mkrepo.sh checks the key against
      # packaging/gpg/say-hi.asc, as build did before signing the rpm.
      - name: Build and attach the package repository
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "no GPG_SIGNING_KEY secret - no package repository for this release"
            exit 0
          fi
          source packaging/lib.sh
          write_key "$RUNNER_TEMP/say-hi.gpg.key" "$GPG_SIGNING_KEY"
          set -- --gpg-key "$RUNNER_TEMP/say-hi.gpg.key" --public-key packaging/gpg/say-hi.asc
          # the served URL, the one the release-notes step derived and put in
          # $GITHUB_ENV: left off, say-hi.repo and the rpm baseurl would bake
          # in mkrepo.sh's default - a literal that goes stale on a fork or
          # an owner/repo rename while the notes above it stay correct
          set -- "$@" --base-url "$HI_PAGES_URL"
          if [ -n "$APK_SIGNING_KEY" ]; then
            write_key "$RUNNER_TEMP/say-hi.rsa" "$APK_SIGNING_KEY"
            set -- "$@" --apk-key "$RUNNER_TEMP/say-hi.rsa"
          else
            echo "no APK_SIGNING_KEY secret - the APKINDEX files ship unsigned"
          fi
          packaging/mkrepo.sh "$@" --tarball dist/package-repo.tar.gz
          # shellcheck source=.github/scripts/gh_asset.sh
          source .github/scripts/gh_asset.sh
          _ci_upload_assets "$GITHUB_REF_NAME" dist/package-repo.tar.gz

      # pages.yml serves the package repository out of the newest
      # non-prerelease release, but its workflow_run trigger filters
      # branches: [main] - which a tag push's head_branch never matches, so a
      # release alone never redeploys the site. Ask for the deploy here
      # instead of waiting for the next unrelated push to main to carry it.
      # Not on a prerelease tag: it publishes `--latest=false` (below), so
      # "the newest non-prerelease release" pages.yml reads is unchanged and
      # a redeploy would serve nothing new.
      - name: Refresh the Pages package repository
        if: ${{ needs.build.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      # The release's demo GIF: demos.yml renders every tape at this tag and
      # its attach job uploads one to the release and fills the body's `demo`
      # slot. Dispatched here rather than on its own tag trigger, so the
      # release it attaches to always exists by the time it looks.
      - name: Render the release's demos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run demos.yml --ref "$GITHUB_REF_NAME"

  # The three commands docs/RELEASING.md's "Homebrew tap" section asks for by
  # hand before a tap PR is merged, run on a hosted mac against the tarball
  # just published - the formula's url points at the release asset, which is
  # why this waits on publish and never runs for a rehearsal. The `tap` job
  # below waits on it: a formula that fails install, test, or audit never
  # reaches the tap PR.
  #
  # `brew audit` refuses a path and wants a *named* formula in a tap, hence
  # the throwaway local tap; --new on top of --strict is what a first
  # submission gets. `brew audit` findings are `* <text>` lines; everything
  # else `>audit.out 2>&1` also captures - rubocop's own gem-bundling chatter
  # ahead of it ("Fetching foo", "Bundle complete!", "Run `bundle fund` for
  # details") - is not a finding and must not be read as one. Select `* `
  # lines rather than blacklisting the bundler noise: a `grep -v` over the
  # whole captured output leaves every "Installing X"/"Fetching X" line in
  # audit.real, and found=1 fires with no real finding anywhere in it. Two
  # findings a private repository produces (the homepage 404 and the HEAD
  # URL not resolving) are filtered from what remains - a harmless no-op on
  # a public repo, kept for when GitHub's own check is slow to see that.
  #
  # `brew trust` after tap-new: Homebrew 6.0's tap trust gate ignores a
  # non-official tap's formulae until trusted, and this throwaway tap is
  # exactly that shape - untrusted, install/test/audit below would each fail
  # to find the formula the moment macos-latest ships Homebrew 6.x.
  brew:
    name: brew install, test, and audit the formula (macOS)
    needs: publish
    # not on a v0.0.x or a prerelease tag - build's own classification,
    # relayed through publish's outputs and read the same way by the tap job
    # below; publish-external.yml's aur job cannot reach it at all (a
    # separate workflow run) and keeps its own copy of the same two checks
    if: github.event_name == 'push' && !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.debug != 'true' && needs.publish.outputs.prerelease != 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      prerelease: ${{ needs.publish.outputs.prerelease }}
      debug: ${{ needs.publish.outputs.debug }}
    steps:
      # audit only: on macOS harden-runner has no block mode
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Put the formula in a throwaway tap
        env:
          TAP: ${{ github.repository_owner }}/tap
        run: |
          set -euo pipefail
          brew tap-new --no-git "$TAP"
          cp dist/manifests/say-hi.rb "$(brew --repository "$TAP")/Formula/say-hi.rb"
          # Homebrew 6.0 added tap trust: a non-official tap's formulae are
          # ignored until trusted, which would otherwise silently break every
          # step below the moment the runner image carries it. A no-op on
          # Homebrew 5.x, which has no `trust` subcommand.
          brew trust --tap "$TAP" 2>/dev/null || true

      - name: brew install --build-from-source
        env:
          TAP: ${{ github.repository_owner }}/tap
        run: brew install --build-from-source "$TAP/say-hi"

      - name: brew test
        run: brew test say-hi

      # || true on the audit and the verdict read afterwards (hadolint's shape
      # in ci.yml): the two expected lines are filtered out before the exit
      # status means anything
      - id: audit
        name: brew audit --strict --new
        env:
          TAP: ${{ github.repository_owner }}/tap
        run: |
          set -euo pipefail
          brew audit --strict --new "$TAP/say-hi" >"$RUNNER_TEMP/audit.out" 2>&1 || true
          cat "$RUNNER_TEMP/audit.out"
          grep -E '^ *\* ' "$RUNNER_TEMP/audit.out" |
            grep -vE 'homepage URL .* is not reachable|HEAD: The URL .* is not a valid Git URL' \
              >"$RUNNER_TEMP/audit.real" || true
          if [ -s "$RUNNER_TEMP/audit.real" ]; then
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            echo "found=0" >>"$GITHUB_OUTPUT"
          fi

      - name: Report the verdict
        env:
          FOUND: ${{ steps.audit.outputs.found }}
        run: |
          set -euo pipefail
          {
            echo "### brew audit --strict --new"
            echo
            if [ "$FOUND" = 1 ]; then
              echo "Findings beyond the two RELEASING.md expects while the repository is private:"
              echo
              echo '```'
              cat "$RUNNER_TEMP/audit.real"
              echo '```'
            else
              echo "Clean, apart from any of the two findings RELEASING.md expects while the repository is private."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$FOUND" = 1 ]; then
            echo "::error title=brew audit::the formula has audit findings - see the step summary and the tap PR"
            exit 1
          fi

  # The Homebrew tap, as part of the release: a PR against
  # <owner>/homebrew-tap carrying the formula the `brew` job just installed,
  # tested, and audited, opened only when that job passed. A PR rather than a
  # push, so the tap's own merge stays the human step - there is no
  # `environment:` gate here, since `publish` already ran in this
  # run and `brew` is the technical gate. No-ops loudly without the
  # HOMEBREW_TAP_TOKEN repo secret (a fine-grained PAT scoped to the tap repo,
  # contents + pull requests write). The AUR stays in publish-external.yml:
  # its registration is closed, and its push has no PR to hide behind. The PR
  # - or the tap's formula, when it is already current - is linked from the
  # release body's `tap` slot, under the GITHUB_TOKEN rather than the tap's,
  # in the one concurrency group demos.yml's attach job also edits the body in.
  tap:
    name: open the Homebrew tap PR
    needs: brew
    if: github.event_name == 'push' && !cancelled() && needs.brew.result == 'success' && needs.brew.outputs.debug != 'true' && needs.brew.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gh release edit, filling the body's tap slot
      contents: write
    concurrency:
      group: release-body-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # block: this job holds the tap PAT, and only needs GitHub itself -
      # checkout, clone, and push (github) and gh's PR and release calls
      # (api); the artifact download is on the agent's implicit allowlist.
      # Tighten or extend it from a release's harden-runner insights.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - id: pr
        name: Open the formula PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Homebrew tap::no HOMEBREW_TAP_TOKEN secret - the tap formula was NOT updated; write it by hand with .github/scripts/tap_formula.sh <dist/manifests/say-hi.rb >Formula/say-hi.rb (docs/RELEASING.md)"
            exit 0
          fi
          branch="say-hi-$TAG"
          install="\`brew install ${TAP_REPO%%/*}/tap/say-hi\`"
          # a re-run finds the PR its first attempt opened (merged or not)
          url="$(gh pr list --repo "$TAP_REPO" --head "$branch" --state all --json url --jq '.[0].url // empty')"
          if [ -n "$url" ]; then
            echo "link=- Homebrew: $install ([tap PR]($url))" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          gh repo clone "$TAP_REPO" tap -- --depth 1
          cd tap
          # gh's token into git's credential helper, so the push below is
          # authenticated as the PAT rather than as nobody
          gh auth setup-git
          git checkout -b "$branch"
          mkdir -p Formula
          # the template's header is about this repository; the tap's copy
          # gets the one that says where to edit it instead
          bash ../.github/scripts/tap_formula.sh <../dist/manifests/say-hi.rb >Formula/say-hi.rb
          git add Formula/say-hi.rb
          if git diff --cached --quiet; then
            echo "tap formula already current - nothing to open"
            echo "link=- Homebrew: $install ([formula](https://github.com/$TAP_REPO/blob/HEAD/Formula/say-hi.rb))" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "say-hi $TAG"
          git push origin "$branch"
          # No checklist: this run's `brew` job already installed, tested, and
          # audited the formula on a hosted mac, and the tap's own CI repeats
          # that on macOS and Linux against this PR. printf rather than a
          # heredoc: a heredoc body would have to be unindented, which ends
          # the YAML block scalar.
          body="$(printf '%s\n' \
            "Formula for say-hi $TAG, generated by release.yml." \
            "" \
            "Installed, tested, and audited on a hosted mac by this run's \`brew\` job ($RUN_URL); the tap's CI checks it again on this PR.")"
          url="$(gh pr create --repo "$TAP_REPO" --head "$branch" \
            --title "say-hi $TAG" --body "$body")"
          echo "link=- Homebrew: $install ([tap PR]($url))" >>"$GITHUB_OUTPUT"

      - name: Link it from the release
        if: ${{ steps.pr.outputs.link != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          LINK: ${{ steps.pr.outputs.link }}
          # the publish job's `<!-- hi:tap -->` marker
          RELEASE_SLOT_PREFIX: hi
        run: .github/scripts/release_slot.sh "$GITHUB_REPOSITORY" "$TAG" tap "$LINK"
