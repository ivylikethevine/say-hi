name: Windows e2e

# The target-side half of the Windows story, which README promises and nothing
# else tests: a stock Windows OpenSSH target (DefaultShell = cmd, no bash on
# the sshd PATH) must land in the PowerShell fallback - not hang, not error
# out, and not be mistaken for a Linux host missing base64 (cmd honours `||`,
# which is why hi's probe keeps it off the lines whose exit codes it reads).
# The client is the runner's own Git Bash;
# windows-client.yml is the client-side half. The second job is WSL: an Ubuntu
# distribution on the same runner runs the fast suites, takes the package
# layout (`install.sh --prefix`, what the .deb's package() runs) and is then
# said hi to from Git Bash - the Windows-desk homelab shape, and what turns
# SUPPORT.md's WSL row from expected to proven. ci.yml calls this on every
# push to main once both fast-suite jobs are green; dispatch runs it on its
# own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-openssh:
    name: hi at stock Windows OpenSSH (PowerShell fallback)
    runs-on: windows-latest
    timeout-minutes: 20
    # No `environment:` - see macos-e2e.yml; ci.yml calls this only on `push`,
    # so a fork PR never reaches it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the OpenSSH server
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*'
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name }
          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd

      - name: Generate a throwaway key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -N '' -q -f "$HOME/.ssh/loop"

      # the runner user is an Administrator, so the key goes into the shared
      # administrators file, which sshd only honors with this exact ACL
      - name: Authorize it
        shell: powershell
        run: |
          $key = Get-Content "$env:USERPROFILE\.ssh\loop.pub"
          $file = "$env:ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $file -Value $key
          icacls $file /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'

      # cmd cannot run `sh`, so hi's bootstrap write comes back non-zero with
      # nothing on stdout - the one shape hi reads as "no POSIX shell at all"
      # (a forced command exits 0 or prints; a Linux host without base64 says
      # 64) - and PowerShell greets. That whole ladder is the case.
      # -NoExit holds the session open, so an `exit` is piped in and a timeout
      # backstops it; the marker in the transcript is the assertion either way.
      - name: Say hi (expect the PowerShell fallback)
        shell: bash
        run: |
          set -euo pipefail
          # hi.sh derives its own tree now (GLOSSARY: HI.33), so this export is
          # belt and braces rather than the thing that makes the run work - it
          # stays because under Git Bash a wrong tree resolves to
          # /c/Users/runneradmin rather than the checkout on D:, and that is
          # invisible until the session is already wrong. The workspace *is* the
          # say-hi directory, so _HI_HOME is its parent; derived with `cd ..`
          # because $GITHUB_WORKSPACE is a backslashed path bash cannot walk.
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          out="$(printf 'exit\n' | timeout 120 ./hi.sh -i "$HOME/.ssh/loop" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR "${USERNAME:-$(whoami)}@127.0.0.1" 2>&1)" || true
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "hi from PowerShell"

  wsl:
    name: hi into WSL (Ubuntu, Git Bash client)
    runs-on: windows-latest
    timeout-minutes: 30
    # wsl-bash {0} runs the step inside the distribution, which does not
    # inherit the runner's environment on its own - WSLENV is the allowlist
    # of names Windows shares across that boundary, unflagged (no /p) so the
    # raw backslashed value crosses unchanged for the wslpath -u calls below
    # to translate themselves, the way they already assumed it would arrive.
    # Without this, $GITHUB_WORKSPACE and $USERPROFILE are simply unset
    # inside every wsl-bash step - "unbound variable" under this job's own
    # set -eu, not a hang, whatever the log looks like mid-run.
    env:
      WSLENV: GITHUB_WORKSPACE:USERPROFILE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WSL 2 (the action's own default - this job used to pin 1): hosted
      # Windows runners have carried the nested virtualization WSL 2's VM
      # needs since the Dadsv5 image move, so the old "no nested virt" reason
      # for WSL 1 no longer holds. The Windows -> Linux direction this job
      # actually uses - Git Bash reaching the distribution's sshd on
      # 127.0.0.1 below - is the one WSL 2's default NAT networking forwards
      # on its own; only the *other* direction (WSL reaching a Windows-side
      # service by 127.0.0.1) needs mirrored networking or the host's real
      # IP, and nothing here does that. This job runs no docker/podman/nomad/
      # kubectl - the `fast` group is backend-agnostic - so there is nothing
      # backend-shaped to lose either way.
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: bash zsh fish git python3 openssh-server

      # The checkout is on the Windows side; WSL sees it under /mnt. `cd` to
      # it through the path WSL gives, since $GITHUB_WORKSPACE is a
      # backslashed D: path here.
      - name: Fast suites inside WSL
        shell: wsl-bash {0}
        run: |
          set -eu
          cd "$(wslpath -u "$GITHUB_WORKSPACE")"
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          # a DrvFs checkout is owned by a Windows SID, which git reports as
          # someone else - the FreeBSD job's dubious-ownership case again
          git config --global --add safe.directory "$(pwd)"
          # -k 30: a wedge that outlives the first signal would otherwise
          # leave `timeout` waiting on it forever too - see
          # freebsd-e2e.yml's comment on the same flag.
          timeout -k 30 900 bash ./tests/test_runner.sh --host-report --group fast </dev/null

      # The package layout, by the same call the .deb's package() step makes:
      # the tree under /usr/share/say-hi, /usr/bin/hi, /etc/profile.d/say-hi.sh.
      # A session from outside then finds that permanent tree the way
      # install_methods_test.sh's deb case does, and ships nothing.
      - name: Install the package layout inside WSL
        shell: wsl-bash {0}
        run: |
          set -eu
          cd "$(wslpath -u "$GITHUB_WORKSPACE")"
          sudo bash ./scripts/install.sh --prefix /usr/share
          test -x /usr/bin/hi && test -f /etc/profile.d/say-hi.sh
          /usr/bin/hi --version

      # sshd on 2222 so nothing on the Windows side is in the way, key-only,
      # the runner user's own key. `service ssh start` is the init-less
      # answer neither WSL 1 nor WSL 2 need real systemd for; ssh-keygen -A
      # writes the host keys a fresh install lacks.
      - name: Start sshd inside WSL
        shell: wsl-bash {0}
        run: |
          set -eu
          sudo ssh-keygen -A
          printf 'Port 2222\nPasswordAuthentication no\n' | sudo tee /etc/ssh/sshd_config.d/hi.conf >/dev/null
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          ssh-keygen -t ed25519 -N '' -q -f "$HOME/.ssh/loop"
          cat "$HOME/.ssh/loop.pub" >>"$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo service ssh start
          # the client is Git Bash, whose $HOME is the Windows profile
          cp "$HOME/.ssh/loop" "$(wslpath -u "$USERPROFILE")/wsl-loop"
          printf '%s\n' "$USER" >"$(wslpath -u "$USERPROFILE")/wsl-user"

      # From Git Bash into the distribution: a full bash session on a target
      # that has a permanent say-hi (the header names its /usr/share tree),
      # the command's output back, and nothing left in the target's /tmp.
      - name: Say hi into WSL from Git Bash
        shell: bash
        run: |
          set -euo pipefail
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          user="$(cat "$HOME/wsl-user")"
          out="$(timeout 120 ./hi.sh -p 2222 -i "$HOME/wsl-loop" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR "$user@127.0.0.1" 'echo HI_WSL_OK; hi_info' 2>&1)" || true
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q HI_WSL_OK
          printf '%s\n' "$out" | grep -q 'hi_root: /usr/share/say-hi'

      - name: Nothing left behind in the target
        shell: wsl-bash {0}
        run: |
          if ls -d /tmp/*.hi.* 2>/dev/null; then
            echo "session directory survived the exit" >&2
            exit 1
          fi
