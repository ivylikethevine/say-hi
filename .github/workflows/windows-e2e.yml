name: Windows e2e

# The target-side half of the Windows story, which README promises and nothing
# else tests: a stock Windows OpenSSH target (DefaultShell = cmd, no bash on
# the sshd PATH) must land in the PowerShell fallback - not hang, not error
# out, and not be mistaken for a Linux host missing base64 (cmd honours `||`,
# which is why hi's probe keeps it off the lines whose exit codes it reads).
# The client is the runner's own Git Bash;
# windows-client.yml is the client-side half. The rest is WSL: `wsl-suites`
# runs the fast suites inside an Ubuntu distribution (sharded, from a copy on
# the distribution's own filesystem - see the job), and its first shard's
# distribution then also takes the package layout (`install.sh --prefix`,
# what the .deb's package() runs) and is said hi to from Git Bash - the
# Windows-desk homelab shape, and what turns SUPPORT.md's WSL row from
# expected to proven - here rather than on a Windows runner of its own, since
# a distribution already exists once a shard's fast suites finish. ci.yml
# calls this on every push to main and every same-repository pull request
# once both fast-suite jobs are green; dispatch runs it on its own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-openssh:
    name: hi at stock Windows OpenSSH (PowerShell fallback)
    runs-on: windows-latest
    timeout-minutes: 20
    # No `environment:` - a required reviewer would stall every push to main;
    # ci.yml calls this on `push` and on same-repository PRs only, so a fork
    # PR never reaches it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the OpenSSH server
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*'
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name }
          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd

      - name: Generate a throwaway key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -N '' -q -f "$HOME/.ssh/loop"

      # the runner user is an Administrator, so the key goes into the shared
      # administrators file, which sshd only honors with this exact ACL
      - name: Authorize it
        shell: powershell
        run: |
          $key = Get-Content "$env:USERPROFILE\.ssh\loop.pub"
          $file = "$env:ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $file -Value $key
          icacls $file /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'

      # cmd cannot run `sh`, so hi's bootstrap write comes back non-zero with
      # nothing on stdout - the one shape hi reads as "no POSIX shell at all"
      # (a forced command exits 0 or prints; a Linux host without base64 says
      # 64) - and PowerShell greets. That whole ladder is the case.
      # -NoExit holds the session open, so an `exit` is piped in and a timeout
      # backstops it; the marker in the transcript is the assertion either way.
      - name: Say hi (expect the PowerShell fallback)
        shell: bash
        run: |
          set -euo pipefail
          # belt and braces (hi.sh derives its tree, HI.33): a wrong one under
          # Git Bash is silent. `cd ..`: $GITHUB_WORKSPACE is backslashed
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          out="$(printf 'exit\n' | timeout 120 ./hi.sh -i "$HOME/.ssh/loop" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR "${USERNAME:-$(whoami)}@127.0.0.1" 2>&1)" || true
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "hi from PowerShell"

  # The fast suites inside WSL, sharded the way windows-client.yml shards
  # them under Git Bash, and run from a copy of the checkout on the
  # distribution's own filesystem rather than from /mnt. Under WSL 2 the
  # checkout on D: reaches the VM as a 9p share - a round trip per file
  # operation - and the fast group is nothing but file operations; from
  # /mnt/d it ran past the 900-second kill. On ext4 it runs at Linux speed,
  # which makes --verbose (width 1, streamed live) affordable, so a wedge
  # names its suite and case instead of leaving 900 seconds of silence.
  wsl-suites:
    name: fast suites (WSL, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    # WSLENV is the allowlist of names Windows shares into a wsl-bash step;
    # HI_SHARD has to be on it or the step's own env: never reaches the
    # distribution, and USERPROFILE is shard 1's alone (the session steps
    # below say why) but costs nothing to list for both
    env:
      WSLENV: GITHUB_WORKSPACE:HI_SHARD:USERPROFILE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WSL 2: hosted Windows runners carry the nested virtualization it needs
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: bash zsh fish git python3 openssh-server

      # runner_test.sh checks the matrix's slices partition the fast group.
      # $HOME/hi-tree rather than $HOME/say-hi on purpose: $HOME is on hi's
      # install-probe candidate list, and a tree there would be the one a
      # session into this distribution found.
      - name: This shard of the fast suites, from a copy on ext4
        shell: wsl-bash {0}
        env:
          HI_SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          ws="$(wslpath -u "$GITHUB_WORKSPACE")"
          # The Windows PATH rides into the distribution too (WSL's interop
          # appendWindowsPath default): some fifty /mnt/c/... entries, each
          # a 9p round trip per stat. The package check is 279 `command -v`
          # lookups per render and bash caches no misses, so one full_check
          # walks ~10,000 /mnt/c stats and takes 30-37s here against 30ms
          # on ext4 - past the configure suite's 30s pty cases, and the
          # whole shard past the 900s kill below. Nothing below needs a
          # Windows binary.
          PATH="$(printf '%s\n' "$PATH" | tr ':' '\n' | grep -v '^/mnt/' | paste -sd: -)"
          export PATH
          mkdir -p "$HOME/hi-tree"
          cp -a "$ws" "$HOME/hi-tree/say-hi"
          cd "$HOME/hi-tree/say-hi"
          _HI_HOME="$HOME/hi-tree"
          export _HI_HOME
          git config --global --add safe.directory "$(pwd)"
          # setsid: a wsl.exe session has a controlling terminal even with
          # every stdio a pipe, where GitHub's ubuntu runner has none. The
          # suites start `bash -i` / `zsh -i` / `fish -i` sessions (load(),
          # the fresh-shell cases) with stderr redirected, so bash opens
          # /dev/tty for job control - and finding itself in a background
          # process group (timeout's own, below) stops on SIGTTIN, for good.
          # A new session has no terminal to open, which is the ubuntu
          # shape. Outside `timeout`, not inside:
          # timeout kills its child's process group, and that has to still
          # be the runner's.
          # -k 30: a wedge that outlives the first signal would otherwise
          # leave `timeout` waiting on it forever too - see
          # freebsd-e2e.yml's comment on the same flag.
          setsid -w timeout -k 30 900 bash ./tests/test_runner.sh --verbose --host-report \
            --group fast --shard "$HI_SHARD" </dev/null

      # The rest of this job is shard 1 only: the package layout on this same
      # distribution, then said hi to from Git Bash - the target side of the
      # Windows-desk homelab shape, and what turns SUPPORT.md's WSL row from
      # expected to proven. By the same call the .deb's package() step makes:
      # the tree under /usr/share/say-hi, /usr/bin/hi, /etc/profile.d/say-hi.sh.
      # hi ships its payload to every ssh target and does not read a
      # say-hi the target already has, so what a session from outside proves
      # is install_methods_test.sh's deb case: the session runs out of its own
      # shipped tree, and the installed one is still sitting there untouched
      # when it is gone. $GITHUB_WORKSPACE, not the $HOME/hi-tree copy above -
      # a separate wsl-bash step starts its own subshell, and the original
      # checkout is what the .deb's package() would see too.
      - name: Install the package layout inside WSL
        if: matrix.shard == '1/2'
        shell: wsl-bash {0}
        run: |
          set -eu
          cd "$(wslpath -u "$GITHUB_WORKSPACE")"
          sudo bash ./scripts/install.sh --prefix /usr/share
          test -x /usr/bin/hi && test -f /etc/profile.d/say-hi.sh
          /usr/bin/hi --version

      # sshd on 2222 so nothing on the Windows side is in the way, key-only,
      # the distribution user's own key (root, in this action's image - key
      # auth is what PermitRootLogin's default allows). Started as
      # /usr/sbin/sshd itself rather than `service ssh start`: noble's
      # openssh-server is socket-activated, so under systemd that route has
      # ssh.socket own port 22 and sshd_config's Port never read. The binary
      # reads the config, with or without systemd. ssh-keygen -A
      # writes the host keys a fresh install lacks. The loop proves the
      # listener from inside before Git Bash tries it from outside, so a
      # refusal in the next step can only be the Windows -> WSL relay.
      - name: Start sshd inside WSL
        if: matrix.shard == '1/2'
        shell: wsl-bash {0}
        run: |
          set -eu
          sudo ssh-keygen -A
          printf 'Port 2222\nPasswordAuthentication no\n' | sudo tee /etc/ssh/sshd_config.d/hi.conf >/dev/null
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          ssh-keygen -t ed25519 -N '' -q -f "$HOME/.ssh/loop"
          cat "$HOME/.ssh/loop.pub" >>"$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo install -d -m 0755 /run/sshd
          sudo /usr/sbin/sshd -E /tmp/hi-sshd.log
          up=0
          for _ in $(seq 1 30); do
            if ssh -p 2222 -i "$HOME/.ssh/loop" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=2 -o LogLevel=ERROR \
              "$USER@127.0.0.1" true; then up=1; break; fi
            sleep 1
          done
          [ "$up" = 1 ] || { echo "sshd never answered on 2222 inside WSL" >&2; sudo cat /tmp/hi-sshd.log >&2; exit 1; }
          # the client is Git Bash, whose $HOME is the Windows profile: the
          # key, the user, and the distribution's own address for the case
          # where 127.0.0.1 is not relayed in
          cp "$HOME/.ssh/loop" "$(wslpath -u "$USERPROFILE")/wsl-loop"
          printf '%s\n' "$USER" >"$(wslpath -u "$USERPROFILE")/wsl-user"
          hostname -I | awk '{print $1}' >"$(wslpath -u "$USERPROFILE")/wsl-host"

      # From Git Bash into the distribution: a full bash session on a target
      # that has a permanent say-hi, the command's output back, and nothing
      # left in the target's /tmp. shell: bash, not wsl-bash - this one runs
      # on the Windows side, which is where the client (Git Bash) is.
      - name: Say hi into WSL from Git Bash
        if: matrix.shard == '1/2'
        shell: bash
        run: |
          set -euo pipefail
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          user="$(cat "$HOME/wsl-user")"
          # a file copied in from WSL lands with the profile's ACL, which MSYS
          # reads as 0644 - and ssh ignores a private key that open
          chmod 600 "$HOME/wsl-loop"
          # WSL 2's NAT relays Windows 127.0.0.1 into the distribution for
          # ports it listens on; the address the previous step recorded is
          # the fallback when that relay is not there, said out loud so the
          # log shows which path ran
          host=127.0.0.1
          ssh -p 2222 -i "$HOME/wsl-loop" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o LogLevel=ERROR \
            "$user@$host" true 2>/dev/null || {
            host="$(cat "$HOME/wsl-host")"
            echo "127.0.0.1:2222 is not relayed into WSL - using the distribution's address $host"
          }
          out="$(timeout 120 ./hi.sh -p 2222 -i "$HOME/wsl-loop" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR "$user@$host" 'echo HI_WSL_OK; hi_info' 2>&1)" || true
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q HI_WSL_OK
          # the session runs out of the tree hi shipped - $_HI_HOME is a
          # `mktemp -d -t <client user>.hi.XXXXXX` on the target, named for the
          # *client's* user (hi.sh's _hi_whoami), which is why this matches the
          # shape rather than a name. ci.yml's macOS job asserts the same shape.
          printf '%s\n' "$out" | grep -Eq 'hi_root: .*\.hi\.[A-Za-z0-9.]+/say-hi'
          # and not out of the packaged tree: hi dropped target-side install
          # detection, so a session reading /usr/share/say-hi would be a
          # regression back to it.
          ! printf '%s\n' "$out" | grep -q 'hi_root: /usr/share/say-hi'

      # The other half of install_methods_test.sh's assertion, which a
      # transcript cannot show: the shipped tree took itself with it
      # (load.sh's clean_all), and the packaged tree is still whole.
      - name: Nothing left behind in the target
        if: matrix.shard == '1/2'
        shell: wsl-bash {0}
        run: bash "$(wslpath -u "$GITHUB_WORKSPACE")/.github/scripts/no_hi_session_left.sh" /usr/share/say-hi/hi.sh

  # The one check the shards roll up into, as windows-client.yml's
  # fast-suites job does for Git Bash. `!cancelled()` so it reports on a red
  # shard rather than being skipped past; the explicit result is the verdict
  # (a skipped or failed shard is a failed check).
  wsl-fast-suites:
    name: fast suites (WSL)
    needs: wsl-suites
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard green
        env:
          RESULT: ${{ needs.wsl-suites.result }}
        run: |
          set -euo pipefail
          echo "shards: $RESULT"
          [ "$RESULT" = success ]

