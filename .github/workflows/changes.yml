# Detects whether a push or pull_request touched anything outside
# `.github/workflows/**`, so ci.yml's expensive jobs (e2e 25 min, e2e-backends
# 40 min, test-macos 20 min) can skip on a workflow-only or docs-only change.
# `workflow-lint` and `advisory-lint` are deliberately not gated on it - such a
# change is exactly what they exist to catch - and demos.yml keeps its own
# narrower `paths:` filter.
name: Detect changes

on:
  workflow_call:
    inputs:
      filters:
        description: >
          `dorny/paths-filter` filter rules (YAML), with a single key "code" —
          the fileset downstream jobs should treat as "something changed".
        required: true
        type: string
    outputs:
      code:
        description: "'true' if a file matching `inputs.filters`'s \"code\" key changed."
        value: ${{ jobs.changes.outputs.code }}

permissions: {}

jobs:
  changes:
    name: detect changes
    # No `if:` here, deliberately: ci.yml gates the *calling* job (push/
    # pull_request only), and a skipped caller reports `result: skipped` the
    # way the downstream `needs.changes.result == 'skipped'` checks expect;
    # whether an inner job's skip propagates back through a reusable-workflow
    # call is unverified.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # some-with-excludes, not the default `some`: a bare negated pattern
      # matches nothing on its own (picomatch needs a positive rule to negate
      # against), and plain `some` would count workflow files toward a match
      # since `**` matches those too.
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: ${{ inputs.filters }}
