name: Windows client

# The client-side half of the Windows story: the fast suites under the
# runner's own Git Bash, proving hi.sh works when the machine you are
# *sitting at* is Windows. windows-e2e.yml is the other half - it stands up
# sshd and drives `hi localhost` into a stock Windows OpenSSH *target*.
# README's compatibility table rests on both.
#
# Called by ci.yml on every push to main beside `e2e-windows`, and a real gate
# like every other job there: a failing suite fails this job and the push's
# overall status, no continue-on-error. Dispatch still works for running it on
# its own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-suites:
    name: fast suites (Git Bash)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deliberately no `uses: ./.github/actions/setup-tool` in this job: that
      # action resolves linux.x86_64/darwin.* asset slugs and caches into
      # /usr/local/bin, and neither is a Windows shape. The lint group is not
      # run here for that reason - ci.yml's ubuntu job is where it is enforced,
      # against pinned versions.
      #
      # No --require-run and no --totals-file either. Skips are the expected
      # shape here - there is no zsh or fish on the runner - and README's tests
      # badge is the ubuntu count on purpose, per the note above ci.yml's
      # fast-totals upload.
      - name: Run the fast suites under Git Bash
        shell: bash
        run: |
          set -euo pipefail
          # hi.sh derives its own tree (GLOSSARY: HI.33), so this export is
          # belt and braces rather than the thing that makes the run work - it
          # stays because under Git Bash a wrong tree resolves to
          # /c/Users/runneradmin rather than the checkout on D:, and that is
          # invisible until the run is already wrong. The workspace *is* the
          # say-hi directory, so _HI_HOME is its parent; derived with `cd ..`
          # because $GITHUB_WORKSPACE is a backslashed path bash cannot walk.
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          ./tests/test_runner.sh --verbose --host-report --group fast
