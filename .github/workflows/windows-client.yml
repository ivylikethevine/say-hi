name: Windows client

# The client-side half of the Windows story: the fast suites under the
# runner's own Git Bash, proving hi.sh works when the machine you are sitting
# at is Windows. windows-e2e.yml is the target-side half; README's
# compatibility table rests on both. Called by ci.yml on every push to main
# and every same-repository pull request as a real gate (a failing suite
# fails the run, no continue-on-error); dispatch runs it on its own.
#
# Five runners: the fast group takes about seven minutes under Git Bash -
# backgrounded suites barely overlap there (tests/lib/fixtures.sh's
# fork_concurrency), so the runner's width-4 run is close to serial and only
# more machines shorten it. Quarters of the table, except that the second
# quarter (doctor_test.sh, ~10k forks, and test_lib's) ran far past the rest
# and is halved as shards 2a and 2b (slices 2/8 and 6/8 - which --shard's
# round robin makes exactly 2/4). Each slice runs twice: on windows-latest (x64) and windows-11-arm
# (arm64, free on a public repo), where Git for Windows is its native arm64
# build. The `fast-suites` job below folds all ten back into the one check
# name README's badge and CONTRIBUTING's table know, "fast suites (Windows
# client) / fast suites (Git Bash)".
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    name: fast suites (Git Bash ${{ matrix.arch }}, shard ${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/8, 6/8, 3/4, 4/4]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
          # the check names: quarters 1-4, the second one as halves 2a/2b
          - { shard: 1/4, label: "1" }
          - { shard: 2/8, label: 2a }
          - { shard: 6/8, label: 2b }
          - { shard: 3/4, label: "3" }
          - { shard: 4/4, label: "4" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `uses: ./.github/actions/setup-tools`: it resolves linux/darwin asset
      # slugs and caches into /usr/local/bin, neither a Windows shape, so the
      # lint group is enforced on ci.yml's ubuntu job only. No --require-run or
      # --totals-file either: skips are expected (no zsh or fish here), and
      # README's tests badge is the ubuntu count on purpose, per the note above
      # ci.yml's tests upload.
      - name: Run this shard of the fast suites under Git Bash
        shell: bash
        # each matrix entry is a whole i/n slice; runner_test.sh checks they
        # partition the fast group
        env:
          HI_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # belt and braces (hi.sh derives its tree, HI.33): a wrong one under
          # Git Bash is silent. `cd ..`: $GITHUB_WORKSPACE is backslashed
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          ./tests/test_runner.sh --verbose --host-report --group fast --shard "$HI_SHARD"

  # The one check the shards roll up into. `!cancelled()` so it reports on a
  # red shard rather than being skipped past; the explicit result is the
  # verdict (a skipped or failed shard is a failed check).
  fast-suites:
    name: fast suites (Git Bash)
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard green
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          set -euo pipefail
          echo "shards: $RESULT"
          [ "$RESULT" = success ]
