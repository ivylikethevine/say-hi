name: Windows client

# The client-side half of the Windows story: the fast suites under the
# runner's own Git Bash, proving hi.sh works when the machine you are sitting
# at is Windows. windows-e2e.yml is the target-side half; README's
# compatibility table rests on both. Called by ci.yml on every push to main
# and every same-repository pull request as a real gate (a failing suite
# fails the run, no continue-on-error).
#
# Four runners a leg: quarters of the table that test_runner.sh deals by
# each suite's arm64 time ($_HI_SHARD_BY=gitbash), so the four take about
# the same time. Four and no more:
# GitHub runs about four windows-11-arm jobs at once, and a fifth shard waited
# for one of them to finish - in eight of ten runs, 9 to 26 minutes into a run
# that the arm64 leg alone then decided. Each slice runs twice: on windows-latest (x64)
# and windows-11-arm (arm64, free on a public repo), where only git.exe is
# native: the MSYS runtime under Git Bash is x86_64, emulated (the host
# report's `os` row). No --verbose (ci.yml's `test` job's own comment on
# the same flag): the runner then fans a shard's suites out to the core count
# instead of forcing width 1 for live streaming, and a failing transcript
# still replays in full either way - only the live stream is lost. No job
# rolls the eight up into one check: a red shard fails the run on its own, and
# README's badge reads the eight by name (.github/scripts/platform_badges.sh).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  shard:
    name: fast suites (Git Bash ${{ matrix.arch }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: windows-latest
          # two suites at a time, not the core count: the emulated MSYS runtime
          # with four suites and their cases besides ran at a load of 14 to
          # 27 on four cores, where a 2s probe timed out and a case ran past
          # its own waits
          - arch: arm64
            runner: windows-11-arm
            width: 2
    steps:
      # audit on the x64 legs; the arm64 legs only log that harden-runner
      # has no Windows arm agent and carry on
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # every Windows job's, x64 a no-op - the action says why
      - uses: ./.github/actions/defender-off

      # No `uses: ./.github/actions/setup-tools`: it resolves linux/darwin asset
      # slugs and caches into /usr/local/bin, neither a Windows shape, so the
      # lint group is enforced on ci.yml's ubuntu job only. No --require-run or
      # --totals-file either: skips are expected (no zsh or fish here), and
      # README's tests badge is the ubuntu count on purpose, per the note above
      # ci.yml's tests upload.
      - name: Run this shard of the fast suites under Git Bash
        shell: bash
        # each matrix entry is a whole i/n slice; runner_test.sh checks they
        # partition the fast group
        env:
          HI_SHARD: ${{ matrix.shard }}
          # empty is the runner's own width (the core count)
          _HI_RUNNER_WIDTH: ${{ matrix.width }}
          # the quarters dealt by $_HI_TEST_COSTS_GITBASH
          _HI_SHARD_BY: gitbash
          # the job's limit less three minutes: the runner ends itself and
          # names what was running, where the limit leaves no log
          _HI_RUN_DEADLINE: "720"
        run: |
          set -euo pipefail
          # belt and braces (hi.sh derives its tree, HI.33): a wrong one under
          # Git Bash is silent. `cd ..`: $GITHUB_WORKSPACE is backslashed
          _HI_HOME="$(cd .. && pwd)"
          export _HI_HOME
          ./tests/test_runner.sh --host-report --group fast --shard "$HI_SHARD"
