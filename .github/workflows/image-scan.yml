name: Image scan

# Weekly trivy scan of tests/dockerfiles' digest-pinned base images: the
# severity half of digest-pinning, which dependabot cannot offer (its docker
# ecosystem is version-updates-only - .github/dependabot.yml's docker block).
# Scans the pinned digest and what the tag points at now, and speaks only when
# the second is verifiably better; --ignore-unfixed is the whole design (the
# scan step says why) and the state machine is scan_pinned_images.sh's header.
on:
  # scheduled rather than per-PR: this tracks upstream's clock, not the diff's
  schedule:
    - cron: "37 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  # the one write this job does: upsert (and close) its own tracking issue
  issues: write

jobs:
  scan:
    name: trivy over the pinned base images (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-tool
        with:
          tool: trivy

      # Advisory, like markdownlint and link-check: a CVE landing upstream is no
      # reason to redden an unrelated PR, so never make this a required check.
      # The three verdicts (0 clean, 1 a finding with no better image to move
      # to, 2 a repin that demonstrably helps) are all green and captured as an
      # output - continue-on-error would collapse them to "failure" - while
      # anything else (127 is a missing trivy or jq) still fails loudly.
      # --ignore-unfixed is the whole design: debian:bookworm-slim carries 22
      # HIGH/CRITICAL won't-fix findings (eight of them perl-base), a job that
      # counts those is red forever, and two piles of permanent findings differ
      # by noise. debian:trixie-slim's util-linux TOCTOU set has no rebuilt tag
      # yet, so verdict 1 naming that pin is expected until Debian rebuilds it
      # (timep.Dockerfile takes the fix from the archive). A zero is not always
      # clean either: trivy declines fedora ("Unsupported os"), and the script
      # reports its null .Results as unscanned rather than counting it clean.
      - id: scan
        env:
          HI_SCAN_REPORT: ${{ runner.temp }}/image-scan-report.md
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/scan_pinned_images.sh || rc=$?
          echo "verdict=$rc" >>"$GITHUB_OUTPUT"
          [ "$rc" -le 2 ] || exit "$rc"

      # The report is the summary and the issue body both, so the two can never
      # drift into saying different things.
      - name: Append the footer before the issue upsert
        if: steps.scan.outputs.verdict == 2
        env:
          REPORT: ${{ runner.temp }}/image-scan-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # the backticks below are a markdown code span, not a substitution
          # shellcheck disable=SC2016
          printf '\nFound by [`image-scan`](%s). Closed automatically once the pins no longer need it.\n' \
            "$RUN_URL" >>"$REPORT"

      # An issue, not a pull request: dependabot already opens the repin PR, and
      # one from here would need contents: write and, being GITHUB_TOKEN-
      # authored, trigger no docker e2e run to prove the new digest builds.
      - uses: $/.github/actions/upsert-tracking-issue
        with:
          label: image-scan
          label-color: D93F0B
          label-description: A pinned base image can be repinned to fix a CVE
          title: Base image repin would close known vulnerabilities
          resolved: ${{ steps.scan.outputs.verdict != 2 && 'true' || 'false' }}
          close-comment: The pins no longer have a fixable finding a repin would clear. [Latest run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          write-summary-on-resolved: "true"
          body-file: ${{ runner.temp }}/image-scan-report.md
          warning-title: trivy
          warning-body: A pinned base image can be repinned to close known vulnerabilities - see the issue
