name: Image scan

# Advisory trivy scans; nothing here blocks a merge.
# - pins: the digest-pinned base images in tests/dockerfiles. Dependabot repins
#   on release, not on severity, so this scans each pinned digest and what its
#   tag points at now, and keeps one tracking issue open only while a repin
#   verifiably closes fixable HIGH/CRITICAL findings (--ignore-unfixed; state
#   machine: .github/scripts/scan_pinned_images.sh's header).
#
# Runs after every green CI run on a push to main, weekly (upstream rebuilds
# and advisories land with no push here), and on dispatch; never per PR.
# workflow_run is safe: the jobs run only after a green push to main and check
# out the default branch.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel: a run cancelled mid-upsert can leave the tracking
# issue half-written or open a duplicate.
concurrency:
  group: image-scan
  cancel-in-progress: false

jobs:
  pins:
    name: pinned images (trivy, advisory)
    # only a green push to main; the schedule and a dispatch pass the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # open, refresh or close the tracking issue
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          # Off this job's own audit log: the pinned images' registries, and
          # trivy's database and version check. A rotating
          # run-actions-N-azure-*.actions.githubusercontent.com host also
          # appeared; no fixed row covers it, and this job is advisory.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            index.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            check.trivy.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tool
        with:
          tool: trivy

      # The three verdicts (0 clean, 1 a finding no repin improves, 2 a repin
      # that helps) are captured as an output, not collapsed by
      # continue-on-error; anything else (3 a failed database download, 127 no
      # trivy or jq) still fails the job.
      - id: scan
        name: Scan pinned digests and their tags
        env:
          SCAN_REPORT: ${{ runner.temp }}/image-scan-report.md
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/scan_pinned_images.sh || rc=$?
          echo "verdict=$rc" >>"$GITHUB_OUTPUT"
          [ "$rc" -le 2 ] || exit "$rc"

      # An issue, not a pull request: dependabot already opens the repin PR. The
      # report is the summary and the issue body both, so the two can't disagree.
      - uses: ./.github/actions/upsert-tracking-issue
        with:
          label: image-scan
          label-color: D93F0B
          label-description: A pinned image can be repinned to fix a CVE
          title: Image repin would close known vulnerabilities
          resolved: ${{ steps.scan.outputs.verdict != '2' }}
          close-comment: The pins no longer have a fixable finding a repin would clear.
          resolved-when: the pins no longer need it
          write-summary-on-resolved: "true"
          body-file: ${{ runner.temp }}/image-scan-report.md
          warning-title: trivy
          warning-body: A pinned image can be repinned to close known vulnerabilities - see the image-scan issue
