name: Coverage

# kcov over the fast suites, published as an artifact - visibility, never a
# gate: no PR waits on this and no threshold fails it. The figure itself is
# still not to be believed - kcov loses its DEBUG trap once test_lib.sh is
# sourced (tests/coverage.sh's READ THIS BEFORE BELIEVING A NUMBER THIS
# PRINTS), so it understates real coverage by a wide, uneven margin and the
# README badge says `load-time` in grey, under an accuracy disclaimer.
#
# workflow_run so every green push to main refreshes the figure without a
# manual dispatch; the job gates on the run's conclusion and event the way
# pages.yml does, and checkout uses the default ref, never the triggering
# run's payload. pages.yml deploys off the same CI event, so the badge shows
# the *previous* push's figure until the next deploy - the documented "last
# figure anyone measured" design, now at most one push behind.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# pushes to main can stack; only the newest figure matters
concurrency:
  group: coverage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kcov:
    name: kcov over the fast suites
    # only a green push to main measures; a manual dispatch passes the first
    # clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the libs after fish are kcov's runtime ones: setup-tool caches the
      # built binary, so on a cache hit nothing else pulls them in
      - name: Install zsh, fish and kcov's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish libdw1 libelf1 libcurl4 zlib1g libstdc++6

      # built from its GitHub source tarball like every other tool here: kcov
      # publishes no binary asset and reaches Debian/Ubuntu only through a PPA
      - uses: ./.github/actions/setup-tool
        with:
          tool: kcov

      # No shellcheck/shfmt/checkbashisms on purpose: tests/coverage.sh drops
      # the `shellcheck` suite from the sweep, so the host report's "(absent)"
      # for them is not a failure.
      - name: Run the fast suites under kcov
        run: tests/coverage.sh coverage-report

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error
          retention-days: 90

      # One line pages.yml turns into README's badge (badges/coverage.json),
      # separate from the report because the site re-reads it on every deploy.
      # The `^[[:space:]]*` anchor is load-bearing: kcov writes percent_covered
      # once per traced file inline inside a `{...}` and once for the whole run
      # on a line of its own; without it the first per-file figure wins.
      - name: Write the badge figure
        run: |
          set -euo pipefail
          src=coverage-report/merged/kcov-merged/coverage.json
          if [ ! -f "$src" ]; then
            echo "::warning::$src is missing - no badge figure to publish"
            exit 0
          fi
          pct="$(sed -n 's/^[[:space:]]*"percent_covered"[[:space:]]*:[[:space:]]*"\{0,1\}\([0-9.]*\).*/\1/p' "$src" | tail -1)"
          case "$pct" in '' | *[!0-9.]*)
            echo "::warning::could not read percent_covered out of $src"
            exit 0
            ;;
          esac
          mkdir -p coverage-pct
          printf '%s\n' "$pct" >coverage-pct/pct
          echo "kcov reports ${pct}% of lines executed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('coverage-pct/pct') != ''
        with:
          name: coverage-pct
          path: coverage-pct
          if-no-files-found: error
