name: Coverage

# kcov over the fast suites, published as an artifact - visibility, never a
# gate: no PR waits on this and no threshold fails it.
#
# Dispatch-only, and deliberately so rather than on a schedule. tests/coverage.sh
# opens with a section headed READ THIS BEFORE BELIEVING A NUMBER THIS PRINTS:
# kcov loses its DEBUG trap once test_lib.sh is sourced, so the percentages
# describe what runs at load time and understate real coverage by a wide, uneven
# margin. A monthly 45-minute run that mints a 90-day artifact nobody should act
# on is the one kind of automation worth removing. Put the schedule back the day
# the numbers mean something - the topology in coverage.sh is already right.
#
# The run does publish a figure for README's badge (pages.yml turns it into
# badges/coverage.json), and that badge says `load-time` in grey rather than
# `coverage` in green for the same reason this workflow has no schedule: it
# measures what executes while the harness loads, not what the suites cover.
# Nobody should read it as a quality gate, and the badge is written so nobody
# can.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kcov:
    name: kcov over the fast suites
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the libs after fish are kcov's runtime ones: setup-tool caches the
      # built binary, so on a cache hit nothing else pulls them in
      - name: Install zsh, fish and kcov's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish libdw1 libelf1 libcurl4 zlib1g libstdc++6

      # kcov is pinned and built from its GitHub source tarball like every
      # other tool here: it publishes no binary asset, and it reaches Debian
      # and Ubuntu only through a PPA - so `apt-get install kcov` is not a
      # thing this runner (or a contributor's machine) can rely on.
      - uses: ./.github/actions/setup-tool
        with:
          tool: kcov

      # No shellcheck/shfmt/checkbashisms here on purpose: tests/coverage.sh
      # drops the `shellcheck` suite from the sweep (it is a linter run over
      # the tree, not a path through hi's bash), so nothing left in the group
      # invokes them. The host report names them and prints "(absent)", which
      # is not a failure.
      - name: Run the fast suites under kcov
        run: tests/coverage.sh coverage-report

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error
          retention-days: 90

      # One line for pages.yml to turn into README's kcov badge. Separate from
      # the report above because the two have different lifetimes: the report
      # is a 90-day artifact somebody downloads, this is a number the site
      # re-reads on every deploy until the next coverage run replaces it.
      #
      # sed, not jq: the self-hosted runner is not guaranteed to have jq. The
      # anchor is load-bearing - kcov writes "percent_covered" nineteen times
      # in this file, once per traced file inline inside a `{...}`, and once
      # for the whole run on a line of its own. Only the aggregate starts a
      # line, so `^[[:space:]]*` is what picks it out; without it the first
      # per-file figure wins and the badge shows whichever file kcov happened
      # to list first.
      - name: Write the badge figure
        run: |
          set -euo pipefail
          src=coverage-report/merged/kcov-merged/coverage.json
          if [ ! -f "$src" ]; then
            echo "::warning::$src is missing - no badge figure to publish"
            exit 0
          fi
          pct="$(sed -n 's/^[[:space:]]*"percent_covered"[[:space:]]*:[[:space:]]*"\{0,1\}\([0-9.]*\).*/\1/p' "$src" | tail -1)"
          case "$pct" in '' | *[!0-9.]*)
            echo "::warning::could not read percent_covered out of $src"
            exit 0
            ;;
          esac
          mkdir -p coverage-pct
          printf '%s\n' "$pct" >coverage-pct/pct
          echo "kcov reports ${pct}% of lines executed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('coverage-pct/pct') != ''
        with:
          name: coverage-pct
          path: coverage-pct
          if-no-files-found: error
