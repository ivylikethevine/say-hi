name: Coverage

# kcov and bashcov, each over the full suite sweep (test_runner.sh's every-
# suite default: fast plus whichever e2e backends the runner has - docker and
# ssh here; kube/nomad/podman stand down as SKIPPED, nothing installs them),
# published as artifacts - visibility, never a gate: no PR waits on either
# and no threshold fails one. The average of the two badges is the coverage
# figure; docs/TESTING.md's Coverage and profiling section says why there
# are two and how each skews.
#
# Each tool is sharded 4 ways (shard-<tool>, --shard i/4, spreading the e2e
# suites that drive wall clock) and merged by its own gather-<tool>, rather
# than one matrix over tool, so neither tool's queue waits on the other's.
#
# Both tracers follow a child only when it is bash (bashcov rides on
# SHELLOPTS=xtrace, kcov on a DEBUG trap), and ubuntu's /bin/sh is dash, so
# the `#!/bin/sh` files the suites run as `sh <file>` children
# (common/targets.sh, three points of the badge) would read 0% here and on
# no other box. Each driver (tests/coverage.sh, tests/coverage_v2.sh) puts a
# `sh -> bash` symlink first on its own PATH before it sweeps, on every run -
# local ones included, not only a shard's. Correctness under dash is ci.yml's
# job, not this one's.
#
# workflow_run so every green push to main refreshes both figures; each job
# gates on the run's conclusion and event, and checkout uses the default ref,
# never the triggering run's payload. pages.yml deploys only when this
# workflow completes, so a badge shows this run's figure as soon as the
# sweep is done.
#
# pull_request too, for the comment job at the bottom: a same-repo, non-draft
# PR runs the same sweep and gets both figures posted beside main's, one
# comment edited in place per push. Never a fork's: pages.yml reads the
# figures off the newest green run of this workflow on branch `main`, which a
# fork PR opened from its own `main` would be (runner_test.sh pins the gate).
# Concurrency groups carry the PR number so a PR's sweep never cancels main's.
#
# A push whose tree its same-repo PR run already swept is not swept again:
# that run's `comment` job leaves a coverage-tree-<tree> marker
# (./.github/actions/mark-tree), and `reuse` republishes its two figures
# under this run, where pages.yml and release.yml look - ci.yml's
# push-to-main dedupe, same lookup.
#
# continue-on-error on every job, not workflow-level: pages.yml's lookup
# reads the *whole run's* conclusion, so one hard-failing shard would grey
# out both tools' badges. A gather merges whatever shards uploaded; a failed
# shard's badge goes stale rather than gating the run.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # ci.yml's type set, for the same draft-marked-ready reason
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The dedupe lookup (workflow_run/push only, for a tree whose PR run
  # published both figures) and the sweep's one eligibility gate, both here:
  # every sharded and gathering job below reads `sweep` instead of
  # re-deriving "a dispatch, a green push, or a same-repo PR" for itself.
  # Skipped on a draft, and everything below skips with it.
  reuse:
    name: gate the sweep, and reuse the PR run's figures where possible
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
      sweep: ${{ steps.gate.outputs.sweep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: find
        if: >-
          github.event_name != 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.workflow_run.head_commit.tree_id }}
        run: .github/scripts/find_tree_run.sh coverage.yml "coverage-tree-$TREE" coverage-pct coverage-v2-pct | tee -a "$GITHUB_OUTPUT"

      # the per-file reports stay on the PR run, which the step above logs
      - if: steps.find.outputs.run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{coverage-pct,coverage-v2-pct}"
          path: carried
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}

      - if: steps.find.outputs.run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-pct
          path: carried/coverage-pct
          if-no-files-found: error

      - if: steps.find.outputs.run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-v2-pct
          path: carried/coverage-v2-pct
          if-no-files-found: error

      # sweep: a dispatch, a green push, or a same-repo PR, and nothing
      # already reused above. `event_name == 'pull_request'` paired with
      # same-repo is the guard: a fork PR opened from its own
      # `main` would otherwise pass pages.yml's "newest green run on branch
      # main" lookup and publish as the README's figure. `always()` so a
      # failed or skipped `find` above still reaches this.
      - id: gate
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          PR_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          FOUND_RUN: ${{ steps.find.outputs.run }}
        run: |
          set -eu
          sweep=false
          if [ "$EVENT" = workflow_dispatch ] \
            || { [ "$WR_CONCLUSION" = success ] && [ "$WR_EVENT" = push ]; } \
            || { [ "$EVENT" = pull_request ] && [ "$PR_SAME_REPO" = true ]; }; then
            sweep=true
          fi
          [ -z "$FOUND_RUN" ] || sweep=false
          echo "sweep=$sweep" >>"$GITHUB_OUTPUT"

  # every-suite selection sliced 4 ways, per the header above; each shard
  # writes only its own $_HI_COV_DIR/parts/<suite> subdirectories, which are
  # disjoint across shards by construction (--shard partitions the suite
  # table, never splits a suite), so gather-kcov's `kcov --merge` over the
  # union is exactly the merge tests/coverage.sh would have done for the
  # whole sweep in one process.
  shard-kcov:
    name: kcov over the suite sweep (shard ${{ matrix.shard }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.sweep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: coverage-kcov-${{ github.event.pull_request.number || 'main' }}-${{ matrix.shard }}
      cancel-in-progress: true
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # plus kcov's runtime libraries
      - uses: $/.github/actions/setup-shells
        with:
          extra-packages: libdw1 libelf1 libcurl4 zlib1g libstdc++6

      # built from its GitHub source tarball (tools.txt's cmake kind): kcov
      # publishes no binary asset and reaches Debian/Ubuntu only
      # through a PPA. Cached by version+os+arch, so all four shards' runners
      # hit the cache rather than each rebuilding kcov from source.
      - uses: $/.github/actions/setup-tools
        with:
          tools: kcov

      # No --group: the default selection is every suite, same as an
      # unsharded run. The sh -> bash shim (the header says why) is the
      # driver's, not this step's: it shims its own PATH rather than writing to
      # GITHUB_PATH, which zizmor's github-env audit flags on a workflow_run
      # workflow.
      - name: Run this shard of the suite sweep under kcov
        env:
          HI_SHARD: ${{ matrix.shard }}
        run: tests/coverage.sh coverage-report --shard "$HI_SHARD"

      # job-index, not matrix.shard: an artifact name may not contain "/",
      # and --shard is a whole i/n slice (e.g. 4/4) - the index only has to
      # be unique per shard, which strategy.job-index already is
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-parts-kcov-${{ strategy.job-index }}
          path: coverage-report/parts
          if-no-files-found: error
          retention-days: 1

  shard-bashcov:
    name: bashcov over the suite sweep (shard ${{ matrix.shard }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.sweep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # job-level so the cache step below and check_tool_versions.sh's own
    # grep for the literal `BASHCOV_VERSION: "..."` both still find it
    env:
      BASHCOV_VERSION: "4.0.0"
    concurrency:
      group: coverage-bashcov-${{ github.event.pull_request.number || 'main' }}-${{ matrix.shard }}
      cancel-in-progress: true
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-shells

      # keyed on the version alone (every shard wants the same gem): a hit
      # skips the download and native build, `gem install` below still runs
      # and finds it already there rather than this replacing the step
      - name: Cache bashcov's installed gem
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/gem
          key: setup-bashcov-${{ runner.os }}-${{ runner.arch }}-${{ env.BASHCOV_VERSION }}

      # bashcov is a rubygem, and none of tools.txt's kinds fetch one, so the
      # pin lives here by hand - which makes it the one tool
      # check_tool_versions.sh cannot report drift on through tools.txt; its
      # own row in _WORKFLOW_ROSTER points at this file instead. ruby is
      # preinstalled on the hosted images; the apt install below is a
      # fallback that should never run.
      - name: Install ruby and bashcov
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          command -v ruby >/dev/null 2>&1 || sudo apt-get install -y ruby-full
          # zizmor flags this as an ad-hoc install, and the ignore rides on
          # the `run:` line above - a comment in here is shell text, not YAML,
          # and the audit never sees it. The version pin is the answer to the
          # finding: the lockfile it would rather see is a Gemfile for a
          # single gem in a job that installs nothing else. ci.yml audits
          # with no --min-severity, so even a low finding exits 12 - the
          # suppression has to be written down rather than assumed.
          # --user-install lands off the default PATH; coverage_v2.sh looks there
          gem install --user-install --no-document bashcov -v "$BASHCOV_VERSION"

      # the same driver-owned sh -> bash shim as shard-kcov's
      - name: Run this shard of the suite sweep under bashcov
        env:
          HI_SHARD: ${{ matrix.shard }}
        run: tests/coverage_v2.sh coverage-v2-report --shard "$HI_SHARD"

      # Only the resultset, not the whole coverage-v2-report tree: SimpleCov
      # writes an HTML report per shard too, and gather-bashcov has no use
      # for four partial, suite-incomplete copies of it - only the raw
      # per-line hit data merges cleanly (see gather-bashcov below).
      # include-hidden-files: upload-artifact drops dotfiles by default, and
      # .resultset.json is one - without this the step silently uploads
      # nothing and shard-bashcov's continue-on-error hides the failure.
      # job-index, not matrix.shard: see shard-kcov's upload above
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-parts-bashcov-${{ strategy.job-index }}
          path: coverage-v2-report/.resultset.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # kcov's own --merge takes any glob of independent kcov output directories,
  # which is exactly what four shards' parts/ uploads are - nothing about the
  # merge assumes they came from one process, one machine, or in order.
  gather-kcov:
    name: kcov - merge shards and publish
    needs: [reuse, shard-kcov]
    if: always() && needs.reuse.outputs.sweep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: coverage-kcov-gather-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: true
    continue-on-error: true
    steps:
      # Load-bearing, and not obvious: `kcov --merge` re-reads every source
      # file at the absolute path its shard recorded, so a gather job with no
      # working tree merges to `"files": []` and `"percent_covered": "0.00"`
      # - a badge reading 0.00% rather than an error. gather-bashcov needs
      # none: its ruby reads only the resultset's per-line arrays.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kcov is dynamically linked against these - shard-kcov's own
      # setup-shells call installs them for tracing, and the merge needs
      # them just as much: without this, `kcov --merge` only ever worked
      # because the runner image happened to carry them already. Sourced
      # directly (setup-backends/install.sh's own pattern) rather than
      # through setup-shells, which would install zsh and fish for nothing.
      - name: kcov's runtime libraries
        run: |
          set -euo pipefail
          # shellcheck source=.github/actions/apt/lib.sh
          source .github/actions/apt/lib.sh
          _hi_apt_drop_vendor_lists
          _hi_apt_update
          sudo apt-get install -y libdw1 libelf1 libcurl4 zlib1g libstdc++6

      - uses: $/.github/actions/setup-tools
        with:
          tools: kcov

      # merge-multiple flattens every matched artifact straight into one
      # directory rather than nesting one subdirectory per artifact name -
      # what makes this equivalent to an unsharded run's parts/: suite names
      # are disjoint across shards (--shard partitions the suite table), so
      # nothing here collides.
      - name: Download every kcov shard's parts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-parts-kcov-*
          path: coverage-report/parts
          merge-multiple: true

      # tests/coverage.sh --merge: the same kcov --merge, ranking, and
      # "an all-zero figure is not a measurement" refusal a local sweep's
      # tail already carries, so this job stops keeping its own second copy
      - name: Merge the shards and write the badge figure
        run: tests/coverage.sh --merge coverage-report coverage-report/parts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error
          retention-days: 90

      # One line pages.yml turns into README's badge (badges/coverage.json)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('coverage-report/coverage-pct/pct') != ''
        with:
          name: coverage-pct
          path: coverage-report/coverage-pct
          if-no-files-found: error

  # bashcov's SimpleCov .resultset.json is a plain hash keyed by
  # --command-name (the suite name), so four shards' resultsets are
  # disjoint-by-construction and merging them is a plain hash union - no
  # SimpleCov.merge, no lock file, just JSON. That is also exactly what the
  # existing badge/ranking code already does one level up (each iterates
  # every payload's "coverage" hash and sums per-file arrays across
  # entries), so this reuses the same shape rather than inventing a second
  # one. Only the full HTML index would need SimpleCov.collate (and the
  # simplecov gem installed here to call it) - deliberately skipped: nothing
  # downstream reads coverage-v2-report's HTML programmatically (pages.yml
  # only ever fetches the coverage-pct/coverage-v2-pct artifacts), so it is
  # not worth a second gem install in a job that otherwise needs only ruby.
  gather-bashcov:
    name: bashcov - merge shards and publish
    needs: [reuse, shard-bashcov]
    if: always() && needs.reuse.outputs.sweep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: coverage-bashcov-gather-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: true
    continue-on-error: true
    steps:
      # each shard's resultset lands in its own artifact-named subdirectory
      # (merge-multiple: false, the default) - never merge-multiple here:
      # every shard's file is literally named .resultset.json, and flattening
      # them into one directory would let the last download overwrite every
      # shard before it.
      - name: Download every bashcov shard's resultset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-parts-bashcov-*
          path: coverage-v2-report/shards

      # bashcov's SimpleCov .resultset.json has no aggregate percentage at
      # all, only per-line hit arrays, so ruby computes the badge figure too -
      # applying the tests/ + docs/ subject filters itself: coverage_v2.sh's
      # SimpleCov filters shape only the HTML report, while the resultset
      # stays raw, so without them the badge counts the harness and the
      # never-executed demo scripts against the product.
      - name: Merge the shards, rank the files, and write the badge figure
        run: |
          set -euo pipefail
          shopt -s nullglob
          shards=(coverage-v2-report/shards/*/.resultset.json)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "::warning::no bashcov shard resultsets were downloaded - nothing to merge"
            exit 0
          fi
          ruby -rjson -e '
            merged = {}
            ARGV.each do |f|
              JSON.parse(File.read(f)).each { |name, payload| merged[name] = payload }
            end
            File.write("coverage-v2-report/.resultset.json", JSON.generate(merged))

            # Every file bashcov traced, worst first - the same ranking
            # tests/coverage_v2.sh prints locally, reproduced here since this
            # merge happens in the gather job instead.
            root = Dir.pwd + "/"
            lines_by_file = Hash.new
            merged.each_value do |payload|
              (payload["coverage"] || {}).each do |file, data|
                lines = data.is_a?(Hash) ? data["lines"] : data
                if lines_by_file[file]
                  lines_by_file[file] = lines_by_file[file].each_with_index.map do |v, i|
                    [v, lines[i]].compact.sum if v || lines[i]
                  end
                else
                  lines_by_file[file] = lines.dup
                end
              end
            end
            rows = lines_by_file.map do |file, lines|
              relevant = lines.compact
              next if relevant.empty?
              hit = relevant.count { |c| c > 0 }
              [100.0 * hit / relevant.size, hit, relevant.size, file.sub(root, "")]
            end.compact
            rows.sort_by { |pct, _, _, path| [pct, path] }.each do |pct, hit, total, path|
              printf(" |   %6.2f%%  %5d/%-5d  %s\n", pct, hit, total, path)
            end

            relevant = lines_by_file.reject { |f, _|
              f.sub(root, "").start_with?("tests/", "docs/")
            }.values.flatten.compact
            if relevant.empty?
              puts "::warning::the merged resultset holds no product lines - no badge figure to publish"
            else
              pct = format("%.2f", 100.0 * relevant.count { |c| c > 0 } / relevant.size)
              Dir.mkdir("coverage-v2-pct")
              File.write("coverage-v2-pct/pct", pct + "\n")
              puts "bashcov reports #{pct}% of lines executed"
            end
          ' "${shards[@]}"

      # same dotfile exclusion as the shard upload above
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-v2-report
          path: coverage-v2-report/.resultset.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('coverage-v2-pct/pct') != ''
        with:
          name: coverage-v2-pct
          path: coverage-v2-pct
          if-no-files-found: error

  # A same-repo PR's two figures beside main's newest pair (pages.yml's own
  # lookup), as one comment edited in place on every push - see the header for
  # why never a fork's. The checkout is for that composite action alone;
  # nothing here runs the PR's code. A figure missing on either side reads
  # "not measured", never 0.
  comment:
    name: post the figures to the PR
    needs: [gather-kcov, gather-bashcov]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: coverage-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    continue-on-error: true
    # job-scoped, for Scorecard's Token-Permissions check: actions: read for
    # main's artifacts, pull-requests: write for the comment
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the marker the push landing this tree on main looks for (`reuse`)
      - uses: $/.github/actions/mark-tree
        with:
          prefix: coverage-tree

      # by pattern, so each lands in its own <artifact-name>/pct; a tool whose
      # gather published nothing is simply absent
      - name: Download this run's figures
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage*-pct
          path: ${{ runner.temp }}/pr

      # one lookup, both figures - dest-subdir carries no artifact name of its
      # own, so each still lands at main/<artifact-name>/pct, unchanged below
      - name: Fetch main's figures
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: "{coverage-pct,coverage-v2-pct}"
          dest-subdir: main
          found-message: main's figures from coverage run
          missing-message: no successful coverage run on main - no figures to compare

      # via env, never inline ${{ }} in the run block (zizmor: template-injection)
      - name: Post or update the coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker='<!-- say-hi coverage -->'
          # shellcheck source=.github/scripts/pct_ok.sh
          source .github/scripts/pct_ok.sh
          # a figure is a bare decimal or nothing: an artifact is data, and
          # nothing else read out of one reaches the comment. pct_ok is the
          # same refusal pages.yml and release.yml give an all-zero figure
          # (kcov's checkout-less merge, not a measurement).
          fig() {
            local v=""
            [ -f "$1" ] && IFS= read -r v <"$1" || true
            case "$v" in '' | . | *[!0-9.]* | *.*.*) v="" ;; esac
            pct_ok "$v" || v=""
            printf '%s' "$v"
          }
          # row <label> <this PR> <main>
          row() {
            local now="not measured" was="not measured" change="-"
            [ -z "$2" ] || now="$2%"
            [ -z "$3" ] || was="$3%"
            [ -z "$2" ] || [ -z "$3" ] || change="$(awk -v a="$2" -v b="$3" 'BEGIN { printf "%+.2f", a - b }')"
            printf '| %s | %s | %s | %s |\n' "$1" "$now" "$was" "$change"
          }
          avg() { [ -n "$1" ] && [ -n "$2" ] && awk -v a="$1" -v b="$2" 'BEGIN { printf "%.2f", (a + b) / 2 }' || true; }
          k="$(fig "$RUNNER_TEMP/pr/coverage-pct/pct")"
          b="$(fig "$RUNNER_TEMP/pr/coverage-v2-pct/pct")"
          k0="$(fig "$RUNNER_TEMP/main/coverage-pct/pct")"
          b0="$(fig "$RUNNER_TEMP/main/coverage-v2-pct/pct")"
          body="$(
            printf '%s\n### Coverage\n\n| | This PR | main | Change |\n| --- | ---: | ---: | ---: |\n' "$marker"
            row kcov "$k" "$k0"
            row bashcov "$b" "$b0"
            row '**average**' "$(avg "$k" "$b")" "$(avg "$k0" "$b0")"
            printf '\nThe average is the figure to quote, and neither gates anything ([why two](%s)). ' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/TESTING.md#coverage-and-profiling"
            printf 'Measured at %s by [this run](%s).\n' "$HEAD_SHA" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          )"
          printf '%s\n' "$body" >>"$GITHUB_STEP_SUMMARY"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")"
          id="${id%%$'\n'*}"
          if [ -n "$id" ]; then
            set -- -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          else
            set -- "repos/$GITHUB_REPOSITORY/issues/$PR/comments"
          fi
          # dependabot's token is read-only by default: say so, the summary has the table
          gh api "$@" -f body="$body" >/dev/null || {
            echo "::warning title=coverage comment::could not comment on PR #$PR - a read-only token? The table is in this job's summary."
            exit 0
          }
          echo "coverage comment updated on PR #$PR"
