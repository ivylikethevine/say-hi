name: FreeBSD e2e

# The BSD-userland path on a BSD that is not macOS: a vmactions FreeBSD VM on
# the hosted ubuntu runner runs the fast suites and then ssh's to itself, so
# one job covers client AND target - BSD sed/sort/date/mktemp, `base64`
# without `-d`, a pkg-installed bash rather than /bin/sh. This is what proves
# SUPPORT.md's "*BSD" row. ci.yml calls it on every push to main and every
# same-repository pull request once the fast-suite jobs are green; dispatch
# runs it on its own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback:
    name: hi localhost (FreeBSD both ends)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The VM shares the checkout over rsync, so ./hi.sh inside it is this
      # tree, and .github/scripts/bsd_loopback.sh (its header says why the
      # single `</dev/null`ed line) is reachable at the same path. `--group
      # fast`, not lint: lint is enforced once, on the ubuntu job, against
      # pinned tool versions.
      - name: Fast suites, then say hi to ourselves
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "14.2"
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y bash zsh fish git python3 gtar
          run: bash "$GITHUB_WORKSPACE/.github/scripts/bsd_loopback.sh" </dev/null
