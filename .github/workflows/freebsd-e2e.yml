name: FreeBSD e2e

# The BSD-userland path on a BSD that is not macOS: a vmactions FreeBSD VM on
# the hosted ubuntu runner runs the fast suites and then ssh's to itself, so
# one job covers client AND target - BSD sed/sort/date/mktemp, `base64`
# without `-d`, a pkg-installed bash rather than /bin/sh. This is what proves
# COMPATIBILITY.md's "*BSD" row. ci.yml calls it on every push to main and every
# same-repository pull request once the fast-suite jobs are green.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  loopback:
    name: hi localhost (FreeBSD both ends)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Off this job's own audit log: the VM image and builder from the
          # release hosts, pkg.freebsd.org for the guest's packages, and the NTP
          # the guest sets its clock from - all four pool members, since it
          # picks among them. The Ubuntu mirrors are added because that run
          # installed qemu from actions/cache ("Need to get 0 B") and so named
          # no mirror at all.
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            pkg.freebsd.org:443
            cloudfront.aws.pkgbase.freebsd.org:443
            0.freebsd.pool.ntp.org:123
            1.freebsd.pool.ntp.org:123
            2.freebsd.pool.ntp.org:123
            3.freebsd.pool.ntp.org:123
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            dl.google.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The VM shares the checkout over rsync, so ./hi.sh inside it is this
      # tree, and .github/scripts/bsd_loopback.sh (its header says why the
      # single `</dev/null`ed line) is reachable at the same path. `--group
      # fast`, not lint: lint is enforced once, on the ubuntu job, against
      # pinned tool versions.
      - name: Fast suites, then say hi to ourselves
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          # the newest release this action pin ships (its README's table);
          # 14.2 went EOL
          release: "15.1"
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y bash zsh fish git python3 gtar
          run: bash "$GITHUB_WORKSPACE/.github/scripts/bsd_loopback.sh" </dev/null
