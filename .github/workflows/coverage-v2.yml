name: Coverage (bashcov)

# bashcov over the fast suites, published as an artifact - visibility, never a
# gate; coverage.yml's sibling, chained the same way. The over-count stands
# (tests/coverage_v2.sh's WHY A SECOND COVERAGE SCRIPT): bashcov reads bash's
# xtrace, so it keeps the suites kcov loses (git_prompt.sh 92.68% vs 2.56%),
# but marks every heredoc-body line covered - hi.sh's two connect functions,
# 182 lines --group fast never runs, report 100% - so the README badge says
# `heredoc-inflated` in grey, under an accuracy disclaimer.
#
# workflow_run for the same reason as coverage.yml's, with the same
# conclusion/event gate and the same one-deploy badge lag.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# pushes to main can stack; only the newest figure matters
concurrency:
  group: coverage-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bashcov:
    name: bashcov over the fast suites
    # only a green push to main measures; a manual dispatch passes the first
    # clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh and fish
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      # No setup-tool step: bashcov is a rubygem, and every `kind` tools.txt
      # knows fetches a GitHub release asset, so the pin lives here by hand -
      # which makes bashcov the one tool check_tool_versions.sh cannot report
      # drift on. ruby is preinstalled on the hosted images; the apt install
      # below is a fallback that should never run.
      - name: Install ruby and bashcov
        env:
          BASHCOV_VERSION: "4.0.0"
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          command -v ruby >/dev/null 2>&1 || sudo apt-get install -y ruby-full
          # zizmor flags this as an ad-hoc install, and the ignore rides on
          # the `run:` line above - a comment in here is shell text, not YAML,
          # and the audit never sees it. The version pin is the answer to the
          # finding: the lockfile it would rather see is a Gemfile for a single
          # gem in a job that installs nothing else. ci.yml audits with no
          # --min-severity, so even a low finding exits 12 - the suppression
          # has to be written down rather than assumed.
          gem install --user-install bashcov -v "$BASHCOV_VERSION"
          # --user-install puts the binary somewhere off the default PATH;
          # coverage_v2.sh looks there itself, but exporting it here keeps the
          # step below readable and lets `bashcov --version` be the smoke test
          for d in "$HOME"/.local/share/gem/ruby/*/bin; do
            [ -x "$d/bashcov" ] && echo "$d" >>"$GITHUB_PATH"
          done

      - name: Show the bashcov version
        run: bashcov --version

      # No shellcheck/shfmt/checkbashisms on purpose: tests/coverage_v2.sh
      # drops the `shellcheck` suite from the sweep, so the host report's
      # "(absent)" for them is not a failure.
      - name: Run the fast suites under bashcov
        run: tests/coverage_v2.sh coverage-v2-report

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-v2-report
          path: coverage-v2-report
          if-no-files-found: error
          retention-days: 90

      # One line for pages.yml to turn into README's bashcov badge, on
      # coverage.yml's split. ruby, not sed: SimpleCov's .resultset.json has no
      # aggregate percentage, only per-line hit arrays, so it is computed here;
      # the filters coverage_v2.sh applies are already baked into the resultset.
      - name: Write the badge figure
        run: |
          set -euo pipefail
          src=coverage-v2-report/.resultset.json
          if [ ! -f "$src" ]; then
            echo "::warning::$src is missing - no badge figure to publish"
            exit 0
          fi
          pct="$(ruby -rjson -e '
            merged = {}
            JSON.parse(File.read(ARGV[0])).each_value do |payload|
              (payload["coverage"] || {}).each do |file, data|
                lines = data.is_a?(Hash) ? data["lines"] : data
                if merged[file]
                  merged[file] = merged[file].each_with_index.map do |v, i|
                    [v, lines[i]].compact.sum if v || lines[i]
                  end
                else
                  merged[file] = lines.dup
                end
              end
            end
            relevant = merged.values.flatten.compact
            exit 1 if relevant.empty?
            printf("%.2f", 100.0 * relevant.count { |c| c > 0 } / relevant.size)
          ' "$src")" || {
            echo "::warning::could not compute a percentage out of $src"
            exit 0
          }
          mkdir -p coverage-v2-pct
          printf '%s\n' "$pct" >coverage-v2-pct/pct
          echo "bashcov reports ${pct}% of lines executed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('coverage-v2-pct/pct') != ''
        with:
          name: coverage-v2-pct
          path: coverage-v2-pct
          if-no-files-found: error
