name: Publish external channels

# The AUR push - the one channel release.yml does not reach on its own. It
# used to run automatically once a tag's `publish` job was approved, and the
# Homebrew tap PR sat beside it here; the tap moved back into release.yml
# (its `tap` job, after `brew`) once the tap repo existed and its formula had
# passed a real Mac. The AUR stays a second, later, explicit decision, made by
# dispatching this workflow by hand against a tag that has already published:
# registration is closed to new accounts, its push has no PR to hide behind,
# and until an account and AUR_SSH_KEY exist the job says so and does nothing.
#
# No `build` job here to hand this a same-run artifact: it downloads its
# manifest straight off the release `publish` already attached it to
# (`gh release download`), which is what lets this run any time after that -
# a fixed retry when a first attempt failed, or a deliberate wait while the
# release itself gets a look before it reaches the AUR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: an already-published release tag to publish externally (e.g. v1.0.0)
        required: true

permissions:
  contents: read

# One dispatch per tag at a time; a second run against the same tag while the
# first is still pushing would race it for nothing - cancelling only rewinds
# the branch the first is about to push over.
concurrency:
  group: publish-external-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # A plain git push over ssh - the AUR has no PR mechanism - so the safety is
  # the human gate above (`environment: release`) plus pushing exactly the two
  # files the release carries. Deliberately does NOT run namcap (it needs an
  # Arch box, so each package's first push is still a manual, namcap'd one -
  # docs/PACKAGING.md) and does NOT touch say-hi-git (it builds from `main`
  # and has no version to bump). No secret, no push: it prints what to copy
  # and exits 0.
  aur:
    name: push the AUR package
    # a v0.0.x debug tag or a prerelease tag reaches no external channel: the
    # first are debug tags pushed to exercise the release path, the second are
    # candidates whose version is not a legal pkgver besides
    if: ${{ !startsWith(github.event.inputs.tag, 'v0.0.') && !contains(github.event.inputs.tag, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download the manifests off the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/manifests
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir dist/manifests --pattern PKGBUILD --pattern .SRCINFO

      - name: Push PKGBUILD and .SRCINFO to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "no AUR_SSH_KEY secret - the AUR package was NOT updated;"
            echo "copy dist/manifests/PKGBUILD and .SRCINFO to the aur/say-hi repo by hand,"
            echo "after running the namcap gate in docs/PACKAGING.md"
            exit 0
          fi
          # the key never touches the workspace: $RUNNER_TEMP is outside it, and
          # the host key is pinned by keyscan rather than accepted on first use
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$AUR_SSH_KEY" >"$RUNNER_TEMP/ssh/aur"
          chmod 600 "$RUNNER_TEMP/ssh/aur"
          ssh-keyscan -t ed25519 aur.archlinux.org >"$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"

          git clone --depth 1 ssh://aur@aur.archlinux.org/say-hi.git aur
          cp dist/manifests/PKGBUILD aur/PKGBUILD
          cp dist/manifests/.SRCINFO aur/.SRCINFO
          cd aur
          # only those two files are ever tracked in an AUR repo: a stray file
          # pushed there is a package that fails to build for everyone
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "refusing to push: the AUR checkout has untracked files" >&2
            git status --short >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "AUR package already current - nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "say-hi $TAG"
          git push origin master
