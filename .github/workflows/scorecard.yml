name: Scorecard

# OpenSSF Scorecard, weekly: a supply-chain score is only useful as a trend,
# and the checks it grades move when dependabot bumps an action. The SARIF
# goes to code scanning (findings in the Security tab with file and line) and
# publish_results puts the score on the OpenSSF API README's badge reads.
# publish_results fires on workflow_dispatch too (the action's gate is only
# "not a pull_request"), so a manual run confirms a fix without waiting.
on:
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

# read-all is the floor; job-level permissions replace this block rather than
# adding to it, which is why the job spells out its read scopes again.
permissions: read-all

jobs:
  analysis:
    name: supply-chain scorecard
    # A literal, not vars.RUNNER_LABEL: publish_results has the scorecard
    # webapp re-fetch this file and check `runs-on:` with a static parser that
    # never evaluates expressions, so an expression fails its
    # ^ubuntu-(latest|NN.NN)(-arm)?$ check and the submission is rejected
    # while the job itself goes green (docs/ROADMAP.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately no `environment:` gate: a schedule cannot pass a required
    # reviewer, so every weekly run would sit queued. release.yml's `release`
    # environment is the one that matters.
    permissions:
      contents: read
      # the only write scopes in this file: code scanning takes the SARIF, and
      # publish_results signs the score it sends with an OIDC token
      security-events: write
      id-token: write
      # Dangerous-Workflow and Token-Permissions read workflow definitions
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # kept alongside the code-scanning upload: the artifact is the whole
      # report as the tool emitted it, for reading a run by hand; code scanning
      # keeps only what it can map to a line.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error

      - name: Upload the findings to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
