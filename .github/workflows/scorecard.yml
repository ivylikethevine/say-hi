name: Scorecard

# OpenSSF Scorecard. The SARIF goes to code scanning (findings in the Security
# tab with file and line), and publish_results puts the score on the OpenSSF
# API the README badge reads. publish_results fires on every non-pull_request
# event (the action's only gate), so every trigger below publishes.
#
# workflow_run so a green push to main refreshes the score the same day; the
# job gates on the run's conclusion and event, and checkout uses the default
# ref, never the triggering run's payload. The weekly cron re-grades against
# upstream's moving checks in a quiet week, and branch_protection_rule
# re-grades Branch-Protection the moment a rule changes.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

# pushes to main can stack; only the newest score matters
concurrency:
  group: scorecard
  cancel-in-progress: true

# read-all is the floor; job-level permissions replace this block rather than
# adding to it, which is why the job spells out its read scopes again.
permissions: read-all

jobs:
  analysis:
    name: supply-chain score (scorecard)
    # only a green push to main gets a fresh score; the other triggers pass
    # the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    # A literal, not an expression: publish_results has the scorecard webapp
    # re-fetch this file and check `runs-on:` with a static parser, so an
    # expression gets the submission rejected while the job goes green. The
    # same check allows no top-level env or defaults, and only the actions
    # used below.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the only write scopes in this file: code scanning takes the SARIF, and
      # publish_results signs the score it sends with an OIDC token
      security-events: write
      id-token: write
      # Dangerous-Workflow and Token-Permissions read workflow definitions
      actions: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          # Scorecard's probes go to a stable set of named services: the OSSF
          # APIs, OSV, deps.dev, the best-practices badge, oss-fuzz's build
          # logs, Docker Hub (Dockerfile pins), and sigstore for the signed
          # result.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            api.deps.dev:443
            api.osv.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            index.docker.io:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # kept alongside the code-scanning upload: the artifact is the whole
      # report as the tool emitted it; code scanning keeps only what it can
      # map to a line.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error

      - name: Upload the findings to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
