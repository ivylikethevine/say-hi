name: Scorecard

# OpenSSF Scorecard. The SARIF goes to code scanning (findings in the Security
# tab with file and line), and publish_results puts the score on the OpenSSF
# API the README badge reads. publish_results fires on every non-pull_request
# event (the action's only gate), so every trigger below publishes.
#
# workflow_run so a green push to main refreshes the score the same day; the
# job gates on the run's conclusion and event, and checkout uses the default
# ref, never the triggering run's payload. The weekly cron re-grades against
# upstream's moving checks in a quiet week, a ruleset change included: Actions
# has no event for rulesets.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

# pushes to main can stack; only the newest score matters
concurrency:
  group: scorecard
  cancel-in-progress: true

# read-all is the floor; job-level permissions replace this block rather than
# adding to it, which is why the job spells out its read scopes again.
permissions: read-all # zizmor: ignore[excessive-permissions]

jobs:
  analysis:
    name: supply-chain score (scorecard)
    # only a green push to main gets a fresh score; the other triggers pass
    # the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    # A literal, not an expression: publish_results has the scorecard webapp
    # re-fetch this file and check `runs-on:` with a static parser, so an
    # expression gets the submission rejected while the job goes green. The
    # same check allows no top-level env or defaults, and only the actions
    # used below.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # code scanning takes the SARIF
      id-token: write # publish_results signs the score it sends
      actions: read # Dangerous-Workflow and Token-Permissions read workflows
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          # Scorecard's probes go to a stable set of named services: the OSSF
          # APIs, OSV, deps.dev, the best-practices badge, oss-fuzz's build
          # logs, Docker Hub (Dockerfile pins), and sigstore for the signed
          # result.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            api.deps.dev:443
            api.osv.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            index.docker.io:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # kept alongside the code-scanning upload: the artifact is the whole
      # report as the tool emitted it; code scanning keeps only what it can
      # map to a line.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error

      - name: Upload the findings to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
