# Jekyll config for the GitHub Pages site (.github/workflows/pages.yml). Nothing
# else reads it, and no Ruby is a dependency here: actions/jekyll-build-pages
# supplies the github-pages gem, the theme and every plugin below.

title: say-hi
description: >-
  A greeting, a prompt and your aliases on every machine you ssh, docker,
  podman, nomad or kubectl into - without installing anything there.
remote_theme: pages-themes/minimal@v0.2.0

# readme-index: README.md is the site index; there is no index.md and there
#   should not be.
# relative-links: rewrites in-repo links like docs/GLOSSARY.md to the pages
#   they render as; without it every cross-link 404s on the site.
# optional-front-matter: no file here carries front matter, and none must -
#   they are read in the repo first and on the site second.
# titles-from-headings: each page's <title> is its own H1.
plugins:
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-remote-theme

# Without a layout, front-matter-less pages render with no theme chrome.
defaults:
  - scope:
      path: ''
    values:
      layout: default

relative_links:
  enabled: true
  collections: true

readme_index:
  with_frontmatter: true

# The site is the prose: code, tooling and packaging stay off it. docs/tapes/
# is laid over the built site by pages.yml (the committed demo.gif plus the
# demos.yml renders), and README.md links the GIFs at their published URLs.
# docs/tldr.md is a draft for an upstream tldr-pages PR and has to keep tldr's
# `{{placeholder}}` syntax byte-for-byte, which Liquid would parse, so it is
# kept off the site rather than guarded; nothing links to it relatively.
# tests/lint/drift_test.sh derives its Liquid sweep from this block: one bare
# `- path` per line, comments on their own lines.
exclude:
  - common/
  - scripts/
  - tests/
  - packaging/
  - settings/
  - docs/tapes/
  - docs/hi.1
  - hi.sh
  - load.sh
  - CLAUDE.md
  - docs/tldr.md
