# hadolint rules for tests/dockerfiles - throwaway test fixtures, not shipped
# images, which is what every ignore below turns on. Each names its reason; a
# rule silenced without one is a rule nobody can put back.
ignored:
  # DL3008/DL3018: pin apt/apk versions. The base image is digest-pinned
  # instead (dependabot watches it); per-package pins would freeze dozens of
  # versions nothing watches, for packages hi's behaviour never depends on.
  - DL3008
  - DL3018

  # DL3002: last USER should not be root. The framework fixture ends on `USER
  # root` because its entrypoint runs ssh-keygen and binds a privileged port.
  - DL3002

  # DL3066: non-numeric user id. `hitest` is the point - the demos render a
  # real username - and nothing shares a uid namespace with a host that cares.
  - DL3066

  # SC2016: expressions in single quotes. Lines like `eval "$(starship init
  # bash)"` are written into dotfiles for the *target's* shell to expand;
  # double quotes would expand them at build time. Most moved to
  # tests/dockerfiles/frameworks/*.sh with per-line disables; the ignore stays
  # for the sed in installed-pkg.
  - SC2016

# Not ignored: DL3009 (apt lists left in the layer) and DL3015 (no
# --no-install-recommends) are real, low priority on fixtures built once and
# thrown away, and left visible on purpose - the job is advisory. DL4006 (piped
# RUN without pipefail) was real and is fixed: framework.Dockerfile sets
# `SHELL -o pipefail` and every script sets it itself.
failure-threshold: error
