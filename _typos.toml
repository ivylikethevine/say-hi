# The allowlist for the lint gate's typos half (tests/lint/shellcheck_test.sh,
# lint_typos): words the checker reads as misspellings and are not. Each entry
# says what it is, so a real typo cannot hide behind a stale exception.
[default]
extend-ignore-re = [
  "\\[Tt\\]ags",  # core.sh's case pattern for Tags:/tags:, split as `ags`
  "mis-parse",    # the hyphenated form, split at the hyphen
]

[default.extend-words]
tre = "tre"                    # the package (a `tree` alternative), settings/packages
darcula = "darcula"            # the IntelliJ theme, named as a vim colorscheme
unparseable = "unparseable"    # a spelling, not a typo

[default.extend-identifiers]
ACI = "ACI"                    # Azure Container Instances, docs/UNSUPPORTED.md
BRE = "BRE"                    # POSIX basic regular expressions, docs/GLOSSARY.md
